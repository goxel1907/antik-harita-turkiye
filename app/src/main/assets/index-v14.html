<script>
'use strict';
const TS=256,MIN_Z=11;
const PERIODS=['Tümü','Helenistik','Roma','Bizans','Selçuklu','Osmanlı','Hitit','Frig','Urartu','Neolitik'];
const TYPES=['Tümü','Yerleşim','Mezar','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Dini','Yapı','Potansiyel'];
const CAT={
  Yerleşim:{i:'🏛',c:'#b44940',n:'Yerleşim / arkeoloji'},
  Mezar:{i:'⚱',c:'#8f684d',n:'Mezar / nekropol'},
  Yol:{i:'≋',c:'#8d5b40',n:'Tarihî yol / güzergâh'},

  Savunma:{i:'🏰',c:'#6b4db0',n:'Kale / savunma'},
  Geçiş:{i:'↔',c:'#3585b7',n:'Köprü / geçit'},
  Su:{i:'💧',c:'#248fb8',n:'Su yapısı'},
  Mağara:{i:'◒',c:'#6b6b6b',n:'Yayımlanmış tarihî mağara'},
  Dini:{i:'⛪',c:'#7b5f88',n:'Tarihî dini yapı'},
  Yapı:{i:'▣',c:'#4f7759',n:'Diğer tarihî yapı'}
};
let lat=39,lon=35.2,zoom=6,period='Tümü',type='Tümü',items=[],incoming=[],loadTimer=null,requestSeq=0,latestRequest=0,net='idle',sourceCounts={},gesture=null,pinch=null,mouseDrag=null;
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),svg=document.getElementById('svg'),markers=document.getElementById('markers'),sheet=document.getElementById('sheet'),hint=document.getElementById('hint'),summary=document.getElementById('summary');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),world=z=>TS*Math.pow(2,z);
function project(a,o,z){const s=world(z),x=(o+180)/360*s,sn=Math.sin(clamp(a,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}
function unproject(x,y,z){const s=world(z),o=x/s*360-180,n=Math.PI-2*Math.PI*y/s,a=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[a,o]}
function cw(){return project(lat,lon,zoom)}
function screen(a,o){const c=cw(),p=project(a,o,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=cw(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=2**zoom;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.decoding='async';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function moveLayers(dx,dy){const t=`translate3d(${dx}px,${dy}px,0)`;tiles.style.transform=t;svg.style.transform=t;markers.style.transform=t}
function resetLayers(){tiles.style.transform='';svg.style.transform='';markers.style.transform=''}
function hav(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}
function dtext(k){return k<1?Math.round(k*1000)+' m':k.toFixed(k<10?1:0)+' km'}
function norm(s){return String(s||'').toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşü]+/gi,' ').trim()}
function periodTags(t){const s=[t.period,t.start_date,t['historic:period'],t['historic:civilization'],t.civilization,t.description,t.old_name,t.name,t.instance,t.heritage].filter(Boolean).join(' ').toLowerCase(),o=[];for(const[p,r]of[['Helenistik',/hellen|helen/],['Roma',/roman|roma\b/],['Bizans',/byzant|bizans/],['Selçuklu',/seljuk|selçuk/],['Osmanlı',/ottoman|osmanl/],['Hitit',/hittite|hitit/],['Frig',/phryg|frig/],['Urartu',/urartu/],['Neolitik',/neolith|neolit/]])if(r.test(s))o.push(p);return o}
function classify(t){const h=(t.historic||'').toLowerCase(),a=(t.archaeological_site||'').toLowerCase(),n=((t.name||'')+' '+(t.description||'')+' '+(t.heritage||'')).toLowerCase();if(['tomb','grave','necropolis'].includes(h)||/necropolis|nekropol|mezar|tumulus|tümülüs/.test(n)||['necropolis','tumulus'].includes(a))return'Mezar';if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes')return'Yerleşim';if(['road','route','milestone'].includes(h)||t['route:historic']==='yes')return'Yol';if(['caravanserai','inn'].includes(h)||t.tourism==='caravanserai'||/kervansaray|caravanserai|\bhan\b/.test(n))return'Konaklama';if(['castle','fort','fortification','city_gate','citywalls','tower','bunker'].includes(h)||t.fortification_type)return'Savunma';if(h==='bridge'||(t.ford==='yes'&&t.historic)||t.mountain_pass==='yes')return'Geçiş';if(['aqueduct','well','fountain'].includes(h)||(t.man_made==='water_well'&&t.historic))return'Su';if(t.natural==='cave_entrance'&&(t.historic||t.heritage||t.archaeological_site))return'Mağara';if(['church','mosque','monastery','temple','wayside_shrine','chapel'].includes(h)||/kilise|cami|manastır|tapınak|şapel|church|mosque|monastery|temple/.test(n))return'Dini';if(t.historic||t.heritage)return'Yapı';return null}
function classifyWd(text){const n=norm(text);if(/nekropol|necropolis|tumulus|tümülüs|tomb|mezar|mausoleum/.test(n))return'Mezar';if(/archaeological|arkeolojik|ancient city|antik kent|ruins|ören/.test(n))return'Yerleşim';if(/castle|fortification|fortress|kale|hisar|sur/.test(n))return'Savunma';if(/bridge|köprü|geçit/.test(n))return'Geçiş';if(/caravanserai|kervansaray|\bhan\b/.test(n))return'Konaklama';if(/aqueduct|su kemeri|fountain|çeşme|well|kuyu/.test(n))return'Su';if(/cave|mağara/.test(n))return'Mağara';if(/church|mosque|monastery|temple|kilise|cami|manastır|tapınak/.test(n))return'Dini';return'Yapı'}
function keep(t){return !!(t.historic||t.heritage||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes'||t['route:historic']==='yes'||(t.natural==='cave_entrance'&&(t.historic||t.heritage||t.archaeological_site)))}
function tagsOf(el){const t={};for(const c of el.children)if(c.tagName==='tag')t[c.getAttribute('k')]=c.getAttribute('v');return t}
function centroid(g){if(!g.length)return null;let a=0,o=0;for(const p of g){a+=+p.lat;o+=+p.lon}return[a/g.length,o/g.length]}
function makeItem(id,t,a,o,g,src){if(!keep(t))return null;const kind=classify(t);if(!kind||a==null||o==null)return null;return{id,lat:+a,lon:+o,tags:t,kind,name:t['name:tr']||t.name||t.old_name||('Adsız '+CAT[kind].n),periods:periodTags(t),geometry:g||[],sources:[src]}}
function parseXml(raw,src){const xml=new DOMParser().parseFromString(raw,'text/xml'),nodes=new Map(),out=[];for(const n of xml.getElementsByTagName('node')){const t=tagsOf(n),p={lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon')};nodes.set(n.getAttribute('id'),p);const it=makeItem('osm-node:'+n.getAttribute('id'),t,p.lat,p.lon,[],src);if(it)out.push(it)}for(const w of xml.getElementsByTagName('way')){const t=tagsOf(w);if(!keep(t))continue;const g=[];for(const nd of w.getElementsByTagName('nd')){const p=nodes.get(nd.getAttribute('ref'));if(p)g.push(p)}const c=centroid(g);if(c){const it=makeItem('osm-way:'+w.getAttribute('id'),t,c[0],c[1],g,src);if(it)out.push(it)}}return out}
function parseOverpass(raw,src){const j=JSON.parse(raw),out=[];for(const e of j.elements||[]){const t=e.tags||{};let a=e.lat,o=e.lon,g=e.geometry||[];if((a==null||o==null)&&e.center){a=e.center.lat;o=e.center.lon}if((a==null||o==null)&&g.length){const c=centroid(g);if(c){a=c[0];o=c[1]}}const it=makeItem('osm-'+e.type+':'+e.id,t,a,o,g,src);if(it)out.push(it)}return out}
function parseWd(raw,src){const j=JSON.parse(raw),out=[];for(const b of j.results?.bindings||[]){const m=(b.location?.value||'').match(/Point\(([-0-9.]+)\s+([-0-9.]+)\)/);if(!m)continue;const o=+m[1],a=+m[2],name=b.itemLabel?.value||'Adsız Wikidata kaydı',instance=b.instanceLabel?.value||'',heritage=b.heritageLabel?.value||'',kind=classifyWd(name+' '+instance+' '+heritage),qid=(b.item?.value||'').split('/').pop()||Math.random().toString(36).slice(2),t={name,instance,heritage};out.push({id:'wd:'+qid,lat:a,lon:o,tags:t,kind,name,periods:periodTags(t),geometry:[],sources:[src]})}return out}
function mergeItems(arr){const out=[],byId=new Map(),bySig=new Map();for(const x of arr){if(!x||!Number.isFinite(x.lat)||!Number.isFinite(x.lon))continue;if(byId.has(x.id)){const old=byId.get(x.id);old.sources=[...new Set([...(old.sources||[]),...(x.sources||[])])];if(!old.geometry.length&&x.geometry.length)old.geometry=x.geometry;continue}const sig=norm(x.name)+'|'+x.lat.toFixed(3)+'|'+x.lon.toFixed(3);if(norm(x.name)&&bySig.has(sig)){const old=bySig.get(sig);old.sources=[...new Set([...(old.sources||[]),...(x.sources||[])])];if(!old.geometry.length&&x.geometry.length)old.geometry=x.geometry;continue}byId.set(x.id,x);bySig.set(sig,x);out.push(x)}return out}
function matches(it){return(type==='Tümü'||it.kind===type)&&(period==='Tümü'||it.periods.includes(period))}
function visible(){return items.filter(matches)}
function color(k){return CAT[k]?.c||'#777'}
function drawGeometry(list){svg.innerHTML='';if(zoom<14)return;for(const it of list){if(!it.geometry||it.geometry.length<2)continue;let d='';for(let i=0;i<it.geometry.length;i++){const p=screen(+it.geometry[i].lat,+it.geometry[i].lon);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill',it.geometry.length>3?'rgba(239,199,104,.08)':'none');path.setAttribute('stroke',color(it.kind));path.setAttribute('stroke-width',it.kind==='Yol'?4:2);path.setAttribute('stroke-opacity','.82');svg.appendChild(path)}}
function renderData(){markers.innerHTML='';const list=visible();drawGeometry(list);if(type==='Potansiyel'){drawPotential();updateSummary([]);return}if(zoom<=13){const cell=zoom<=11?110:zoom===12?86:68,grid=new Map();for(const it of list){const p=screen(it.lat,it.lon);if(p[0]<-100||p[1]<-100||p[0]>innerWidth+100||p[1]>innerHeight+100)continue;const k=it.kind+':'+Math.round(p[0]/cell)+':'+Math.round(p[1]/cell),g=grid.get(k)||[];g.push(it);grid.set(k,g)}for(const g of grid.values()){const a=g.reduce((s,x)=>s+x.lat,0)/g.length,o=g.reduce((s,x)=>s+x.lon,0)/g.length,p=screen(a,o),el=document.createElement('div');el.className='marker cluster';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.style.borderColor=color(g[0].kind);el.innerHTML=(CAT[g[0].kind]?.i||'•')+' '+g.length;el.onclick=e=>{e.stopPropagation();showList(g,CAT[g[0].kind].n)};markers.appendChild(el)}}else{const showLabels=zoom>=14;for(const it of list){const p=screen(it.lat,it.lon);if(p[0]<-140||p[1]<-100||p[0]>innerWidth+220||p[1]>innerHeight+100)continue;const el=document.createElement('div');el.className='marker poi';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.style.background=color(it.kind);el.textContent=CAT[it.kind]?.i||'•';el.onclick=e=>{e.stopPropagation();showItem(it)};markers.appendChild(el);if(showLabels){const lab=document.createElement('div');lab.className='label';lab.style.left=p[0]+'px';lab.style.top=p[1]+'px';lab.textContent=(CAT[it.kind]?.n.split(' / ')[0]||it.kind)+' • '+it.name;lab.onclick=e=>{e.stopPropagation();showItem(it)};markers.appendChild(lab)}}}updateSummary(list)}
function drawPotential(){const list=items;if(zoom<13||list.length<3){summary.innerHTML='<b>Potansiyel bağlam için yeterli kamu kaydı yok</b>';return}const kinds=new Set(list.map(x=>x.kind));if(kinds.size<2){summary.innerHTML='<b>Potansiyel bağlam için tür çeşitliliği yetersiz</b>';return}const a=list.reduce((s,x)=>s+x.lat,0)/list.length,o=list.reduce((s,x)=>s+x.lon,0)/list.length,p=screen(a,o),r=zoom<=13?125:90,el=document.createElement('div');el.className='marker';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.style.width=(r*2)+'px';el.style.height=(r*2)+'px';el.style.border='3px dashed #efc768';el.style.borderRadius='50%';el.style.background='#efc76820';el.onclick=e=>{e.stopPropagation();openSheet('<h2>Bölgesel koruma bağlamı</h2><div class="notice">Bu alan yalnız kamuya açık tarihî kayıtların yoğunluğundan üretilen geniş bir koruma bağlamıdır; gizli veya keşfedilmiş bir hedef noktası değildir.</div><div class="card">'+list.length+' kamu kaydı • '+kinds.size+' farklı tür</div>')};markers.appendChild(el);summary.innerHTML='◌ <b>Bölgesel koruma bağlamı</b><br><span class="muted">'+list.length+' kamu kaydı • '+kinds.size+' tür</span>'}
function updateSummary(list){const c={};for(const x of list)c[x.kind]=(c[x.kind]||0)+1;const bits=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>(CAT[k]?.i||'•')+' '+v);summary.innerHTML='<b>'+list.length+' görünür kayıt</b><br>'+(bits.length?bits.join('   '):zoom<MIN_Z?'Zoom 11 ve üzeri bölgesel tarama başlar':'Bu görünümde eşleşen kamu kaydı yok');document.getElementById('near').textContent='☷ Yakındakiler ('+list.length+')'}
function updateStatus(){document.getElementById('zBadge').textContent='Zoom '+zoom;document.getElementById('dataBadge').textContent=zoom<MIN_Z?'Yakınlaş 11+':items.length+' yüklü • '+visible().length+' görünür';const src=Object.entries(sourceCounts).map(([k,v])=>(k.includes('wikidata')?'Wikidata':k.includes('openstreetmap')||k.includes('overpass')||k.includes('kumi')||k.includes('coffee')?'OSM':k)+' '+v).join(' • ');document.getElementById('sourceBadge').textContent=src||'Kaynak bekleniyor';const nb=document.getElementById('netBadge');nb.className='badge '+(net==='ok'?'ok':net==='error'?'err':'');nb.textContent=net==='loading'?'Güncelleniyor':net==='ok'?'Hazır':net==='error'?'Kaynak sorunu':'Hazır'}
function renderFull(){resetLayers();renderTiles();renderData();updateStatus()}
function radiusText(){return zoom<=11?'25 km':zoom===12?'14 km':zoom===13?'8 km':zoom===14?'4 km':zoom===15?'2 km':zoom===16?'1 km':zoom===17?'600 m':'350 m'}
function scheduleLoad(force=false){clearTimeout(loadTimer);if(zoom<MIN_Z){net='idle';updateStatus();return}loadTimer=setTimeout(()=>loadData(),force?40:650)}
function loadData(){if(!window.AndroidApp||!AndroidApp.fetchLocalHeritageV5){net='error';showHint('Android veri köprüsü bulunamadı.');updateStatus();return}const id=String(++requestSeq);latestRequest=+id;incoming=[];sourceCounts={};net='loading';updateStatus();showHint('Kamu tarih/arkeoloji kayıtları taranıyor • '+radiusText());AndroidApp.fetchLocalHeritageV5(id,lat,lon,zoom)}
window.onNativeHeritageChunkV5=function(id,raw,format,src){if(+id!==latestRequest)return;try{let add=[];if(format==='wikidata-json')add=parseWd(raw,src);else if(format==='osm-xml')add=parseXml(raw,src);else add=parseOverpass(raw,src);incoming=mergeItems(incoming.concat(add));items=incoming.slice();sourceCounts[src]=(sourceCounts[src]||0)+add.length;renderData();updateStatus()}catch(e){console.error(e)}}
window.onNativeHeritageDoneV5=function(id,any,msg){if(+id!==latestRequest)return;hideHint();net=any?'ok':'error';if(!any)showHint('Canlı kaynaklara ulaşılamadı. Harita kullanılabilir; Yenile ile tekrar deneyebilirsin.');renderData();updateStatus()}
function showHint(t){hint.textContent=t;hint.style.display='block'}function hideHint(){hint.style.display='none'}
function openSheet(html){sheet.innerHTML=html;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}
function showItem(it){const t=it.tags||{},keys=['historic','heritage','archaeological_site','instance','start_date','period','old_name','description'],tags=keys.filter(k=>t[k]).map(k=>'<span class="tag">'+esc(k)+': '+esc(t[k])+'</span>').join(''),src=(it.sources||[]).join(' • ');openSheet('<h2>'+esc(it.name)+'</h2><div class="card"><b>'+CAT[it.kind].i+' '+CAT[it.kind].n+'</b><div class="muted">'+dtext(hav(lat,lon,it.lat,it.lon))+' • '+esc(src)+'</div><div>'+tags+'</div></div><div class="notice">Haritadaki kayıt kamuya açık kaynaklardan gelir. Kaynakta dönem bilgisi yoksa uygulama dönem uydurmaz.</div><button class="choice" onclick="closeSheet()">Kapat</button>')}
function showList(list,title){const s=[...list].sort((a,b)=>hav(lat,lon,a.lat,a.lon)-hav(lat,lon,b.lat,b.lon));window._near=s;openSheet('<h2>'+esc(title)+'</h2>'+s.slice(0,100).map((it,i)=>'<div class="result" onclick="pickNear('+i+')"><b>'+CAT[it.kind].i+' '+esc(it.name)+'</b><div class="muted">'+dtext(hav(lat,lon,it.lat,it.lon))+' • '+esc(CAT[it.kind].n)+' • '+esc((it.sources||[]).join(', '))+'</div></div>').join('')+'<button class="choice" onclick="closeSheet()">Kapat</button>')}
window.pickNear=function(i){const it=window._near[i];if(it){lat=it.lat;lon=it.lon;zoom=Math.max(zoom,15);closeSheet();renderFull();scheduleLoad(true);setTimeout(()=>showItem(it),300)}}
function openChoices(kind){const arr=kind==='period'?PERIODS:TYPES,cur=kind==='period'?period:type;openSheet('<h2>'+(kind==='period'?'Dönem':'Tür')+'</h2>'+arr.map(x=>'<button class="choice '+(x===cur?'active':'')+'" onclick="choose(\''+kind+'\',\''+x+'\')">'+esc(x)+'</button>').join(''))}
window.choose=function(k,v){if(k==='period'){period=v;document.getElementById('periodBtn').textContent='Dönem: '+v}else{type=v;document.getElementById('typeBtn').textContent='Tür: '+v}closeSheet();renderData();updateStatus()}
function doSearch(){const v=document.getElementById('q').value.trim();if(!v)return;if(!window.AndroidApp||!AndroidApp.geocodeV5){openSheet('<h2>Arama</h2><div class="card">Android arama köprüsü bulunamadı.</div>');return}showHint('Yer aranıyor…');AndroidApp.geocodeV5(v)}
document.getElementById('search').onclick=doSearch;const q=document.getElementById('q');q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();q.blur();doSearch()}})
window.onNativeGeocodeV5=function(raw){hideHint();const a=JSON.parse(raw);if(!a.length){openSheet('<h2>Arama</h2><div class="card">Sonuç bulunamadı.</div>');return}window._geo=a;openSheet('<h2>Arama sonuçları</h2>'+a.map((x,i)=>'<div class="result" onclick="pickGeo('+i+')"><b>'+esc(x.display_name)+'</b><div class="muted">'+esc(x.type||'yer')+'</div></div>').join('')+'<button class="choice" onclick="closeSheet()">Kapat</button>')}
window.onNativeGeocodeErrorV5=function(){hideHint();openSheet('<h2>Arama</h2><div class="card">Arama servisine ulaşılamadı.</div>')}
window.pickGeo=function(i){const x=window._geo[i];lat=+x.lat;lon=+x.lon;const t=(x.type||'').toLowerCase();zoom=/village|hamlet|neighbourhood|quarter/.test(t)?14:13;document.getElementById('q').value=(x.display_name||'').split(',')[0];closeSheet();renderFull();scheduleLoad(true)}
document.getElementById('periodBtn').onclick=()=>openChoices('period');document.getElementById('typeBtn').onclick=()=>openChoices('type');document.getElementById('refresh').onclick=()=>scheduleLoad(true);document.getElementById('near').onclick=()=>showList(visible(),'Yakındaki kamu tarihî kayıtları');document.getElementById('menu').onclick=()=>openSheet('<h2>Harita bilgisi</h2><div class="okbox">v14 MULTI • OSM + Wikidata çoklu kaynak</div><div class="card">Zoom 11–12: bölgesel kümeler<br>Zoom 13: yakın çevre kümeleri<br>Zoom 14–18: kayıt adı + tür + varsa yayımlanmış geometri</div><div class="notice">Kayıtlar kamuya açık kaynaklardan yüklenir. Belgelenmemiş kesin hedef/saklama noktası üretilmez; potansiyel yalnız geniş koruma bağlamıdır.</div><button class="choice" onclick="closeSheet()">Kapat</button>')
document.getElementById('zin').onclick=()=>changeZoom(1);document.getElementById('zout').onclick=()=>changeZoom(-1);function changeZoom(d){zoom=clamp(zoom+d,3,18);renderFull();scheduleLoad()}
document.getElementById('loc').onclick=()=>window.AndroidApp&&AndroidApp.requestLocation();window.onNativeLocationV5=function(a,o){lat=+a;lon=+o;zoom=14;renderFull();scheduleLoad(true)}
map.addEventListener('touchstart',e=>{if(e.target.closest('.marker'))return;e.preventDefault();if(e.touches.length===1){const c=cw();gesture={x:e.touches[0].clientX,y:e.touches[0].clientY,lastX:e.touches[0].clientX,lastY:e.touches[0].clientY,cx:c[0],cy:c[1]};pinch=null}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinch=Math.hypot(dx,dy);gesture=null}},{passive:false})
map.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&gesture){gesture.lastX=e.touches[0].clientX;gesture.lastY=e.touches[0].clientY;moveLayers(gesture.lastX-gesture.x,gesture.lastY-gesture.y)}else if(e.touches.length===2&&pinch){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy),r=d/pinch;if(r>1.35&&zoom<18){zoom++;pinch=d;renderFull()}else if(r<.74&&zoom>3){zoom--;pinch=d;renderFull()}}},{passive:false})
map.addEventListener('touchend',e=>{if(e.touches.length===0){if(gesture){const dx=gesture.lastX-gesture.x,dy=gesture.lastY-gesture.y,p=unproject(gesture.cx-dx,gesture.cy-dy,zoom);lat=p[0];lon=p[1]}gesture=null;pinch=null;renderFull();scheduleLoad()}},{passive:false})
map.addEventListener('mousedown',e=>{if(e.target.closest('.marker'))return;const c=cw();mouseDrag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,cx:c[0],cy:c[1]}});addEventListener('mousemove',e=>{if(!mouseDrag)return;mouseDrag.lastX=e.clientX;mouseDrag.lastY=e.clientY;moveLayers(mouseDrag.lastX-mouseDrag.x,mouseDrag.lastY-mouseDrag.y)});addEventListener('mouseup',()=>{if(mouseDrag){const dx=mouseDrag.lastX-mouseDrag.x,dy=mouseDrag.lastY-mouseDrag.y,p=unproject(mouseDrag.cx-dx,mouseDrag.cy-dy,zoom);lat=p[0];lon=p[1];mouseDrag=null;renderFull();scheduleLoad()}});addEventListener('resize',renderFull);
renderFull();
</script>
