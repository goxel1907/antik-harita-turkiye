<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Antik Harita Türkiye</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#bfd9e5;color:#fff}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bfd9e5}.tiles,.svg,.markers{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.svg{pointer-events:none}.markers{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 9px #0007}.poi{width:34px;height:34px;border-radius:50%;border:3px solid #fff;font-size:14px;font-weight:900}.label{position:absolute;transform:translate(20px,-50%);background:#0e1821f2;border:1px solid #ffffff55;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}.cluster{height:34px;min-width:46px;padding:0 9px;border-radius:18px;border:2px solid #fff;background:#111b24;color:#fff;font-size:12px;font-weight:900;gap:4px}.top{position:fixed;z-index:50;top:7px;left:7px;right:7px;background:#101820f6;border:1px solid #ffffff18;border-radius:16px;padding:8px;box-shadow:0 8px 24px #0007}.row{display:flex;gap:6px}.q{flex:1;min-width:80px;border:1px solid #647382;border-radius:10px;background:#0b1219;color:#fff;padding:10px;font-size:15px}.gold{border:0;border-radius:10px;background:#efc768;color:#171108;font-weight:900;padding:9px 11px}.filters{display:flex;gap:6px;margin-top:6px}.filter{flex:1;border:1px solid #596979;border-radius:10px;background:#202b36;color:#fff;padding:8px 9px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{margin-top:6px;display:flex;gap:6px;overflow:hidden}.badge{background:#202b36;color:#d4dde4;border-radius:9px;padding:4px 7px;font-size:11px;white-space:nowrap}.badge.ok{background:#1d3b2f;color:#c8f4d9}.badge.err{background:#4b2727;color:#ffd0d0}.zoom{position:fixed;z-index:42;left:10px;top:205px;display:flex;flex-direction:column}.zoom button{width:46px;height:46px;border:1px solid #82909b;background:#fff;color:#111;font-size:27px;font-weight:900}.zoom button:first-child{border-radius:8px 8px 0 0}.zoom button:last-child{border-radius:0 0 8px 8px}.version{position:fixed;z-index:46;right:10px;top:205px;background:#101820ed;border:1px solid #ffffff42;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:900}.hint{position:fixed;z-index:36;left:50%;top:50%;transform:translate(-50%,-50%);background:#101820ee;border:1px solid #ffffff22;border-radius:13px;padding:10px 13px;font-size:12px;text-align:center;max-width:290px;display:none}.summary{position:fixed;z-index:37;left:10px;bottom:10px;background:#101820ed;border:1px solid #ffffff24;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.5;max-width:68vw;box-shadow:0 4px 16px #0007}.near{position:fixed;z-index:42;right:10px;bottom:10px;border:0;border-radius:12px;background:#101820ef;color:#fff;padding:10px 12px;font-weight:900;font-size:12px;box-shadow:0 4px 16px #0007}.sheet{position:fixed;z-index:80;left:0;right:0;bottom:0;display:none;max-height:78vh;overflow:auto;background:#101821;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -10px 30px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px;font-size:20px}.card,.result{background:#18232d;border:1px solid #344655;border-radius:12px;padding:11px;margin:8px 0}.result{cursor:pointer}.muted{color:#9eabb7;font-size:11px;margin-top:3px}.tag{display:inline-block;background:#29343f;border-radius:8px;padding:3px 6px;font-size:10px;margin:3px 3px 0 0}.choice{width:100%;text-align:left;border:1px solid #445566;border-radius:11px;background:#1d2833;color:#fff;padding:11px;margin:5px 0;font-size:13px}.choice.active{background:#efc768;color:#1b1408;border-color:#efc768;font-weight:900}.notice{background:#4a3823;color:#ffe1a7;border:1px solid #89683d;border-radius:10px;padding:9px;font-size:11px;margin:8px 0}.okbox{background:#18372c;color:#c4f4d6;border:1px solid #3d765f;border-radius:10px;padding:9px;font-size:11px}.attrib{position:fixed;z-index:30;right:2px;bottom:0;background:#fff9;color:#345;font-size:8px;padding:1px 3px}
</style></head><body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><svg id="svg" class="svg" width="100%" height="100%"></svg><div id="markers" class="markers"></div></div>
<div class="top"><div class="row"><input id="q" class="q" placeholder="İl, ilçe, köy veya tarihî ad"><button id="loc" class="gold">📍</button><button id="menu" class="gold">☰</button></div><div class="filters"><button id="periodBtn" class="filter">Dönem: Tümü</button><button id="typeBtn" class="filter">Tür: Tümü</button><button id="refresh" class="filter">↻ Yenile</button></div><div class="status"><span id="zBadge" class="badge">Zoom 6</span><span id="dataBadge" class="badge">Yakınlaş 13+</span><span id="netBadge" class="badge">Hazır</span></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div><div class="version">v13 SOURCEFIX</div><div id="hint" class="hint"></div><div id="summary" class="summary"></div><button id="near" class="near">☷ Yakındakiler</button><div id="sheet" class="sheet"></div><div class="attrib">© OpenStreetMap contributors</div>
<script>
'use strict';
const TS=256,MIN_Z=13;
const PERIODS=['Tümü','Helenistik','Roma','Bizans','Selçuklu','Osmanlı','Hitit','Frig','Urartu','Neolitik'];
const TYPES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Yapı','Potansiyel'];
const CAT={Yerleşim:{i:'🏛',c:'#b44940',n:'Yerleşim / arkeoloji'},Yol:{i:'≋',c:'#8d5b40',n:'Tarihî yol / güzergâh'},Konaklama:{i:'H',c:'#c9881e',n:'Han / kervansaray'},Savunma:{i:'🏰',c:'#6b4db0',n:'Kale / savunma'},Geçiş:{i:'↔',c:'#3585b7',n:'Köprü / geçit'},Su:{i:'💧',c:'#248fb8',n:'Su yapısı'},Mağara:{i:'◒',c:'#6b6b6b',n:'Yayımlanmış tarihî mağara'},Yapı:{i:'▣',c:'#4f7759',n:'Tarihî yapı'}};
let lat=39,lon=35.2,zoom=6,period='Tümü',type='Tümü',items=[],loadTimer=null,requestSeq=0,latestRequest=0,source='',net='idle';
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),svg=document.getElementById('svg'),markers=document.getElementById('markers'),sheet=document.getElementById('sheet'),hint=document.getElementById('hint'),summary=document.getElementById('summary');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),world=z=>TS*Math.pow(2,z);
function project(a,o,z){const s=world(z),x=(o+180)/360*s,sn=Math.sin(clamp(a,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}
function unproject(x,y,z){const s=world(z),o=x/s*360-180,n=Math.PI-2*Math.PI*y/s,a=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[a,o]}
function cw(){return project(lat,lon,zoom)}function screen(a,o){const c=cw(),p=project(a,o,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=cw(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=2**zoom;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function hav(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}function dtext(k){return k<1?Math.round(k*1000)+' m':k.toFixed(k<10?1:0)+' km'}
function periodTags(t){const s=[t.period,t.start_date,t['historic:period'],t['historic:civilization'],t.civilization,t.description,t.old_name,t.name].filter(Boolean).join(' ').toLowerCase(),o=[];for(const[p,r]of[['Helenistik',/hellen|helen/],['Roma',/roman|roma\b/],['Bizans',/byzant|bizans/],['Selçuklu',/seljuk|selçuk/],['Osmanlı',/ottoman|osmanl/],['Hitit',/hittite|hitit/],['Frig',/phryg|frig/],['Urartu',/urartu/],['Neolitik',/neolith|neolit/]])if(r.test(s))o.push(p);return o}
function classify(t){const h=(t.historic||'').toLowerCase(),n=((t.name||'')+' '+(t.description||'')).toLowerCase();if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes')return'Yerleşim';if(['road','route','milestone'].includes(h)||t['route:historic']==='yes')return'Yol';if(['caravanserai','inn'].includes(h)||t.tourism==='caravanserai'||/kervansaray|caravanserai|\bhan\b/.test(n))return'Konaklama';if(['castle','fort','fortification','city_gate','citywalls','tower','bunker'].includes(h)||t.fortification_type)return'Savunma';if(h==='bridge'||(t.ford==='yes'&&t.historic)||t.mountain_pass==='yes')return'Geçiş';if(['aqueduct','well','fountain'].includes(h)||(t.man_made==='water_well'&&t.historic))return'Su';if(t.natural==='cave_entrance'&&(t.historic||t.heritage||t.archaeological_site))return'Mağara';if(t.historic||t.heritage)return'Yapı';return null}
function keep(t){return !!(t.historic||t.heritage||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes'||t['route:historic']==='yes'||(t.natural==='cave_entrance'&&(t.historic||t.heritage||t.archaeological_site)))}
function tagsOf(el){const t={};for(const c of el.children)if(c.tagName==='tag')t[c.getAttribute('k')]=c.getAttribute('v');return t}
function centroid(g){if(!g.length)return null;let a=0,o=0;for(const p of g){a+=p.lat;o+=p.lon}return[a/g.length,o/g.length]}
function makeItem(id,t,a,o,g,src){if(!keep(t))return null;const kind=classify(t);if(!kind||a==null||o==null)return null;return{id,lat:+a,lon:+o,tags:t,kind,name:t['name:tr']||t.name||t.old_name||('Adsız '+CAT[kind].n),periods:periodTags(t),geometry:g||[],src}}
function parseXml(raw,src){const xml=new DOMParser().parseFromString(raw,'text/xml'),nodes=new Map(),out=[];for(const n of xml.getElementsByTagName('node')){const t=tagsOf(n),p={lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon')};nodes.set(n.getAttribute('id'),p);const it=makeItem('node:'+n.getAttribute('id'),t,p.lat,p.lon,[],src);if(it)out.push(it)}for(const w of xml.getElementsByTagName('way')){const t=tagsOf(w);if(!keep(t))continue;const g=[];for(const nd of w.getElementsByTagName('nd')){const p=nodes.get(nd.getAttribute('ref'));if(p)g.push(p)}const c=centroid(g);if(c){const it=makeItem('way:'+w.getAttribute('id'),t,c[0],c[1],g,src);if(it)out.push(it)}}return uniq(out)}
function parseJson(raw,src){const j=JSON.parse(raw),out=[];for(const e of j.elements||[]){const t=e.tags||{};let a=e.lat,o=e.lon,g=e.geometry||[];if((a==null||o==null)&&e.center){a=e.center.lat;o=e.center.lon}if((a==null||o==null)&&g.length){const c=centroid(g);if(c){a=c[0];o=c[1]}}const it=makeItem(e.type+':'+e.id,t,a,o,g,src);if(it)out.push(it)}return uniq(out)}
function uniq(a){const m=new Map();for(const x of a)m.set(x.id,x);return[...m.values()]}
function matches(it){return(type==='Tümü'||it.kind===type)&&(period==='Tümü'||it.periods.includes(period))}
function visible(){return items.filter(matches)}
function color(k){return CAT[k]?.c||'#777'}
function drawGeometry(list){svg.innerHTML='';if(zoom<14)return;for(const it of list){if(!it.geometry||it.geometry.length<2)continue;let d='';for(let i=0;i<it.geometry.length;i++){const p=screen(+it.geometry[i].lat,+it.geometry[i].lon);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill',it.geometry.length>3?'rgba(239,199,104,.08)':'none');path.setAttribute('stroke',color(it.kind));path.setAttribute('stroke-width',it.kind==='Yol'?4:2);path.setAttribute('stroke-opacity','.8');svg.appendChild(path)}}
function renderData(){markers.innerHTML='';const list=visible();drawGeometry(list);if(type==='Potansiyel'){drawPotential();updateSummary([]);return}if(zoom===13){const grid=new Map();for(const it of list){const p=screen(it.lat,it.lon);if(p[0]<-80||p[1]<-80||p[0]>innerWidth+80||p[1]>innerHeight+80)continue;const k=it.kind+':'+Math.round(p[0]/70)+':'+Math.round(p[1]/70),g=grid.get(k)||[];g.push(it);grid.set(k,g)}for(const g of grid.values()){const a=g.reduce((s,x)=>s+x.lat,0)/g.length,o=g.reduce((s,x)=>s+x.lon,0)/g.length,p=screen(a,o),el=document.createElement('div');el.className='marker cluster';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.innerHTML=(CAT[g[0].kind]?.i||'•')+' '+g.length;el.onclick=e=>{e.stopPropagation();showList(g,CAT[g[0].kind].n)};markers.appendChild(el)}}else{for(const it of list){const p=screen(it.lat,it.lon);if(p[0]<-120||p[1]<-80||p[0]>innerWidth+180||p[1]>innerHeight+80)continue;const el=document.createElement('div');el.className='marker poi';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.style.background=color(it.kind);el.textContent=CAT[it.kind]?.i||'•';el.onclick=e=>{e.stopPropagation();showItem(it)};markers.appendChild(el);if(zoom>=14){const lab=document.createElement('div');lab.className='label';lab.style.left=p[0]+'px';lab.style.top=p[1]+'px';lab.textContent=CAT[it.kind].n.split(' / ')[0]+' • '+it.name;markers.appendChild(lab)}}}updateSummary(list)}
function drawPotential(){const list=items;if(zoom<14||list.length<3){updateSummary([]);return}const kinds=new Set(list.map(x=>x.kind));if(kinds.size<2){updateSummary([]);return}const a=list.reduce((s,x)=>s+x.lat,0)/list.length,o=list.reduce((s,x)=>s+x.lon,0)/list.length,p=screen(a,o),r=zoom===14?110:85;const el=document.createElement('div');el.className='marker';el.style.left=p[0]+'px';el.style.top=p[1]+'px';el.style.width=(r*2)+'px';el.style.height=(r*2)+'px';el.style.border='3px dashed #efc768';el.style.borderRadius='50%';el.style.background='#efc76820';el.onclick=e=>{e.stopPropagation();openSheet('<h2>Bölgesel koruma bağlamı</h2><div class="notice">Bu alan yalnız kamuya açık tarihî kayıt yoğunluğundan üretilen geniş bir koruma bağlamıdır; keşfedilmiş veya gizli bir nokta değildir.</div><div class="card">'+list.length+' kamu kaydı • '+kinds.size+' farklı tür</div>')};markers.appendChild(el);summary.innerHTML='◌ Potansiyel koruma bağlamı<br><span class="muted">'+list.length+' kamu kaydı • '+kinds.size+' farklı tür</span>'}
function updateSummary(list){const c={};for(const x of list)c[x.kind]=(c[x.kind]||0)+1;const bits=Object.entries(c).map(([k,v])=>(CAT[k]?.i||'•')+' '+v);summary.innerHTML='<b>'+list.length+' görünür kayıt</b><br>'+(bits.length?bits.join('   '):'Bu görünümde eşleşen kayıt yok')+(source?'<br><span class="muted">Kaynak: '+esc(source)+'</span>':'');document.getElementById('near').textContent='☷ Yakındakiler ('+list.length+')'}
function render(){renderTiles();renderData();document.getElementById('zBadge').textContent='Zoom '+zoom;document.getElementById('dataBadge').textContent=zoom<MIN_Z?'Yakınlaş 13+':items.length+' yüklü • '+visible().length+' görünür';const nb=document.getElementById('netBadge');nb.className='badge '+(net==='ok'?'ok':net==='error'?'err':'');nb.textContent=net==='loading'?'Yükleniyor':net==='ok'?'Hazır':net==='error'?'Kaynak hatası':'Hazır'}
function scheduleLoad(force=false){clearTimeout(loadTimer);if(zoom<MIN_Z){items=[];source='';net='idle';render();return}loadTimer=setTimeout(()=>loadData(force),force?50:450)}
function loadData(force){if(!window.AndroidApp||!AndroidApp.fetchLocalHeritageV4){net='error';showHint('Android veri köprüsü bulunamadı.');render();return}const id=String(++requestSeq);latestRequest=+id;net='loading';render();showHint('Yakın çevre tarihî kayıtları yükleniyor…');AndroidApp.fetchLocalHeritageV4(id,lat,lon,zoom)}
window.onNativeHeritageV4=function(id,raw,format,src){if(+id!==latestRequest)return;try{items=format==='xml'?parseXml(raw,'OpenStreetMap • '+src):parseJson(raw,'OpenStreetMap • '+src);source=src;net='ok';hideHint();render()}catch(e){net='error';showHint('Veri geldi ancak okunamadı: '+e.message);render()}}
window.onNativeHeritageErrorV4=function(id,msg){if(+id!==latestRequest)return;net='error';showHint('Canlı tarihî veri alınamadı. Harita çalışıyor; Yenile ile tekrar deneyebilirsin.');render()}
function showHint(t){hint.textContent=t;hint.style.display='block'}function hideHint(){hint.style.display='none'}
function openSheet(html){sheet.innerHTML=html;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}
function showItem(it){const t=it.tags||{},tags=['historic','heritage','archaeological_site','start_date','period','old_name','description'].filter(k=>t[k]).map(k=>'<span class="tag">'+esc(k)+': '+esc(t[k])+'</span>').join('');openSheet('<h2>'+esc(it.name)+'</h2><div class="card"><b>'+CAT[it.kind].i+' '+CAT[it.kind].n+'</b><div class="muted">'+dtext(hav(lat,lon,it.lat,it.lon))+' • '+esc(it.src)+'</div><div>'+tags+'</div></div><button class="choice" onclick="closeSheet()">Kapat</button>')}
function showList(list,title){const s=[...list].sort((a,b)=>hav(lat,lon,a.lat,a.lon)-hav(lat,lon,b.lat,b.lon));openSheet('<h2>'+esc(title)+'</h2>'+s.slice(0,80).map((it,i)=>'<div class="result" onclick="pickNear('+i+')"><b>'+CAT[it.kind].i+' '+esc(it.name)+'</b><div class="muted">'+dtext(hav(lat,lon,it.lat,it.lon))+' • '+esc(CAT[it.kind].n)+'</div></div>').join('')+'<button class="choice" onclick="closeSheet()">Kapat</button>');window._near=s}
window.pickNear=function(i){const it=window._near[i];if(it){lat=it.lat;lon=it.lon;zoom=Math.max(zoom,15);closeSheet();render();scheduleLoad(true);setTimeout(()=>showItem(it),350)}}
function openChoices(kind){const arr=kind==='period'?PERIODS:TYPES,cur=kind==='period'?period:type;openSheet('<h2>'+(kind==='period'?'Dönem':'Tür')+'</h2>'+arr.map(x=>'<button class="choice '+(x===cur?'active':'')+'" onclick="choose(\''+kind+'\',\''+x+'\')">'+esc(x)+'</button>').join(''))}
window.choose=function(k,v){if(k==='period'){period=v;document.getElementById('periodBtn').textContent='Dönem: '+v}else{type=v;document.getElementById('typeBtn').textContent='Tür: '+v}closeSheet();renderData()}
document.getElementById('periodBtn').onclick=()=>openChoices('period');document.getElementById('typeBtn').onclick=()=>openChoices('type');document.getElementById('refresh').onclick=()=>scheduleLoad(true);document.getElementById('near').onclick=()=>showList(visible(),'Yakındaki tarihî kayıtlar');document.getElementById('menu').onclick=()=>openSheet('<h2>Harita bilgisi</h2><div class="okbox">v13 SOURCEFIX • Zoom 13+ canlı kamu kayıtları</div><div class="card">Zoom 13: tür kümeleri<br>Zoom 14–18: kayıt adı + tür + yayımlanmış geometri</div><div class="notice">Potansiyel katmanı yalnız kamuya açık kayıt yoğunluğunu geniş koruma bağlamı olarak gösterir; gizli/hedef nokta üretmez.</div><button class="choice" onclick="closeSheet()">Kapat</button>');
document.getElementById('zin').onclick=()=>changeZoom(1);document.getElementById('zout').onclick=()=>changeZoom(-1);function changeZoom(d){zoom=clamp(zoom+d,3,18);render();scheduleLoad()}
document.getElementById('loc').onclick=()=>window.AndroidApp&&AndroidApp.requestLocation();window.onNativeLocationV4=function(a,o){lat=+a;lon=+o;zoom=14;render();scheduleLoad(true)}
const q=document.getElementById('q');q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(window.AndroidApp&&q.value.trim()){showHint('Yer aranıyor…');AndroidApp.geocodeV4(q.value.trim())}}});window.onNativeGeocodeV4=function(raw){hideHint();const a=JSON.parse(raw);if(!a.length){openSheet('<h2>Arama</h2><div class="card">Sonuç bulunamadı.</div>');return}window._geo=a;openSheet('<h2>Arama sonuçları</h2>'+a.map((x,i)=>'<div class="result" onclick="pickGeo('+i+')"><b>'+esc(x.display_name)+'</b><div class="muted">'+esc(x.type||'yer')+'</div></div>').join(''))};window.onNativeGeocodeErrorV4=function(){hideHint();openSheet('<h2>Arama</h2><div class="card">Arama servisine ulaşılamadı.</div>')};window.pickGeo=function(i){const x=window._geo[i];lat=+x.lat;lon=+x.lon;zoom=14;closeSheet();render();scheduleLoad(true)}
let drag=null,pinch=null;map.addEventListener('touchstart',e=>{if(e.target.closest('.marker'))return;e.preventDefault();if(e.touches.length===1){const c=cw();drag={x:e.touches[0].clientX,y:e.touches[0].clientY,cx:c[0],cy:c[1]}}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinch=Math.hypot(dx,dy);drag=null}},{passive:false});map.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&drag){const dx=e.touches[0].clientX-drag.x,dy=e.touches[0].clientY-drag.y,p=unproject(drag.cx-dx,drag.cy-dy,zoom);lat=p[0];lon=p[1];render()}else if(e.touches.length===2&&pinch){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy),r=d/pinch;if(r>1.28&&zoom<18){zoom++;pinch=d;render()}else if(r<.78&&zoom>3){zoom--;pinch=d;render()}}},{passive:false});map.addEventListener('touchend',e=>{if(e.touches.length===0){drag=null;pinch=null;scheduleLoad()}},{passive:false});
let md=null;map.addEventListener('mousedown',e=>{if(e.target.closest('.marker'))return;const c=cw();md={x:e.clientX,y:e.clientY,cx:c[0],cy:c[1]}});addEventListener('mousemove',e=>{if(!md)return;const p=unproject(md.cx-(e.clientX-md.x),md.cy-(e.clientY-md.y),zoom);lat=p[0];lon=p[1];render()});addEventListener('mouseup',()=>{if(md){md=null;scheduleLoad()}});addEventListener('resize',render);
render();
</script></body></html>
