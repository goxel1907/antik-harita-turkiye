<!doctype html>
<html lang="tr">
<head>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.css">
<style>
:root{--bg:#0d151e;--panel:#111b26f4;--panel2:#182532;--line:#3b4d5f;--text:#f4f7fa;--muted:#9eacb9;--gold:#efc86f;--gold2:#ba842f;--green:#6ec99a;--red:#e47a78;--shadow:0 12px 34px #0008}
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#bdd3dd;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.maplibregl-ctrl-attrib{font-size:9px!important}.maplibregl-ctrl-logo{display:none!important}
#boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center}.bootcard{max-width:370px}.logo{width:88px;height:88px;margin:auto;border-radius:27px;background:linear-gradient(145deg,#f6dc97,#bd812a);box-shadow:0 14px 36px #0009;position:relative}.logo:before{content:"";position:absolute;left:17px;right:17px;top:22px;height:38px;border:3px solid #24180d;border-radius:8px;transform:rotate(-6deg)}.logo:after{content:"✦";position:absolute;right:7px;bottom:6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#13202c;border:2px solid #f3d582;color:#f3d582;font-size:21px}.boottitle{font-size:25px;font-weight:950;margin-top:17px}.bootsub{font-size:13px;line-height:1.5;color:#aeb9c4;margin-top:8px}
#ui{display:none}.top{position:fixed;z-index:50;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));padding:9px;background:var(--panel);border:1px solid #ffffff1f;border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(9px)}.searchrow{display:flex;gap:7px}.search{flex:1;min-width:0;padding:12px 13px;border-radius:13px;border:1px solid #53677a;background:#09121b;color:#fff;font-size:16px;outline:none}.search:focus{border-color:var(--gold);box-shadow:0 0 0 2px #efc86f2c}.icon{min-width:48px;border:0;border-radius:13px;background:var(--gold);color:#1b1409;font-size:20px;font-weight:950;padding:0 11px}.filters,.status{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.filters{margin-top:7px}.status{margin-top:6px}.filters::-webkit-scrollbar,.status::-webkit-scrollbar{display:none}.pill{border:1px solid #526678;border-radius:11px;background:#1c2a37;color:#fff;padding:8px 10px;font-size:12px;font-weight:850;white-space:nowrap}.pill.active{background:var(--gold);color:#1a1208;border-color:var(--gold)}.pill small{font-weight:550;opacity:.82}.badge{background:#1d2a36;border-radius:9px;padding:5px 8px;font-size:10.5px;color:#d2dae1;white-space:nowrap}.badge.ok{background:#17392b;color:#cdf3dc}.badge.warn{background:#4b3820;color:#ffe1a8}.badge.err{background:#512929;color:#ffd2d2}
.floating{position:fixed;z-index:42;left:10px;top:206px;display:flex;flex-direction:column;gap:7px}.fab{width:46px;height:46px;border-radius:13px;border:1px solid #5d7182;background:#111b26ef;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 19px #0006}.fab.on{background:var(--gold);border-color:var(--gold);color:#1b1308}.version{position:fixed;z-index:42;right:10px;top:206px;border:1px solid #ffffff2c;background:#111b26ed;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:950;box-shadow:0 5px 16px #0005}.ribbon{display:none;position:fixed;z-index:41;top:190px;left:10px;right:10px;pointer-events:none}.ribbon span{display:inline-block;padding:6px 9px;border-radius:10px;background:#3f2e19ed;border:1px solid #b98335;color:#ffe0a6;font-size:10.5px;font-weight:850;box-shadow:0 4px 14px #0005}
.bottom{position:fixed;z-index:43;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}.summary,.near{pointer-events:auto;background:#111b26ef;border:1px solid #ffffff21;box-shadow:0 6px 18px #0006}.summary{max-width:67vw;border-radius:13px;padding:9px 10px;font-size:10.8px;line-height:1.45}.summary strong{font-size:12px}.near{border-radius:13px;padding:11px 13px;color:#fff;font-size:12px;font-weight:900}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;color:#cbd4dc}.leg{display:inline-flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%}
#toast{position:fixed;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%);display:none;max-width:330px;padding:11px 14px;border-radius:14px;background:#0e1822f6;border:1px solid #ffffff2c;box-shadow:var(--shadow);text-align:center;font-size:12px;line-height:1.45}
.sheet{position:fixed;z-index:150;left:0;right:0;bottom:0;display:none;max-height:84vh;overflow:auto;background:#0f1923;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #ffffff1f;box-shadow:0 -14px 42px #0009}.sheet.open{display:block}.grab{width:46px;height:5px;border-radius:4px;background:#526170;margin:0 auto 13px}.sheet h2{font-size:22px;margin:0 0 9px}.section{font-size:13px;font-weight:900;color:#f1cf7a;margin:14px 0 6px}.card,.item{background:#172430;border:1px solid #334758;border-radius:13px;padding:11px;margin:7px 0}.item:active{background:#20303e}.itemtitle{font-size:15px;font-weight:900}.itemmeta,.muted{font-size:11px;line-height:1.48;color:#a9b5c0}.meta{display:grid;grid-template-columns:105px 1fr;gap:6px 9px;font-size:12px;margin-top:8px}.meta b{color:#aab7c2}.tag{display:inline-block;background:#293947;border-radius:8px;padding:4px 7px;margin:3px 3px 0 0;font-size:10px}.notice{background:#43321d;border:1px solid #84632f;color:#ffe1a9;border-radius:12px;padding:10px;margin:8px 0;font-size:11px;line-height:1.5}.good{background:#17362a;border:1px solid #3d765c;color:#cdf1db;border-radius:12px;padding:10px;margin:8px 0;font-size:11px;line-height:1.5}.btn{width:100%;border:1px solid #455a6c;border-radius:12px;background:#1a2a37;color:#fff;padding:12px;text-align:left;margin:5px 0;font-weight:800}.btn.active{background:var(--gold);border-color:var(--gold);color:#1a1208}.btn small{display:block;font-weight:500;opacity:.78;margin-top:2px}.primary{width:100%;border:0;border-radius:12px;background:var(--gold);color:#1a1208;padding:13px;font-weight:950;margin-top:9px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kpis{display:flex;gap:7px;overflow:auto;margin:8px 0}.kpi{min-width:93px;background:#16232e;border:1px solid #33495b;border-radius:11px;padding:8px}.kpi b{display:block;font-size:17px}.kpi span{font-size:10px;color:#a9b4be}.empty{text-align:center;color:#aab6c0;padding:22px 8px}.link{color:#f2cf7c;text-decoration:none;font-weight:850}
@media(max-height:700px){.top{padding:7px}.search{padding:9px 11px}.pill{padding:7px 9px}.floating,.version{top:180px}.ribbon{top:167px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="boot"><div class="bootcard"><div class="logo"></div><div class="boottitle">Antik Harita Türkiye</div><div class="bootsub" id="bootText">Kaynaklı tarih korpusu hazırlanıyor…</div></div></div>
<div id="ui">
 <div class="top">
  <div class="searchrow"><input id="q" class="search" autocomplete="off" enterkeyhint="search" placeholder="Tarihî ad veya modern yer ara"><button id="searchBtn" class="icon">⌕</button><button id="locBtn" class="icon">⌖</button><button id="menuBtn" class="icon">☰</button></div>
  <div class="filters"><button id="periodBtn" class="pill">Dönem: <small>Tümü</small></button><button id="typeBtn" class="pill">Tür: <small>Tümü</small></button><button id="precisionBtn" class="pill">Doğruluk: <small>Tümü</small></button><button id="baseBtn" class="pill">Zemin: <small>Güncel</small></button></div>
  <div class="status"><span id="corpusBadge" class="badge">Korpus yükleniyor</span><span id="visibleBadge" class="badge">0 sonuç</span><span id="favBadge" class="badge">0 favori</span><span id="zoomBadge" class="badge">Zoom 6</span><span id="stateBadge" class="badge">Hazır</span></div>
 </div>
 <div id="ribbon" class="ribbon"><span id="ribbonText"></span></div>
 <div class="floating"><button id="zoomIn" class="fab">+</button><button id="zoomOut" class="fab">−</button><button id="protectBtn" class="fab on" title="Bölgesel koruma bağlamı">◌</button></div>
 <div class="version">v16 ATLAS</div>
 <div id="toast"></div>
 <div class="bottom"><div id="summary" class="summary"><strong>Kaynaklı tarih katmanı</strong><br><span class="muted">Korpus hazırlanıyor…</span></div><button id="nearBtn" class="near">☷ Yakındakiler</button></div>
 <div id="sheet" class="sheet"></div>
</div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.mjs';
const PERIODS=[['Tümü',null,'Tüm tarihler'],['Neolitik',-7000,'MÖ 7000–4500'],['Kalkolitik',-4000,'MÖ 4500–3000'],['Tunç Çağı',-2000,'MÖ 3000–1200'],['Hitit',-1400,'MÖ 17.–12. yy'],['Frig',-800,'MÖ 12.–7. yy'],['Urartu',-750,'MÖ 9.–6. yy'],['Arkaik',-600,'MÖ 8.–5. yy'],['Klasik',-450,'MÖ 5.–4. yy'],['Helenistik',-200,'MÖ 4.–1. yy'],['Roma',200,'MÖ 1.–MS 4. yy'],['Bizans',900,'MS 4.–15. yy'],['Selçuklu',1200,'MS 11.–14. yy'],['Osmanlı',1700,'MS 14.–20. yy']];
const TYPES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Mezar','Dini','Yapı'];
const PRECISIONS=[['Tümü','Tüm kaynak hassasiyetleri'],['Kesin','Pleiades precise olarak işaretli'],['Kaba','Pleiades rough olarak işaretli'],['Geometrili','Çizgi/poligon geometrisi olan kayıtlar']];
const COLORS={Yerleşim:'#b95148',Yol:'#9d6649',Konaklama:'#d68f20',Savunma:'#7859bd',Geçiş:'#3b94c6',Su:'#249cc1',Mağara:'#777f86',Mezar:'#8c6a52',Dini:'#926e9b',Yapı:'#4f8064'};
const ICONS={Yerleşim:'🏛',Yol:'≋',Konaklama:'H',Savunma:'▰',Geçiş:'↔',Su:'◆',Mağara:'◒',Mezar:'◉',Dini:'✦',Yapı:'□'};
const LABELS={Yerleşim:'Yerleşim / arkeoloji',Yol:'Tarihî yol / güzergâh',Konaklama:'Han / kervansaray / menzil',Savunma:'Kale / tahkimat / savunma',Geçiş:'Köprü / geçit / geçiş',Su:'Su yapısı / kaynak bağlamı',Mağara:'Yayımlanmış mağara / sığınak',Mezar:'Nekropol / mezar yapısı',Dini:'Tarihî dini yapı',Yapı:'Diğer tarihî yapı / alan'};
const CURRENT_STYLE={version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm',minzoom:0,maxzoom:20,paint:{'raster-opacity':.93,'raster-saturation':-.14}}]};
const OHM_STYLE='https://unpkg.com/@openhistoricalmap/map-styles@latest/dist/historical/historical.json';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let corpus={records:[],recordCount:0},records=[],byId=new Map(),period='Tümü',type='Tümü',precision='Tümü',base='Güncel',protection=true,mapReady=false,dataReady=false,userMarker=null,lastToast=null;
let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('aht-favorites-v1')||'[]'))}catch(e){}
const map=new maplibregl.Map({container:'map',style:CURRENT_STYLE,center:[35.2,39],zoom:5.6,minZoom:3,maxZoom:18,dragRotate:false,pitchWithRotate:false,attributionControl:true,localIdeographFontFamily:'sans-serif'});map.touchZoomRotate.disableRotation();
function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(lastToast);lastToast=setTimeout(()=>e.style.display='none',ms)}
function state(t,k=''){const e=$('stateBadge');e.textContent=t;e.className='badge'+(k?' '+k:'')}
function fmt(n){return new Intl.NumberFormat('tr-TR').format(n||0)}
function pinfo(){return PERIODS.find(x=>x[0]===period)||PERIODS[0]}
function setPill(id,label,value){const e=$(id);e.innerHTML=label+': <small>'+esc(value)+'</small>';e.classList.toggle('active',value!=='Tümü'&&value!=='Güncel')}
function saveFavs(){localStorage.setItem('aht-favorites-v1',JSON.stringify([...favorites]));$('favBadge').textContent=fmt(favorites.size)+' favori'}
function toggleFav(id){if(favorites.has(id)){favorites.delete(id);toast('Favorilerden çıkarıldı')}else{favorites.add(id);toast('Favorilere eklendi')}saveFavs()}
function matchPrecision(r){const p=String(r.precision||'').toLowerCase();if(precision==='Kesin')return p==='precise';if(precision==='Kaba')return p==='rough';if(precision==='Geometrili')return !!r.geometry;return true}
function visible(){return records.filter(r=>(type==='Tümü'||r.kind===type)&&(period==='Tümü'||(r.periods||[]).includes(period))&&matchPrecision(r))}
function pointFeature(r){return {type:'Feature',id:r.id,properties:{id:r.id,name:r.name,kind:r.kind,precision:r.precision||''},geometry:{type:'Point',coordinates:[r.lon,r.lat]}}}
function pointGeo(){return {type:'FeatureCollection',features:visible().map(pointFeature)}}
function geomGeo(){return {type:'FeatureCollection',features:visible().filter(r=>r.geometry).map(r=>({type:'Feature',properties:{id:r.id,name:r.name,kind:r.kind},geometry:r.geometry}))}}
function protectGeo(){if(!protection)return {type:'FeatureCollection',features:[]};const step=.24,g=new Map();for(const r of visible()){const x=Math.floor(r.lon/step),y=Math.floor(r.lat/step),k=x+':'+y,v=g.get(k)||{n:0,k:new Set(),x,y};v.n++;v.k.add(r.kind);g.set(k,v)}const f=[];for(const v of g.values()){if(v.n<3||v.k.size<2)continue;const x0=v.x*step,y0=v.y*step,x1=x0+step,y1=y0+step;f.push({type:'Feature',properties:{count:v.n,kinds:v.k.size},geometry:{type:'Polygon',coordinates:[[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]]}})}return {type:'FeatureCollection',features:f}}
function colorExpr(){const e=['match',['get','kind']];for(const [k,c] of Object.entries(COLORS)){e.push(k,c)}e.push('#6d7780');return e}
function installLayers(){if(!mapReady||!dataReady||!map.isStyleLoaded())return;for(const id of ['history-label','history-dot','cluster-count','clusters','history-lines','history-polygons','protect-line','protect-fill'])if(map.getLayer(id))map.removeLayer(id);for(const id of ['history-points','history-geoms','protect-zones'])if(map.getSource(id))map.removeSource(id);map.addSource('history-points',{type:'geojson',data:pointGeo(),cluster:true,clusterRadius:48,clusterMaxZoom:11,promoteId:'id'});map.addSource('history-geoms',{type:'geojson',data:geomGeo()});map.addSource('protect-zones',{type:'geojson',data:protectGeo()});map.addLayer({id:'protect-fill',type:'fill',source:'protect-zones',paint:{'fill-color':'#d59e42','fill-opacity':['interpolate',['linear'],['get','count'],3,.07,12,.20,30,.32]}});map.addLayer({id:'protect-line',type:'line',source:'protect-zones',paint:{'line-color':'#d8a34b','line-width':1.3,'line-dasharray':[2,2],'line-opacity':.78}});map.addLayer({id:'history-polygons',type:'fill',source:'history-geoms',filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':colorExpr(),'fill-opacity':.18,'fill-outline-color':colorExpr()}});map.addLayer({id:'history-lines',type:'line',source:'history-geoms',filter:['==',['geometry-type'],'LineString'],paint:{'line-color':colorExpr(),'line-width':['interpolate',['linear'],['zoom'],8,1.5,14,4,18,6.5],'line-opacity':.86}});map.addLayer({id:'clusters',type:'circle',source:'history-points',filter:['has','point_count'],paint:{'circle-color':'#15222d','circle-radius':['step',['get','point_count'],18,10,22,50,27,200,33],'circle-stroke-width':3,'circle-stroke-color':'#efc86f','circle-opacity':.95}});map.addLayer({id:'cluster-count',type:'symbol',source:'history-points',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':12,'text-font':['Open Sans Regular']},paint:{'text-color':'#fff'}});map.addLayer({id:'history-dot',type:'circle',source:'history-points',filter:['!',['has','point_count']],paint:{'circle-color':colorExpr(),'circle-radius':['interpolate',['linear'],['zoom'],6,5,10,7,14,9,17,11],'circle-stroke-color':'#f5e5bd','circle-stroke-width':['interpolate',['linear'],['zoom'],6,1,14,2.3],'circle-opacity':.96}});map.addLayer({id:'history-label',type:'symbol',source:'history-points',filter:['!',['has','point_count']],minzoom:12.2,layout:{'text-field':['concat',['get','name'],' · ',['get','kind']],'text-size':['interpolate',['linear'],['zoom'],12,10,15,12,18,14],'text-anchor':'left','text-offset':[1.15,0],'text-max-width':18},paint:{'text-color':'#fff','text-halo-color':'#101923','text-halo-width':2,'text-halo-blur':1}});updateStatus()}
function refresh(){if(!mapReady||!dataReady)return;const p=map.getSource('history-points'),g=map.getSource('history-geoms'),z=map.getSource('protect-zones');if(p)p.setData(pointGeo());if(g)g.setData(geomGeo());if(z)z.setData(protectGeo());updateStatus()}
function updateStatus(){if(!dataReady)return;const list=visible(),b=map.getBounds(),ons=list.filter(r=>b.contains([r.lon,r.lat])).length,c={};for(const r of list)c[r.kind]=(c[r.kind]||0)+1;$('corpusBadge').textContent=fmt(corpus.recordCount||records.length)+' kaynaklı kayıt';$('corpusBadge').className='badge ok';$('visibleBadge').textContent=fmt(list.length)+' filtre sonucu';$('favBadge').textContent=fmt(favorites.size)+' favori';$('zoomBadge').textContent='Zoom '+map.getZoom().toFixed(1);const lg=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,n])=>`<span class="leg"><span class="dot" style="background:${COLORS[k]||'#777'}"></span>${esc(k)} ${fmt(n)}</span>`).join('');$('summary').innerHTML=`<strong>${fmt(ons)} ekranda · ${fmt(list.length)} filtre sonucu</strong><div class="legend">${lg||'<span>Bu filtrede kayıt yok</span>'}</div>`}
function updateRibbon(){const e=$('ribbon');if(period==='Tümü'){e.style.display='none';return}e.style.display='block';$('ribbonText').textContent=period+' · '+pinfo()[2]+(base==='Tarihsel'?' · tarihsel zemin':'')}
function applyOhmDate(){if(base!=='Tarihsel'||period==='Tümü'||!map.isStyleLoaded())return;const year=pinfo()[1];if(year==null)return;for(const layer of map.getStyle().layers||[]){const src=String(layer.source||'');if(!src.includes('ohm')||['background','raster','hillshade'].includes(layer.type))continue;try{const d=['all',['any',['!',['has','start_decdate']],['<=',['get','start_decdate'],year]],['any',['!',['has','end_decdate']],['>=',['get','end_decdate'],year]]];map.setFilter(layer.id,layer.filter?['all',layer.filter,d]:d)}catch(e){}}}
function changeBase(v){base=v;setPill('baseBtn','Zemin',base);state(base==='Tarihsel'?'Tarihsel zemin yükleniyor':'Güncel zemin yükleniyor','warn');const c=map.getCenter(),z=map.getZoom();map.setStyle(base==='Tarihsel'?OHM_STYLE:CURRENT_STYLE);map.once('style.load',()=>{map.jumpTo({center:c,zoom:z});state('Hazır','ok');updateRibbon()})}
function sheet(html){const s=$('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}window.closeSheet=closeSheet;
function choices(title,items,current,cb,sub=''){sheet(`<h2>${esc(title)}</h2>${sub?`<div class="muted">${esc(sub)}</div>`:''}`+items.map((x,i)=>{const v=Array.isArray(x)?x[0]:x,d=Array.isArray(x)?x[x.length-1]:'';return `<button class="btn ${v===current?'active':''}" data-i="${i}">${esc(v)}${Array.isArray(x)&&d!==v?`<small>${esc(d)}</small>`:''}</button>`}).join('')+'<button class="primary" id="sheetClose">Kapat</button>');[...$('sheet').querySelectorAll('[data-i]')].forEach(e=>e.onclick=()=>{const x=items[+e.dataset.i],v=Array.isArray(x)?x[0]:x;cb(v);closeSheet()});$('sheetClose').onclick=closeSheet}
function showRecord(r){const fav=favorites.has(r.id),aliases=(r.altNames||[]).slice(0,10).map(x=>`<span class="tag">${esc(x)}</span>`).join(''),ps=(r.periods||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="tag">Kaynakta açık dönem yok</span>',acc=r.accuracyMinM!=null||r.accuracyMaxM!=null?`${r.accuracyMinM??'?'}–${r.accuracyMaxM??'?'} m`:r.precision||'belirtilmemiş';sheet(`<h2>${esc(r.name)}</h2><div class="card"><div class="itemtitle">${ICONS[r.kind]||'•'} ${esc(LABELS[r.kind]||r.kind)}</div><div class="meta"><b>Dönem</b><span>${ps}</span><b>Tarih bilgisi</b><span>${esc(r.dateLabel||'Kaynakta ayrı tarih aralığı yok')}</span><b>Konum</b><span>${esc(acc)}</span><b>Kaynak</b><span>${esc(r.source||'Pleiades')}</span></div></div>${aliases?`<div class="section">Alternatif / eski adlar</div><div>${aliases}</div>`:''}${r.description?`<div class="section">Kaynak açıklaması</div><div class="card muted">${esc(r.description)}</div>`:''}${(r.placeTypes||[]).length?`<div class="section">Kaynak türleri</div><div>${r.placeTypes.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${r.provenance?`<div class="section">Provenans</div><div class="card muted">${esc(r.provenance)}</div>`:''}<div class="notice">Kayıt kamuya açık tarih/arkeoloji kaynağından gelir. “rough/kaba” işaretli koordinatlar kesin hedef konumu olarak yorumlanmamalıdır.</div><div class="twocol"><button id="favAction" class="btn">${fav?'★ Favoriden çıkar':'☆ Favoriye ekle'}</button><a class="btn link" href="geo:${r.lat},${r.lon}?q=${r.lat},${r.lon}(${encodeURIComponent(r.name)})">Haritada aç ↗</a></div><a class="btn link" href="${esc(r.sourceUrl)}">Pleiades kaynağını aç ↗</a><button class="primary" onclick="closeSheet()">Kapat</button>`);$('favAction').onclick=()=>{toggleFav(r.id);showRecord(r)}}
function flyRecord(r){closeSheet();map.flyTo({center:[r.lon,r.lat],zoom:Math.max(14,map.getZoom()),duration:650});setTimeout(()=>showRecord(r),680)}
function showList(title,list,meta){sheet(`<h2>${esc(title)}</h2>${meta?`<div class="muted">${esc(meta)}</div>`:''}`+(list.length?list.map((r,i)=>`<div class="item" data-r="${i}"><div class="itemtitle">${ICONS[r.kind]||'•'} ${esc(r.name)} ${favorites.has(r.id)?'★':''}</div><div class="itemmeta">${esc(LABELS[r.kind]||r.kind)}${(r.periods||[]).length?' · '+esc(r.periods.join(', ')):''} · ${esc(r.precision||'hassasiyet yok')}</div></div>`).join(''):'<div class="empty">Kayıt yok.</div>')+'<button class="primary" id="sheetClose">Kapat</button>');[...$('sheet').querySelectorAll('[data-r]')].forEach(e=>e.onclick=()=>flyRecord(list[+e.dataset.r]));$('sheetClose').onclick=closeSheet}
function nearby(){const c=map.getCenter(),R=6371,p=Math.PI/180,dist=r=>{const a=(r.lat-c.lat)*p,b=(r.lon-c.lng)*p,A=Math.sin(a/2)**2+Math.cos(c.lat*p)*Math.cos(r.lat*p)*Math.sin(b/2)**2;return 2*R*Math.asin(Math.sqrt(A))},list=visible().map(r=>({r,d:dist(r)})).sort((a,b)=>a.d-b.d).slice(0,120);sheet(`<h2>Yakındaki tarihî kayıtlar</h2><div class="muted">Harita merkezine göre en yakın ${fmt(list.length)} kayıt.</div>`+(list.length?list.map((x,i)=>`<div class="item" data-n="${i}"><div class="itemtitle">${ICONS[x.r.kind]||'•'} ${esc(x.r.name)}</div><div class="itemmeta">${x.d<1?Math.round(x.d*1000)+' m':x.d<10?x.d.toFixed(1)+' km':Math.round(x.d)+' km'} · ${esc(LABELS[x.r.kind]||x.r.kind)}${favorites.has(x.r.id)?' · ★':''}</div></div>`).join(''):'<div class="empty">Bu filtrede kayıt yok.</div>')+'<button class="primary" id="sheetClose">Kapat</button>');[...$('sheet').querySelectorAll('[data-n]')].forEach(e=>e.onclick=()=>flyRecord(list[+e.dataset.n].r));$('sheetClose').onclick=closeSheet}
function menu(){const favs=[...favorites].map(id=>byId.get(id)).filter(Boolean),gen=corpus.generatedAt?new Date(corpus.generatedAt).toLocaleString('tr-TR'):'bilinmiyor';sheet(`<h2>Araştırma atlası</h2><div class="good"><b>${fmt(corpus.recordCount)} kaynaklı Pleiades kaydı</b><br>Korpus APK içinde yerel varlık olarak bulunur. Harita hareketlerinde canlı arkeoloji sorgusu yapılmaz.</div><div class="kpis"><div class="kpi"><b>${fmt(corpus.recordCount)}</b><span>korpus</span></div><div class="kpi"><b>${fmt(favorites.size)}</b><span>favori</span></div><div class="kpi"><b>${fmt(Object.keys(corpus.countsByPeriod||{}).length)}</b><span>dönem etiketi</span></div></div><button class="btn" id="mFav">★ Favorilerim<small>${fmt(favs.length)} kayıt cihazda saklı</small></button><button class="btn" id="mBase">Harita zemini: ${esc(base)}<small>Güncel OSM / tarihsel OpenHistoricalMap</small></button><button class="btn" id="mProtect">Bölgesel koruma bağlamı: ${protection?'Açık':'Kapalı'}<small>Kaynaklı kayıt yoğunluğunu yaklaşık bölgeler halinde gösterir; gizli hedef üretmez.</small></button><button class="btn" id="mFit">Türkiye görünümüne dön</button><div class="card muted">Korpus üretimi: ${esc(gen)}<br>${esc(corpus.source||'Pleiades GIS export')}<br>${esc(corpus.license||'')}</div><div class="notice">Yayımlanmamış/gizli kültür varlığı veya define noktası üretilmez. Yaklaşık koruma bağlamı yalnız kamuya açık kayıtların bölgesel yoğunluğudur.</div><button class="primary" onclick="closeSheet()">Kapat</button>`);$('mFav').onclick=()=>showList('Favorilerim',favs,'Favoriler bu cihazdaki uygulama verisinde saklanır.');$('mBase').onclick=()=>{closeSheet();openBase()};$('mProtect').onclick=()=>{protection=!protection;$('protectBtn').classList.toggle('on',protection);refresh();closeSheet();toast(protection?'Koruma bağlamı açıldı':'Koruma bağlamı kapatıldı')};$('mFit').onclick=()=>{closeSheet();map.fitBounds([[25.5,35.5],[45,42.2]],{padding:28,duration:700})}}
function openPeriod(){choices('Dönem filtresi',PERIODS,period,v=>{period=v;setPill('periodBtn','Dönem',period);updateRibbon();if(v!=='Tümü'&&base==='Güncel')changeBase('Tarihsel');else if(base==='Tarihsel')changeBase('Tarihsel');else refresh()},'Dönem yalnız kaynakta tarih etiketi bulunan kayıtları süzer; eksik dönem uydurulmaz.')}
function openType(){choices('Tarihî unsur türü',TYPES,type,v=>{type=v;setPill('typeBtn','Tür',type);refresh()})}
function openPrecision(){choices('Konum doğruluğu',PRECISIONS,precision,v=>{precision=v;setPill('precisionBtn','Doğruluk',precision);refresh()},'Pleiades konum hassasiyeti ve mevcut geometri bilgisine göre filtreler.')}
function openBase(){choices('Harita zemini',[['Güncel','Modern yer adları için OpenStreetMap'],['Tarihsel','OpenHistoricalMap tarihsel vektör zemini']],base,changeBase,'Tarihî kayıt katmanı iki zeminde de aynı kaynaklı korpusla çalışır.')}
function geocode(q){if(window.AndroidApp?.geocodeV6){state('Yer aranıyor','warn');AndroidApp.geocodeV6(q)}else toast('Android yer arama köprüsü bulunamadı')}
function search(){const q=$('q').value.trim();if(!q)return;const nq=q.toLocaleLowerCase('tr'),local=records.filter(r=>r.name.toLocaleLowerCase('tr').includes(nq)||(r.altNames||[]).some(n=>n.toLocaleLowerCase('tr').includes(nq))).slice(0,50);if(local.length){sheet(`<h2>Tarihî ad sonuçları</h2>`+local.map((r,i)=>`<div class="item" data-l="${i}"><div class="itemtitle">${ICONS[r.kind]||'•'} ${esc(r.name)}</div><div class="itemmeta">${esc(r.kind)}${(r.periods||[]).length?' · '+esc(r.periods.join(', ')):''}</div></div>`).join('')+`<button class="btn" id="modernSearch">“${esc(q)}” için modern yer ara<small>Türkiye ile sınırlı Nominatim araması</small></button><button class="primary" onclick="closeSheet()">Kapat</button>`);[...$('sheet').querySelectorAll('[data-l]')].forEach(e=>e.onclick=()=>flyRecord(local[+e.dataset.l]));$('modernSearch').onclick=()=>geocode(q)}else geocode(q)}
window.onNativeGeocodeV6=raw=>{state('Hazır','ok');let a=[];try{a=JSON.parse(raw)}catch(e){}sheet(`<h2>Modern yer araması</h2>`+(a.length?a.map((x,i)=>`<div class="item" data-g="${i}"><div class="itemtitle">${esc((x.display_name||'').split(',')[0])}</div><div class="itemmeta">${esc(x.display_name||'')} · ${esc(x.type||'yer')}</div></div>`).join(''):'<div class="empty">Sonuç bulunamadı.</div>')+'<button class="primary" onclick="closeSheet()">Kapat</button>');[...$('sheet').querySelectorAll('[data-g]')].forEach(e=>e.onclick=()=>{const x=a[+e.dataset.g];closeSheet();$('q').value=(x.display_name||'').split(',')[0];map.flyTo({center:[+x.lon,+x.lat],zoom:/village|hamlet|neighbourhood|quarter/.test(x.type||'')?14:12.5,duration:700})})};
window.onNativeGeocodeErrorV6=()=>{state('Arama hatası','err');toast('Yer arama servisine ulaşılamadı')};window.onNativeLocationV6=(lat,lon)=>{if(userMarker)userMarker.remove();userMarker=new maplibregl.Marker({color:'#efc86f'}).setLngLat([+lon,+lat]).addTo(map);map.flyTo({center:[+lon,+lat],zoom:14,duration:700});state('Konum bulundu','ok')};
function corpusLoaded(raw){try{const j=JSON.parse(raw);if(!Array.isArray(j.records)||j.records.length<100)throw new Error('Korpus boş veya eksik');corpus=j;records=j.records.filter(r=>Number.isFinite(+r.lat)&&Number.isFinite(+r.lon)).map(r=>({...r,lat:+r.lat,lon:+r.lon}));byId=new Map(records.map(r=>[r.id,r]));favorites=new Set([...favorites].filter(id=>byId.has(id)));saveFavs();dataReady=true;$('boot').style.display='none';$('ui').style.display='block';if(mapReady)installLayers();state('Hazır','ok');updateStatus()}catch(e){$('bootText').innerHTML='Tarih korpusu yüklenemedi.<br><br><b>'+esc(e.message)+'</b><br>Bu sürüm demo veriyle devam etmez.'}}
let chunks=[];window.onNativeCorpusStartV1=total=>{chunks=new Array(+total||0);$('bootText').textContent='Kaynaklı tarih korpusu yükleniyor…'};window.onNativeCorpusChunkV1=(i,p)=>{chunks[+i]=p};window.onNativeCorpusEndV1=()=>{const raw=chunks.join('');chunks=[];corpusLoaded(raw)};window.onNativeCorpusV1=corpusLoaded;window.onNativeCorpusErrorV1=msg=>{$('bootText').innerHTML='Tarih korpusu bulunamadı.<br><br>'+esc(msg)+'<br>Derleme veri adımını kontrol et.'};
map.on('load',()=>{mapReady=true;if(dataReady)installLayers();state('Hazır','ok')});map.on('style.load',()=>{mapReady=true;if(dataReady)installLayers();if(base==='Tarihsel')setTimeout(applyOhmDate,300)});map.on('zoomend',updateStatus);map.on('moveend',updateStatus);map.on('click','clusters',e=>{const f=e.features?.[0];if(!f)return;map.getSource('history-points').getClusterExpansionZoom(f.properties.cluster_id).then(z=>map.easeTo({center:f.geometry.coordinates,zoom:z,duration:450}))});for(const layer of ['history-dot','history-label','history-lines','history-polygons'])map.on('click',layer,e=>{const r=byId.get(e.features?.[0]?.properties?.id);if(r)showRecord(r)});map.on('mouseenter','history-dot',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','history-dot',()=>map.getCanvas().style.cursor='');
$('periodBtn').onclick=openPeriod;$('typeBtn').onclick=openType;$('precisionBtn').onclick=openPrecision;$('baseBtn').onclick=openBase;$('menuBtn').onclick=menu;$('nearBtn').onclick=nearby;$('protectBtn').onclick=()=>{protection=!protection;$('protectBtn').classList.toggle('on',protection);refresh();toast(protection?'Bölgesel koruma bağlamı açıldı':'Koruma bağlamı kapatıldı')};$('zoomIn').onclick=()=>map.zoomIn({duration:220});$('zoomOut').onclick=()=>map.zoomOut({duration:220});$('locBtn').onclick=()=>window.AndroidApp?.requestLocation();$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur();search()}});setPill('periodBtn','Dönem',period);setPill('typeBtn','Tür',type);setPill('precisionBtn','Doğruluk',precision);setPill('baseBtn','Zemin',base);saveFavs();if(window.AndroidApp?.loadCorpusV1)AndroidApp.loadCorpusV1();else $('bootText').textContent='Android veri köprüsü bulunamadı. Uygulamayı APK içinden aç.';
</script>
</body>
</html>
