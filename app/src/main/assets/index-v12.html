<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#bdd8e4;color:#fff}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bdd8e4}.tiles,.svg,.markers{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.svg{pointer-events:none}.svg path,.svg circle{pointer-events:auto}.markers{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px #0008}.poi{width:34px;height:34px;border-radius:50%;border:3px solid #fff;font-size:15px;font-weight:900}.label{position:absolute;transform:translate(20px,-50%);background:#0f1821ef;border:1px solid #ffffff55;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.cluster{height:34px;min-width:42px;padding:0 9px;border-radius:18px;border:2px solid #fff;background:#111b24;color:#fff;font-size:12px;font-weight:900;gap:5px}.top{position:fixed;z-index:50;top:7px;left:7px;right:7px;background:#101820f5;border:1px solid #ffffff18;border-radius:16px;padding:8px;box-shadow:0 8px 24px #0007}.row{display:flex;gap:6px}.q{flex:1;min-width:80px;border:1px solid #647382;border-radius:10px;background:#0b1219;color:#fff;padding:10px;font-size:15px}.gold{border:0;border-radius:10px;background:#efc768;color:#171108;font-weight:900;padding:9px 11px}.filters{display:flex;gap:6px;margin-top:6px}.filter{flex:1;border:1px solid #596979;border-radius:10px;background:#202b36;color:#fff;padding:8px 9px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{margin-top:6px;display:flex;gap:6px;overflow:hidden}.badge{background:#202b36;color:#d4dde4;border-radius:9px;padding:4px 7px;font-size:11px;white-space:nowrap}.badge.ok{background:#1d3b2f;color:#c8f4d9}.badge.err{background:#4b2727;color:#ffd0d0}.zoom{position:fixed;z-index:42;left:10px;top:205px;display:flex;flex-direction:column}.zoom button{width:46px;height:46px;border:1px solid #82909b;background:#fff;color:#111;font-size:27px;font-weight:900}.zoom button:first-child{border-radius:8px 8px 0 0}.zoom button:last-child{border-radius:0 0 8px 8px}.version{position:fixed;z-index:46;right:10px;top:205px;background:#101820ed;border:1px solid #ffffff42;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:900}.hint{position:fixed;z-index:36;left:50%;top:52%;transform:translate(-50%,-50%);background:#101820e9;border:1px solid #ffffff22;border-radius:13px;padding:10px 13px;font-size:12px;text-align:center;max-width:280px;display:none}.summary{position:fixed;z-index:37;left:10px;bottom:10px;background:#101820ed;border:1px solid #ffffff24;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.45;max-width:62vw;box-shadow:0 4px 16px #0007}.near{position:fixed;z-index:42;right:10px;bottom:10px;border:0;border-radius:12px;background:#101820ef;color:#fff;padding:10px 12px;font-weight:900;font-size:12px;box-shadow:0 4px 16px #0007}.sheet{position:fixed;z-index:80;left:0;right:0;bottom:0;display:none;max-height:78vh;overflow:auto;background:#101821;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -10px 30px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px;font-size:20px}.card,.result{background:#18232d;border:1px solid #344655;border-radius:12px;padding:11px;margin:8px 0}.result{cursor:pointer}.muted{color:#9eabb7;font-size:11px;margin-top:3px}.tag{display:inline-block;background:#29343f;border-radius:8px;padding:3px 6px;font-size:10px;margin:3px 3px 0 0}.choice{width:100%;text-align:left;border:1px solid #445566;border-radius:11px;background:#1d2833;color:#fff;padding:11px;margin:5px 0;font-size:13px}.choice.active{background:#efc768;color:#1b1408;border-color:#efc768;font-weight:900}.notice{background:#4a3823;color:#ffe1a7;border:1px solid #89683d;border-radius:10px;padding:9px;font-size:11px;margin:8px 0}.okbox{background:#18372c;color:#c4f4d6;border:1px solid #3d765f;border-radius:10px;padding:9px;font-size:11px}.attrib{position:fixed;z-index:30;right:2px;bottom:0;background:#fff9;color:#345;font-size:8px;padding:1px 3px}
</style>
</head>
<body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><svg id="svg" class="svg" width="100%" height="100%"></svg><div id="markers" class="markers"></div></div>
<div class="top">
 <div class="row"><input id="q" class="q" placeholder="İl, ilçe, köy veya tarihî ad"><button id="loc" class="gold">📍</button><button id="menu" class="gold">☰</button></div>
 <div class="filters"><button id="periodBtn" class="filter">Dönem: Tümü</button><button id="typeBtn" class="filter">Tür: Tümü</button><button id="refresh" class="filter">↻ Yenile</button></div>
 <div class="status"><span id="zBadge" class="badge">Zoom 6</span><span id="dataBadge" class="badge">Yakınlaş 13+</span><span id="netBadge" class="badge">Hazır</span></div>
</div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div><div class="version">v12 STABLE</div><div id="hint" class="hint"></div><div id="summary" class="summary"></div><button id="near" class="near">☷ Yakındakiler</button><div id="sheet" class="sheet"></div><div class="attrib">© OpenStreetMap contributors</div>
<script>
'use strict';
const TS=256,MIN_Z=13;
const PERIODS=['Tümü','Helenistik','Roma','Bizans','Selçuklu','Osmanlı','Hitit','Frig','Urartu','Neolitik'];
const TYPES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Yapı','Potansiyel'];
const CAT={Yerleşim:{i:'🏛',c:'#b44940',n:'Yerleşim / arkeoloji'},Yol:{i:'≋',c:'#8d5b40',n:'Tarihî yol / güzergâh'},Konaklama:{i:'H',c:'#c9881e',n:'Han / kervansaray'},Savunma:{i:'🏰',c:'#6b4db0',n:'Kale / savunma'},Geçiş:{i:'↔',c:'#3585b7',n:'Köprü / geçit'},Su:{i:'💧',c:'#248fb8',n:'Su yapısı'},Mağara:{i:'◒',c:'#6b6b6b',n:'Mağara / sığınak kaydı'},Yapı:{i:'▣',c:'#4f7759',n:'Tarihî yapı'},Diğer:{i:'•',c:'#7c8790',n:'Tarihî kayıt'}};
let lat=39,lon=35.2,zoom=6,period='Tümü',type='Tümü',items=[],potential=[],loadTimer=null,requestSeq=0,latestRequest=0,network='idle',source='',fallbackTried=false;
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),svg=document.getElementById('svg'),markers=document.getElementById('markers'),sheet=document.getElementById('sheet'),hint=document.getElementById('hint'),summary=document.getElementById('summary');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),world=z=>TS*Math.pow(2,z),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function project(a,o,z){const s=world(z),x=(o+180)/360*s,sn=Math.sin(clamp(a,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}
function unproject(x,y,z){const s=world(z),o=x/s*360-180,n=Math.PI-2*Math.PI*y/s,a=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[a,o]}
function cw(){return project(lat,lon,zoom)}function screen(a,o){const c=cw(),p=project(a,o,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=cw(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=2**zoom;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function hav(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}function dist(k){return k<1?Math.round(k*1000)+' m':k.toFixed(k<10?1:0)+' km'}
function periods(t){const s=[t.period,t.start_date,t['historic:period'],t['historic:civilization'],t.civilization,t.description,t.old_name,t.name].filter(Boolean).join(' ').toLowerCase(),o=[];for(const[p,r]of[['Helenistik',/hellen|helen/],['Roma',/roman|roma\b/],['Bizans',/byzant|bizans/],['Selçuklu',/seljuk|selçuk/],['Osmanlı',/ottoman|osmanl/],['Hitit',/hittite|hitit/],['Frig',/phryg|frig/],['Urartu',/urartu/],['Neolitik',/neolith|neolit/]])if(r.test(s))o.push(p);return o}
function classify(t){const h=(t.historic||'').toLowerCase(),n=((t.name||'')+' '+(t.description||'')).toLowerCase();if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes')return'Yerleşim';if(['road','route','milestone'].includes(h)||t['route:historic']==='yes')return'Yol';if(['caravanserai','inn'].includes(h)||t.tourism==='caravanserai'||/kervansaray|caravanserai|\bhan\b/.test(n))return'Konaklama';if(['castle','fort','fortification','city_gate','citywalls','tower','bunker'].includes(h)||t.fortification_type)return'Savunma';if(h==='bridge'||(t.ford==='yes'&&t.historic)||t.mountain_pass==='yes')return'Geçiş';if(h==='aqueduct'||h==='well'||(t.man_made==='water_well'&&t.historic))return'Su';if(t.natural==='cave_entrance'||h==='cave')return'Mağara';if(t.historic||t.heritage)return'Yapı';return'Diğer'}
function keep(t){return !!(t.historic||t.heritage||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes'||t['route:historic']==='yes'||t.natural==='cave_entrance')}
function centroid(g){if(!g||!g.length)return null;let a=0,o=0,n=0;for(const p of g)if(Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)){a+=+p.lat;o+=+p.lon;n++}return n?[a/n,o/n]:null}
function itemFrom(id,t,a,o,g,src){if(!keep(t))return null;const kind=classify(t);if(kind==='Diğer')return null;if((a==null||o==null)&&g&&g.length){const c=centroid(g);if(c){a=c[0];o=c[1]}}if(a==null||o==null)return null;return{id,lat:+a,lon:+o,tags:t,kind,name:t['name:tr']||t.name||t.old_name||('Adsız '+CAT[kind].n),periods:periods(t),geometry:g||[],src}}
function parseOverpass(raw,src){const j=JSON.parse(raw),out=[],seen=new Set();for(const e of j.elements||[]){const id=e.type+':'+e.id;if(seen.has(id))continue;seen.add(id);const t=e.tags||{};let a=e.lat,o=e.lon,g=e.geometry||[];if((a==null||o==null)&&e.center){a=e.center.lat;o=e.center.lon}const it=itemFrom(id,t,a,o,g,'OpenStreetMap • '+src);if(it)out.push(it)}return out}
function parseOsmXml(raw){const xml=new DOMParser().parseFromString(raw,'text/xml'),nodes=new Map(),out=[];for(const n of xml.querySelectorAll('node')){const t={};for(const x of n.querySelectorAll(':scope > tag'))t[x.getAttribute('k')]=x.getAttribute('v');nodes.set(n.getAttribute('id'),{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),tags:t});const it=itemFrom('node:'+n.getAttribute('id'),t,+n.getAttribute('lat'),+n.getAttribute('lon'),[],'OpenStreetMap API yedeği');if(it)out.push(it)}for(const w of xml.querySelectorAll('way')){const t={};for(const x of w.querySelectorAll(':scope > tag'))t[x.getAttribute('k')]=x.getAttribute('v');if(!keep(t))continue;const g=[];for(const nd of w.querySelectorAll(':scope > nd')){const p=nodes.get(nd.getAttribute('ref'));if(p)g.push({lat:p.lat,lon:p.lon})}const c=centroid(g);const it=itemFrom('way:'+w.getAttribute('id'),t,c&&c[0],c&&c[1],g,'OpenStreetMap API yedeği');if(it)out.push(it)}const uniq=new Map();for(const it of out)uniq.set(it.id,it);return[...uniq.values()]}
function matches(it){return(type==='Tümü'||type==='Potansiyel'||it.kind===type)&&(period==='Tümü'||it.periods.includes(period))}
function radius(){return zoom===13?1800:zoom===14?1100:zoom===15?650:zoom===16?400:zoom===17?250:150}
function qA(f,r){return`nwr(around:${r},${lat.toFixed(6)},${lon.toFixed(6)})${f};`}
function buildQuery(){const r=radius(),q=[],w=x=>type==='Tümü'||type===x||type==='Potansiyel';if(type==='Tümü'){q.push(qA('[historic]',r),qA('[heritage]',Math.min(r,900)),qA('[archaeological_site]',r),qA('[tourism=archaeological_site]',r),qA('[ruins=yes]',r),qA('[route:historic=yes]',r),qA('[natural=cave_entrance]',Math.min(r,900)))}else{if(w('Yerleşim'))q.push(qA('[historic~"^(archaeological_site|ruins)$"]',r),qA('[archaeological_site]',r),qA('[tourism=archaeological_site]',r),qA('[ruins=yes]',r));if(w('Yol'))q.push(qA('[historic~"^(road|route|milestone)$"]',r),qA('[route:historic=yes]',r));if(w('Konaklama'))q.push(qA('[historic~"^(caravanserai|inn)$"]',r),qA('[tourism=caravanserai]',r));if(w('Savunma'))q.push(qA('[historic~"^(castle|fort|fortification|city_gate|citywalls|tower|bunker)$"]',r));if(w('Geçiş'))q.push(qA('[historic=bridge]',r),qA('[mountain_pass=yes]',r));if(w('Su'))q.push(qA('[historic~"^(aqueduct|well)$"]',r));if(w('Mağara'))q.push(qA('[natural=cave_entrance]',r));if(w('Yapı'))q.push(qA('[historic]',r),qA('[heritage]',Math.min(r,900)))}return`[out:json][timeout:8];(${q.join('')});${zoom>=14?'out body geom qt;':'out body center qt;'}`}
function buildPotential(){const step=zoom>=15?.006:.01,cells=new Map();for(const it of items){if(!['Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara'].includes(it.kind))continue;const k=Math.floor(it.lat/step)+':'+Math.floor(it.lon/step);if(!cells.has(k))cells.set(k,{lat:0,lon:0,n:0,kinds:new Set(),step});const c=cells.get(k);c.lat+=it.lat;c.lon+=it.lon;c.n++;c.kinds.add(it.kind)}potential=[];for(const c of cells.values())if(c.n>=3&&c.kinds.size>=2){c.lat/=c.n;c.lon/=c.n;potential.push(c)}}
function geometry(it){if(zoom<14||!it.geometry||it.geometry.length<2)return;const c=CAT[it.kind],p=document.createElementNS('http://www.w3.org/2000/svg','path');let d='';it.geometry.forEach((g,i)=>{const[x,y]=screen(g.lat,g.lon);d+=(i?'L':'M')+x+','+y});p.setAttribute('d',d);p.setAttribute('fill',['Yerleşim','Savunma','Yapı'].includes(it.kind)?c.c+'22':'none');p.setAttribute('stroke',c.c);p.setAttribute('stroke-width',it.kind==='Yol'?4:2.5);p.setAttribute('opacity','.9');p.onclick=()=>detail(it);svg.appendChild(p)}
function marker(it,label){const[x,y]=screen(it.lat,it.lon);if(x<-80||x>innerWidth+80||y<-80||y>innerHeight+80)return;const c=CAT[it.kind],d=document.createElement('div');d.className='marker poi';d.style.cssText=`left:${x}px;top:${y}px;background:${c.c}`;d.textContent=c.i;d.onclick=()=>detail(it);markers.appendChild(d);if(label){const l=document.createElement('div');l.className='label';l.style.left=x+'px';l.style.top=y+'px';l.textContent=CAT[it.kind].n.split(' / ')[0]+' • '+it.name;markers.appendChild(l)}}
function cluster(list){let a=0,o=0;for(const it of list){a+=it.lat;o+=it.lon}a/=list.length;o/=list.length;const[x,y]=screen(a,o),kind=list[0].kind,c=CAT[kind],d=document.createElement('div');d.className='marker cluster';d.style.left=x+'px';d.style.top=y+'px';d.style.borderColor=c.c;d.innerHTML=`<span>${c.i}</span><b>${list.length}</b>`;d.onclick=()=>setCenter(a,o,zoom+1);markers.appendChild(d)}
function potentialCircle(c){const[x,y]=screen(c.lat,c.lon),[x2]=screen(c.lat,c.lon+c.step/2),r=clamp(Math.abs(x2-x),35,90),e=document.createElementNS('http://www.w3.org/2000/svg','circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',r);e.setAttribute('fill','#b27c3420');e.setAttribute('stroke','#b27c34');e.setAttribute('stroke-width','2');e.setAttribute('stroke-dasharray','6 5');e.onclick=()=>showSheet(`<h2>Bölgesel potansiyel bağlamı</h2><div class="notice">Bu alan yalnız birden fazla açık tarihî göstergenin yaklaşık 1 km ölçeğinde birleşimini gösterir; kesin arkeolojik veya saklama noktası değildir.</div><div class="card">${[...c.kinds].map(k=>`<span class="tag">${esc(CAT[k].n)}</span>`).join('')}</div><button class="gold" onclick="closeSheet()">Kapat</button>`);svg.appendChild(e)}
function renderOverlay(){markers.innerHTML='';svg.innerHTML='';if(zoom<MIN_Z){updateUi([]);return}const v=items.filter(matches).sort((a,b)=>hav(lat,lon,a.lat,a.lon)-hav(lat,lon,b.lat,b.lon));for(const it of v)geometry(it);if(type==='Potansiyel'){for(const c of potential)potentialCircle(c)}else if(zoom===13){const cells=new Map();for(const it of v){const[x,y]=screen(it.lat,it.lon),k=it.kind+':'+Math.floor(x/80)+':'+Math.floor(y/80);if(!cells.has(k))cells.set(k,[]);cells.get(k).push(it)}for(const l of cells.values())l.length>1?cluster(l):marker(l[0],false)}else{const max=zoom>=16?100:zoom===15?75:55;v.forEach((it,i)=>marker(it,i<max))}updateUi(v)}
function updateUi(v){document.getElementById('zBadge').textContent='Zoom '+zoom;document.getElementById('periodBtn').textContent='Dönem: '+period;document.getElementById('typeBtn').textContent='Tür: '+type;const db=document.getElementById('dataBadge'),nb=document.getElementById('netBadge');db.textContent=zoom<MIN_Z?'Yakınlaş 13+':items.length+' yüklü • '+v.length+' görünür';nb.className='badge'+(network==='ok'?' ok':network==='error'?' err':'');nb.textContent=network==='loading'?'Yükleniyor':network==='ok'?(source||'Canlı'):network==='error'?'Kaynak hatası':'Hazır';hint.style.display='none';if(zoom<MIN_Z){hint.style.display='block';hint.innerHTML='<b>Ayrıntı için yakınlaş</b><br>Zoom 13: tür kümeleri<br>Zoom 14+: adlar ve yol/alan geometrileri'}else if(network==='loading'&&!items.length){hint.style.display='block';hint.textContent='Bu çevrenin tarihî kayıtları yükleniyor…'}else if(network==='error'&&!items.length){hint.style.display='block';hint.innerHTML='Canlı kaynak alınamadı.<br><b>Zoom 14+ seviyesinde OSM API yedeği otomatik denenir.</b>'}const counts={};for(const it of v)counts[it.kind]=(counts[it.kind]||0)+1;const bits=Object.keys(counts).map(k=>CAT[k].i+' '+counts[k]);summary.innerHTML=zoom<MIN_Z?'<b>Harita serbestçe kullanılabilir</b><br>Veri sorgusu yalnız yerel zoomda başlar.':`<b>${v.length} görünür kayıt</b>${bits.length?'<br>'+bits.join('  '):'<br>Bu görünümde kayıt yok'}`;document.getElementById('near').textContent='☷ Yakındakiler'+(v.length?' ('+v.length+')':'')}
function render(){renderTiles();renderOverlay()}
function setCenter(a,o,z,load=true){lat=clamp(a,-85,85);lon=o;zoom=clamp(Math.round(z),3,18);render();if(load)scheduleLoad()}
function showSheet(h){sheet.innerHTML=h;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}window.closeSheet=closeSheet;
function detail(it){const c=CAT[it.kind],t=it.tags,per=it.periods.length?it.periods.join(', '):'Kaynakta dönem etiketi yok',extra=['historic','archaeological_site','site_type','old_name','start_date','period','heritage','wikidata','wikipedia','description'].filter(k=>t[k]).map(k=>`<span class="tag">${esc(k)}: ${esc(t[k])}</span>`).join('');showSheet(`<h2>${c.i} ${esc(it.name)}</h2><div class="okbox">${esc(c.n)} • ${dist(hav(lat,lon,it.lat,it.lon))}</div><div class="card"><b>Dönem:</b> ${esc(per)}<br><b>Kaynak:</b> ${esc(it.src)}<br><b>Kayıt:</b> ${esc(it.id)}<br>${extra}</div><div class="notice">Bu, kamuya açık kaynak kaydıdır. Konumu ve dönemi resmî envanter/literatür ile ayrıca doğrulanmalıdır.</div><button class="gold" onclick="closeSheet()">Kapat</button>`)}
function choose(title,arr,current,setter){let h='<h2>'+esc(title)+'</h2>';for(const x of arr)h+=`<button class="choice${x===current?' active':''}" onclick="window.pick('${esc(x)}')">${esc(x)}</button>`;showSheet(h);window.pick=x=>{setter(x);closeSheet();renderOverlay();if(zoom>=MIN_Z)scheduleLoad(true)}}
function nearby(){const v=items.filter(matches).map(x=>({...x,d:hav(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.d-b.d).slice(0,80);let h='<h2>Bu çevredeki kayıtlar</h2>';if(!v.length)h+='<div class="notice">Yüklü kayıt yok. Haritayı biraz yakınlaştırıp Yenile düğmesine bas.</div>';for(const it of v){const c=CAT[it.kind];h+=`<div class="result" onclick="jump(${it.lat},${it.lon},15)"><b>${c.i} ${esc(it.name)}</b><div class="muted">${esc(c.n)} • ${dist(it.d)}${it.periods.length?' • '+esc(it.periods.join(', ')):''}</div></div>`}h+='<button class="gold" onclick="closeSheet()">Kapat</button>';showSheet(h)}
function queryKey(){const d=radius()/111000/2;return`${zoom}:${Math.round(lat/d)}:${Math.round(lon/d)}:${type}`}
const cache=new Map();function scheduleLoad(force=false){clearTimeout(loadTimer);if(zoom<MIN_Z){network='idle';renderOverlay();return}loadTimer=setTimeout(()=>load(force),650)}
function load(force=false){const key=queryKey();if(!force&&cache.has(key)){items=cache.get(key);buildPotential();network='ok';source='Önbellek';renderOverlay();return}const id=String(++requestSeq);latestRequest=+id;network='loading';fallbackTried=false;renderOverlay();try{AndroidApp.fetchOverpassV3(id,buildQuery())}catch(e){overpassError(id,String(e.message||e))}}
window.onNativeOverpassV3=function(id,raw,src){if(+id!==latestRequest)return;try{items=parseOverpass(raw,src||'canlı');cache.set(queryKey(),items);if(cache.size>30)cache.delete(cache.keys().next().value);buildPotential();network='ok';source='Canlı • '+(src||'Overpass');renderOverlay()}catch(e){overpassError(id,'Ayrıştırma: '+e.message)}};
function fallbackBbox(){const r=Math.min(radius(),zoom===14?500:zoom===15?400:300),dy=r/111000,dx=dy/Math.max(.25,Math.cos(lat*Math.PI/180));return[(lon-dx).toFixed(6),(lat-dy).toFixed(6),(lon+dx).toFixed(6),(lat+dy).toFixed(6)].join(',')}
function overpassError(id,msg){if(+id!==latestRequest)return;if(zoom>=14&&!fallbackTried){fallbackTried=true;network='loading';source='OSM API yedeği';renderOverlay();try{AndroidApp.fetchOsmMapV2(id,fallbackBbox());return}catch(e){}}network='error';source='';renderOverlay();document.getElementById('netBadge').title=msg||''}
window.onNativeOverpassErrorV3=overpassError;window.onNativeOsmMapV2=function(id,raw){if(+id!==latestRequest)return;try{items=parseOsmXml(raw);buildPotential();network='ok';source='OSM API yedeği';renderOverlay()}catch(e){network='error';source='';renderOverlay()}};window.onNativeOsmMapErrorV2=function(id,msg){if(+id!==latestRequest)return;network='error';source='';renderOverlay();document.getElementById('netBadge').title=msg||''};
function search(text){const q=text.trim();if(!q)return;try{AndroidApp.geocode(q)}catch(e){}}window.onNativeGeocode=function(raw){let a=[];try{a=JSON.parse(raw)}catch(e){}let h='<h2>Arama sonuçları</h2>';for(const r of a)h+=`<div class="result" onclick="jump(${+r.lat},${+r.lon},14)"><b>${esc(r.name||String(r.display_name||'').split(',')[0])}</b><div class="muted">${esc(r.display_name||'')}</div></div>`;if(!a.length)h+='<div class="notice">Sonuç bulunamadı.</div>';h+='<button class="gold" onclick="closeSheet()">Kapat</button>';showSheet(h)};window.onNativeGeocodeError=m=>showSheet(`<h2>Arama</h2><div class="notice">${esc(m)}</div><button class="gold" onclick="closeSheet()">Kapat</button>`);window.jump=(a,o,z)=>{closeSheet();setCenter(a,o,z)};window.onNativeLocation=(a,o)=>setCenter(a,o,15);
document.getElementById('periodBtn').onclick=()=>choose('Dönem filtresi',PERIODS,period,x=>period=x);document.getElementById('typeBtn').onclick=()=>choose('Kayıt türü',TYPES,type,x=>type=x);document.getElementById('refresh').onclick=()=>scheduleLoad(true);document.getElementById('near').onclick=nearby;document.getElementById('loc').onclick=()=>{try{AndroidApp.requestLocation()}catch(e){}};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search(e.target.value)}});document.getElementById('menu').onclick=()=>showSheet(`<h2>v12 STABLE</h2><div class="card"><b>Akış</b><br>Zoom 13: tür kümeleri<br>Zoom 14+: kayıt adları ve kaynak geometrileri<br>Canlı Overpass başarısızsa zoom 14+ seviyesinde OpenStreetMap API yedeği denenir.</div><div class="card"><b>Şu an:</b><br>Zoom ${zoom} • ${items.length} yüklü kayıt<br>Kaynak: ${esc(source||'henüz yok')}</div><div class="notice">Dönem bilgisi yalnız kaynakta açıkça etiketlenmişse filtrelenir. Uygulama bilinmeyen dönem veya saklama noktası uydurmaz.</div><button class="gold" onclick="window.retry()">Veriyi yeniden yükle</button> <button class="gold" onclick="jump(39,35.2,6)">Türkiye</button> <button class="gold" onclick="closeSheet()">Kapat</button>`);window.retry=()=>{closeSheet();scheduleLoad(true)};document.getElementById('zin').onclick=()=>setCenter(lat,lon,zoom+1);document.getElementById('zout').onclick=()=>setCenter(lat,lon,zoom-1);
const ptr=new Map();let drag=null,pinch=null;const pa=()=>[...ptr.values()];map.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);if(ptr.size===1)drag={x:e.clientX,y:e.clientY,c:cw(),z:zoom};else if(ptr.size===2){const a=pa(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;pinch={d:Math.hypot(dx,dy),z:zoom,a:lat,o:lon};drag=null}});map.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1&&drag){const p=pa()[0],[a,o]=unproject(drag.c[0]-(p.x-drag.x),drag.c[1]-(p.y-drag.y),drag.z);lat=a;lon=o;renderTiles();renderOverlay()}else if(ptr.size===2&&pinch){const a=pa(),d=Math.max(20,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),z=clamp(Math.round(pinch.z+Math.log2(d/pinch.d)),3,18);if(z!==zoom){zoom=z;lat=pinch.a;lon=pinch.o;render()}}});function end(e){ptr.delete(e.pointerId);if(!ptr.size){drag=null;pinch=null;scheduleLoad()}else if(ptr.size===1){const p=pa()[0];drag={x:p.x,y:p.y,c:cw(),z:zoom};pinch=null}}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);window.addEventListener('resize',render);render();
</script>
