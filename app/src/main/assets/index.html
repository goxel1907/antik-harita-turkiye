const settlementLayer=L.layerGroup().addTo(map),roadLayer=L.layerGroup().addTo(map),stopLayer=L.layerGroup().addTo(map),bridgeLayer=L.layerGroup().addTo(map),modelLayer=L.layerGroup();
let activePeriod='Roma';let state={settlements:true,roads:true,stops:true,bridges:true,model:false};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function periodMatches(arr){return arr.includes(activePeriod)}
function renderPeriods(){const box=document.getElementById('periods');box.innerHTML='';periods.forEach(p=>{const b=document.createElement('button');b.className='c'+(p.id===activePeriod?' active':'');b.textContent=p.label;b.onclick=()=>{activePeriod=p.id;document.getElementById('periodLabel').textContent=p.label+' dönemi';document.getElementById('periodTitle').textContent=p.title;renderPeriods();drawAll()};box.appendChild(b)})}
function drawSettlements(){settlementLayer.clearLayers();if(!state.settlements)return;const q=(document.getElementById('q').value||'').toLowerCase();let n=0;sites.forEach(s=>{if(!periodMatches(s[5]))return;const txt=s.join(' ').toLowerCase();if(q&&!txt.includes(q))return;n++;const m=L.circleMarker([s[3],s[4]],{radius:7,weight:2,color:'#412c19',fillColor:'#e3b35a',fillOpacity:.92}).addTo(settlementLayer);m.bindTooltip(esc(s[0]),{permanent:map.getZoom()>=7,direction:'top',className:'histLabel'});m.bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+' • '+esc(s[2])+'<br>'+esc(s[6])+'<br><small>'+esc(s[5].join(' • '))+'</small>')});document.getElementById('count').textContent=n}
function drawRoads(){roadLayer.clearLayers();if(!state.roads)return;(roads[activePeriod]||[]).forEach(r=>{const p=L.polyline(r[1],{color:'#8b493d',weight:4,opacity:.85}).addTo(roadLayer);p.bindPopup('<b>'+esc(r[0])+'</b><br>'+activePeriod+' dönem rekonstrüksiyon koridoru')})}
function drawStops(){stopLayer.clearLayers();if(!state.stops)return;stops.forEach(s=>{if(!periodMatches(s[4]))return;L.circleMarker([s[2],s[3]],{radius:6,color:'#5a390d',fillColor:'#d89a2b',fillOpacity:1}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br>Konak / menzil / durak').addTo(stopLayer)})}
function drawBridges(){bridgeLayer.clearLayers();if(!state.bridges)return;bridges.forEach(s=>{if(!periodMatches(s[4]))return;L.circleMarker([s[2],s[3]],{radius:6,color:'#183b5a',fillColor:'#4e8fc8',fillOpacity:1}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br>Köprü / geçit').addTo(bridgeLayer)})}
function drawModel(){modelLayer.clearLayers();if(map.hasLayer(modelLayer))map.removeLayer(modelLayer);if(!state.model)return;(model[activePeriod]||[]).forEach(x=>L.polyline(x,{color:'#7a56a5',weight:5,opacity:.7,dashArray:'8 7'}).bindPopup('<b>Model çıkarımı</b><br>'+activePeriod+' döneminde topoğrafya ve bilinen düğümler arasında olası hareket koridoru.').addTo(modelLayer));modelLayer.addTo(map)}
function drawAll(){drawSettlements();drawRoads();drawStops();drawBridges();drawModel()}

document.getElementById('toolsBtn').onclick=openLayers;document.getElementById('q').addEventListener('input',drawSettlements);document.getElementById('locBtn').onclick=()=>{try{if(window.AndroidApp&&AndroidApp.requestLocation)AndroidApp.requestLocation()}catch(e){}};window.onNativeLocation=(a,b,c)=>{L.circleMarker([a,b],{radius:8,color:'#0b4b88',fillColor:'#5aa7e6',fillOpacity:1}).addTo(map).bindPopup('Konumunuz').openPopup();map.setView([a,b],12)};map.on('zoomend',drawSettlements);renderPeriods();drawAll();
