const map=L.map('map',{zoomControl:true,tap:true}).setView([39,35],6);const street=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'});L.control.layers({'Standart':street,'Topoğrafya':topo},null,{position:'bottomright'}).addTo(map);const layer=L.layerGroup().addTo(map),pot=L.layerGroup();let active='';
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPeriods(){const box=document.getElementById('periods');box.innerHTML='';periods.forEach(p=>{const b=document.createElement('button');b.className='c'+((p==='Tümü'&&!active)||p===active?' active':'');b.textContent=p;b.type='button';b.dataset.period=p==='Tümü'?'':p;b.onclick=()=>setPeriod(b.dataset.period);box.appendChild(b)})}
function setPeriod(p){active=p;document.getElementById('activeLabel').textContent=p||'Tüm dönemler';renderPeriods();draw()}
function detail(s){const sh=document.getElementById('sheet');sh.innerHTML='<h2>'+esc(s[0])+'</h2><div class="detailGrid"><div class="k">Bugünkü ad</div><div class="v">'+esc(s[1])+'</div><div class="k">Mevki</div><div class="v">'+esc(s[2])+'</div><div class="k">Dönem</div><div class="v">'+esc(s[3].replaceAll('|',', '))+'</div><div class="k">Tür</div><div class="v">'+esc(s[4])+'</div><div class="k">Tarih aralığı</div><div class="v">'+esc(s[7])+'</div><div class="k">Koordinat</div><div class="v">'+s[5].toFixed(5)+', '+s[6].toFixed(5)+'</div></div><div class="source">Kaynak sınıfı: kamuya açık / bilinen arkeolojik yerleşim. Konum hassasiyeti kayıt türüne göre değişebilir.</div><p><button id="navDetail" class="b">Haritada aç / yol tarifi</button> <button id="closeDetail" class="b">Kapat</button></p>';sh.classList.add('open');document.getElementById('navDetail').onclick=()=>nav(s[5],s[6],s[1]);document.getElementById('closeDetail').onclick=()=>sh.classList.remove('open')}
function draw(){layer.clearLayers();const q=(document.getElementById('q').value||'').trim().toLocaleLowerCase('tr-TR');let n=0;sites.forEach((s,i)=>{const hay=(s[0]+' '+s[1]+' '+s[2]+' '+s[3]+' '+s[4]+' '+s[7]).toLocaleLowerCase('tr-TR');if(active&&!s[3].split('|').includes(active))return;if(q&&!hay.includes(q))return;n++;const m=L.circleMarker([s[5],s[6]],{radius:7,weight:2,fillOpacity:.9});m.bindPopup('<span class="markerName">'+esc(s[0])+'</span><br><span class="markerMeta">'+esc(s[1])+' • '+esc(s[2])+'</span><br>'+esc(s[3].replaceAll('|',' · '))+'<br><button class="b mini">Detay</button>');m.on('popupopen',e=>{const btn=e.popup.getElement().querySelector('button');if(btn)btn.onclick=()=>detail(s)});m.addTo(layer)});document.getElementById('count').textContent=n}
function locate(){try{if(window.AndroidApp&&AndroidApp.requestLocation){AndroidApp.requestLocation();return}}catch(e){}navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>window.onNativeLocation(x.coords.latitude,x.coords.longitude,x.coords.accuracy),()=>alert('Konum alınamadı.'))}
window.onNativeLocation=(a,b,c)=>{L.circleMarker([a,b],{radius:10,weight:3,fillOpacity:1}).addTo(map).bindPopup('Konumunuz • yaklaşık '+Math.round(c)+' m').openPopup();map.setView([a,b],13)};
function nav(a,b,n){try{if(window.AndroidApp&&AndroidApp.openGeo){AndroidApp.openGeo(a,b,n);return}}catch(e){}location.href='geo:'+a+','+b}
function openTools(){const sh=document.getElementById('sheet');sh.innerHTML='<h2>Araçlar</h2><div class="toolGrid"><button id="potBtn" class="b">Potansiyel bölgeler</button><button id="scanBtn" class="b">Kamu kayıtlarını tara</button><button id="reportBtn" class="b">Gözlem kaydı</button><button id="fitBtn" class="b">Türkiye görünümü</button></div><p class="muted">Potansiyel katmanı yalnızca geniş araştırma bölgelerini gösterir; hassas/yayımlanmamış kazı veya define hedefi içermez.</p><button id="closeBtn" class="b">Kapat</button>';sh.classList.add('open');document.getElementById('potBtn').onclick=togglePot;document.getElementById('scanBtn').onclick=scan;document.getElementById('reportBtn').onclick=report;document.getElementById('fitBtn').onclick=()=>{map.setView([39,35],6);sh.classList.remove('open')};document.getElementById('closeBtn').onclick=()=>sh.classList.remove('open')}
function togglePot(){if(map.hasLayer(pot))map.removeLayer(pot);else{pot.clearLayers();potential.forEach(x=>L.circle([x[1],x[2]],{radius:x[3],dashArray:'7 6',weight:2,fillOpacity:.06}).bindPopup('<b>'+esc(x[0])+'</b><br>Yaklaşık araştırma bölgesi').addTo(pot));pot.addTo(map)}document.getElementById('sheet').classList.remove('open')}
async function scan(){document.getElementById('sheet').classList.remove('open');const b=map.getBounds(),qq='[out:json][timeout:25];(node[historic=archaeological_site]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+');way[historic=archaeological_site]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+'););out center tags;';try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:qq}),j=await r.json();j.elements.forEach(e=>{const a=e.lat||(e.center&&e.center.lat),bb=e.lon||(e.center&&e.center.lon);if(a&&bb)L.circleMarker([a,bb],{radius:5,weight:1,fillOpacity:.75}).bindPopup('<b>'+esc((e.tags&&e.tags.name)||'Kamuya açık arkeolojik kayıt')+'</b><br>OpenStreetMap').addTo(layer)});alert(j.elements.length+' kamu kaydı yüklendi')}catch(e){alert('Kamu kayıt taraması şu an yapılamadı. İnternet bağlantısını kontrol edin.')}}
function report(){document.getElementById('sheet').classList.remove('open');const note=prompt('Yüzeyde gördüğünüz izi kısaca yazın. Kazı yapmayın veya buluntuyu yerinden oynatmayın.');if(note){localStorage.setItem('lastObservation',JSON.stringify({time:new Date().toISOString(),note}));try{window.AndroidApp&&AndroidApp.requestLocation()}catch(e){}}}
document.getElementById('locBtn').onclick=locate;document.getElementById('toolsBtn').onclick=openTools;document.getElementById('q').oninput=draw;renderPeriods();draw();
