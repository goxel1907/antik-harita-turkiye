const roads=[
{name:'Via Sebaste / Pisidia koridoru',period:'Roma',note:'Pamphylia–Pisidia bağlantısının yaklaşık kamuya açık tarihî koridoru',pts:[[36.96,30.85],[37.10,30.60],[37.42,30.53],[37.68,30.52],[38.05,30.17]]},
{name:'Anadolu Kraliyet Yolu batı kolu',period:'Pers|Helenistik|Roma',note:'Sardis–İç Anadolu doğrultusunun genel tarihî koridoru',pts:[[38.49,28.04],[38.75,29.40],[39.20,30.70],[39.65,31.99],[39.94,32.86],[39.70,34.60]]},
{name:'Konya–Aksaray–Kayseri kervan yolu',period:'Selçuklu',note:'Kamuya açık han ve kervansarayları bağlayan yaklaşık tarihî ulaşım koridoru',pts:[[37.87,32.49],[38.05,32.42],[38.09,32.64],[38.25,33.55],[38.38,33.99],[38.72,34.91],[38.75,35.49]]},

{name:'Ege iç hat / Menderes koridoru',period:'Helenistik|Roma|Bizans',note:'Miletos–Magnesia–Tralleis–Laodikeia doğrultusunun yaklaşık tarihî ulaşım ekseni',pts:[[37.53,27.28],[37.85,27.53],[37.86,27.85],[37.84,29.11],[37.93,29.12]]},
{name:'Troas kıyı ve iç bağlantısı',period:'Helenistik|Roma|Bizans',note:'Assos–Alexandria Troas–Troia doğrultusunun yaklaşık tarihî koridoru',pts:[[39.49,26.34],[39.75,26.16],[39.96,26.24]]},
{name:'Yukarı Mezopotamya doğu-batı hattı',period:'Roma|Bizans|Artuklu|Selçuklu',note:'Dara–Mardin–Diyarbakır–Hasankeyf yönündeki genel tarihî geçiş koridoru',pts:[[37.18,40.96],[37.31,40.74],[37.91,40.23],[38.16,41.20],[37.71,41.41]]}
];
const modelZones=[
{name:'Menderes kullanım sürekliliği',center:[37.84,28.20],radius:18000,why:['antik kent zinciri','nehir vadisi','çok dönemli yol sürekliliği','su ve tarım erişimi'],scores:{use:92,transport:88,water:95,rest:76,continuity:94,source:78,risk:82}},
{name:'Konya–Aksaray konaklama kuşağı',center:[38.15,33.15],radius:16000,why:['han/kervansaray dizisi','günlük yolculuk ritmi','ova geçişi','çoklu tarihî durak'],scores:{use:90,transport:96,water:72,rest:98,continuity:88,source:91,risk:80}},
{name:'Antalya kuzey geçit kuşağı',center:[37.26,30.57],radius:14000,why:['Toros geçişi','han zinciri','kıyı–iç bölge bağlantısı','mevsimsel geçit kontrolü'],scores:{use:86,transport:93,water:74,rest:84,continuity:87,source:82,risk:78}},
{name:'Troas tekrar kullanım koridoru',center:[39.78,26.23],radius:13000,why:['liman–iç yerleşim ilişkisi','çok dönemli merkezler','kıyı ulaşımı','dar coğrafi geçiş'],scores:{use:84,transport:79,water:88,rest:70,continuity:89,source:80,risk:76}},
{name:'Diyarbakır–Hasankeyf geçiş kuşağı',center:[37.88,40.84],radius:18000,why:['nehir/geçit bağı','köprü ve tarihî kentler','çok dönemli doğu-batı hareketi','savunma ve ulaşım sürekliliği'],scores:{use:91,transport:90,water:94,rest:75,continuity:93,source:83,risk:85}},
{name:'Ankara–Gordion iç Anadolu koridoru',center:[39.80,32.30],radius:17000,why:['başkent/merkez bağlantısı','ova ulaşımı','farklı dönemlerde tekrar kullanım','uzun mesafe iç hat'],scores:{use:80,transport:86,water:65,rest:70,continuity:88,source:76,risk:69}}
];
const map=L.map('map',{zoomControl:true,tap:true}).setView([39,35],6);const street=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'});L.control.layers({'Standart':street,'Topoğrafya':topo},null,{position:'bottomright'}).addTo(map);
const siteLayer=L.layerGroup().addTo(map),roadLayer=L.layerGroup(),stopLayer=L.layerGroup(),bridgeLayer=L.layerGroup(),modelLayer=L.layerGroup();let active='';
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPeriods(){const box=document.getElementById('periods');box.innerHTML='';periods.forEach(p=>{const b=document.createElement('button');b.className='c'+((p==='Tümü'&&!active)||p===active?' active':'');b.textContent=p;b.type='button';b.dataset.period=p==='Tümü'?'':p;b.addEventListener('click',()=>setPeriod(b.dataset.period));box.appendChild(b)})}
function setPeriod(p){active=p;document.getElementById('activeLabel').textContent=p||'Tüm dönemler';renderPeriods();drawSites()}
function drawSites(){siteLayer.clearLayers();const q=(document.getElementById('q').value||'').toLowerCase();let n=0;sites.forEach(s=>{const txt=s.join(' ').toLowerCase();if((active&&!s[3].includes(active))||(q&&!txt.includes(q)))return;n++;L.circleMarker([s[5],s[6]],{radius:6,weight:2,fillOpacity:.8}).addTo(siteLayer).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br><small>'+esc(s[2])+' • '+esc(s[3])+'</small>')});document.getElementById('count').textContent=n}
function showScore(z){const s=z.scores;const total=Math.round((s.use+s.transport+s.water+s.rest+s.continuity+s.source+s.risk)/7);const sh=document.getElementById('sheet');sh.innerHTML='<h2>'+esc(z.name)+'</h2><div class="scoreBox"><div class="muted">Koruma önceliği</div><div class="score">'+total+'/100</div>'+[['Tarihî kullanım',s.use],['Ulaşım',s.transport],['Su erişimi',s.water],['Konaklama',s.rest],['Dönem sürekliliği',s.continuity],['Kaynak güveni',s.source],['Koruma riski',s.risk]].map(x=>'<div>'+x[0]+' • '+x[1]+'</div><div class="bar"><i style="width:'+x[1]+'%"></i></div>').join('')+'<div><b>Neden:</b><br>'+z.why.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div><p class="muted">Bu alan model çıkarımıdır; tarihî kullanım ve koruma önceliğini gösterir, kesin arkeolojik hedef anlamına gelmez.</p><button class="b" id="closeScore">Kapat</button></div>';sh.classList.add('open');document.getElementById('closeScore').onclick=()=>sh.classList.remove('open')}
function toggleLayer(layer,drawFn){if(map.hasLayer(layer)){map.removeLayer(layer)}else{drawFn();layer.addTo(map)}document.getElementById('legend').classList.add('on')}
function drawRoads(){roadLayer.clearLayers();roads.forEach(r=>L.polyline(r.pts,{weight:4,opacity:.8}).bindPopup('<b>'+esc(r.name)+'</b><br>'+esc(r.period)+'<br><small>'+esc(r.note)+'</small>').addTo(roadLayer))}
function drawStops(){stopLayer.clearLayers();stops.forEach(s=>L.circleMarker([s[3],s[4]],{radius:6,fillOpacity:.9}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br>'+esc(s[2])+'<br>'+esc(s[5])).addTo(stopLayer))}
function drawBridges(){bridgeLayer.clearLayers();bridges.forEach(s=>L.circleMarker([s[3],s[4]],{radius:6,fillOpacity:.9}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br>'+esc(s[2])+'<br>'+esc(s[5])).addTo(bridgeLayer))}
function drawModel(){modelLayer.clearLayers();modelZones.forEach(z=>{const c=L.circle(z.center,{radius:z.radius,weight:2,dashArray:'7 6',fillOpacity:.08}).addTo(modelLayer);c.bindTooltip(z.name);c.on('click',()=>showScore(z))})}
function openTools(){const sh=document.getElementById('sheet');sh.innerHTML='<h2>Katmanlar ve analiz</h2><div class="layerRow"><div><b>Tarihî yollar</b><div class="muted">Belgelenmiş / genel güzergâh koridorları</div></div><button class="b switch" id="rBtn">Aç/Kapat</button></div><div class="layerRow"><div><b>Han / menzil / duraklar</b><div class="muted">Kamuya açık tarihî konaklama noktaları</div></div><button class="b switch" id="sBtn">Aç/Kapat</button></div><div class="layerRow"><div><b>Köprü / geçitler</b><div class="muted">Tarihî geçiş düğümleri</div></div><button class="b switch" id="bBtn">Aç/Kapat</button></div><div class="layerRow"><div><b>Tarihî kullanım modeli</b><div class="muted">Su, ulaşım, konaklama ve dönem sürekliliği</div></div><button class="b switch" id="mBtn">Aç/Kapat</button></div><div class="toolGrid"><button class="b" id="allBtn">Tümünü aç</button><button class="b" id="closeBtn">Kapat</button></div><p class="muted">Model çıkarımı ile belgelenmiş kayıtlar ayrı tutulur. Model bölgeleri koruma/ön tespit önceliğidir; kesin arkeolojik hedef değildir.</p>';sh.classList.add('open');document.getElementById('rBtn').onclick=()=>toggleLayer(roadLayer,drawRoads);document.getElementById('sBtn').onclick=()=>toggleLayer(stopLayer,drawStops);document.getElementById('bBtn').onclick=()=>toggleLayer(bridgeLayer,drawBridges);document.getElementById('mBtn').onclick=()=>toggleLayer(modelLayer,drawModel);document.getElementById('allBtn').onclick=()=>{drawRoads();drawStops();drawBridges();drawModel();[roadLayer,stopLayer,bridgeLayer,modelLayer].forEach(l=>{if(!map.hasLayer(l))l.addTo(map)});document.getElementById('legend').classList.add('on')};document.getElementById('closeBtn').onclick=()=>sh.classList.remove('open')}
function locate(){try{if(window.AndroidApp&&AndroidApp.requestLocation){AndroidApp.requestLocation();return}}catch(e){}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(x=>window.onNativeLocation(x.coords.latitude,x.coords.longitude,x.coords.accuracy),()=>alert('Konum alınamadı.'))}
window.onNativeLocation=(a,b,c)=>{L.circleMarker([a,b],{radius:9,weight:3,fillOpacity:.9}).addTo(map).bindPopup('Konumunuz • ~'+Math.round(c)+' m').openPopup();map.setView([a,b],13)};
document.getElementById('locBtn').addEventListener('click',locate);document.getElementById('toolsBtn').addEventListener('click',openTools);document.getElementById('q').addEventListener('input',drawSites);window.onNativeSaved=p=>alert('Kaydedildi: '+p);window.onNativeError=e=>alert(e);renderPeriods();drawSites();
</script>
</body></html>
