function recordVisible(r){return(!activePeriod||r.periods.includes(activePeriod))&&(activeClass==='all'||r.class===activeClass)}
function detailRecord(r){let sh=document.getElementById('sheet');let src=r.sources.map(k=>'<div class="sourceBox"><b>'+esc(SOURCES[k].name)+'</b><div class="muted">'+esc(SOURCES[k].kind)+'</div><div class="muted">'+esc(SOURCES[k].note)+'</div></div>').join('');sh.innerHTML='<h2>'+esc(r.anc||r.name)+'</h2>'+classTag(r.class)+'<div class="detailGrid" style="margin-top:12px"><div class="k">Güncel ad</div><div class="v">'+esc(r.modern||'—')+'</div><div class="k">Mevki</div><div class="v">'+esc(r.place||'Bölgesel model')+'</div><div class="k">Dönem</div><div class="v">'+esc(r.periods.join(', '))+'</div><div class="k">Tür</div><div class="v">'+esc(r.type||'Potansiyel tarihî peyzaj')+'</div><div class="k">Konum doğruluğu</div><div class="v">'+esc(r.accuracy)+'</div><div class="k">Kaynak sayısı</div><div class="v">'+r.sourceCount+'</div><div class="k">Kanıt güveni</div><div class="v">%'+r.confidence+'</div><div class="k">Koruma önceliği</div><div class="v"><span class="score">'+r.protection+'/100</span></div></div><div class="warn"><b>Neden?</b><br>'+esc(r.why)+'</div><h3>Kaynak zinciri</h3>'+src+'<button id="closeDetail" class="b">Kapat</button>';sh.classList.add('open');document.getElementById('closeDetail').onclick=()=>sh.classList.remove('open')}
function renderAll(){groups.records.clearLayers();groups.roads.clearLayers();groups.potential.clearLayers();groups.local.clearLayers();let visible=0;if(layerState.records){records.forEach(r=>{if(!recordVisible(r))return;visible++;let p=activePeriod||r.periods[0],col=periodColor(p);let m=L.circleMarker([r.lat,r.lon],{radius:r.class==='documented'?8:7,color:'#fff',weight:2,fillColor:col,fillOpacity:.9}).addTo(groups.records);m.bindTooltip(r.anc,{permanent:map.getZoom()>=7,direction:'top',className:'hist-label'});m.on('click',()=>detailRecord(r))})}if(layerState.roads&&activePeriod&&roads[activePeriod])roads[activePeriod].forEach(x=>L.polyline(x[1],{color:periodColor(activePeriod),weight:5,opacity:.78}).bindTooltip(x[0]).addTo(groups.roads));if(layerState.potential)potential.forEach(r=>{if(!recordVisible(r))return;visible++;let c=L.circle([r.lat,r.lon],{radius:r.radius,color:'#7f4c8b',weight:2,dashArray:'8 6',fillColor:'#9b65a9',fillOpacity:.10}).addTo(groups.potential);c.bindTooltip(r.name,{direction:'center'});c.on('click',()=>detailRecord(r))});renderLocal();document.getElementById('count').textContent=visible;document.getElementById('legend').innerHTML='<div>● Belgelenmiş/literatür yer</div><div style="color:#c99">◌ Potansiyel bölgesel model</div><div>━━ Seçili dönem tarihî yol rekonstrüksiyonu</div>';document.getElementById('periodTitle').textContent=activePeriod?(activePeriod+' tarihî peyzajı'):'Tüm dönemler • kaynaklı görünüm'}
function getLocal(){try{return JSON.parse(localStorage.getItem('localNarratives')||'[]')}catch(e){return[]}}
function renderLocal(){if(!layerState.local)return;getLocal().forEach(r=>{if(activeClass!=='all'&&activeClass!=='local')return;if(activePeriod&&r.period&&r.period!==activePeriod)return;let c=L.circle([r.lat,r.lon],{radius:r.radius||3500,color:'#d59b43',dashArray:'4 5',fillOpacity:.12}).addTo(groups.local);c.bindTooltip('Yerel anlatı: '+r.name);c.on('click',()=>detailRecord({anc:r.name,modern:'—',place:r.place||'Kullanıcı kaydı',periods:r.period?[r.period]:['Bilinmiyor'],type:'Yerel/sözlü anlatı',class:'local',accuracy:'Yaklaşık kullanıcı bölgesi',sources:[],sourceCount:0,confidence:25,protection:55,why:r.note||'Kullanıcı tarafından yerel anlatı olarak kaydedildi; arkeolojik doğrulama değildir.'}))})}
function openTools(){let sh=document.getElementById('sheet');let row=(key,title,sub)=>'<div class="layerRow '+(layerState[key]?'on':'')+'" data-layer="'+key+'"><div class="layerText"><b>'+title+'</b><span class="muted">'+sub+'</span></div><button class="b">'+(layerState[key]?'Açık':'Kapalı')+'</button></div>';sh.innerHTML='<h2>Katmanlar ve kaynaklar</h2>'+row('base','Güncel Türkiye tabanı','İl/ilçe/mahalle/köy ve güncel coğrafi referans')+row('records','Tarihî kayıtlar','Belgelenmiş ve literatür kayıtları')+row('roads','Tarihî yollar','Seçili döneme ait yaklaşık rekonstrüksiyonlar')+row('potential','Potansiyel / hassas peyzaj','Bölgesel model; kesin arkeolojik hedef değildir')+row('local','Yerel anlatılar','Bu cihazda kullanıcı tarafından eklenen sözlü kayıtlar')+'<button id="addLocal" class="b">＋ Yerel anlatı ekle</button> <button id="sourcesBtn" class="b">Kaynak kataloğu</button> <button id="trBtn" class="b">Türkiye görünümü</button> <button id="closeTools" class="b">Kapat</button>';sh.classList.add('open');sh.querySelectorAll('[data-layer]').forEach(el=>el.onclick=()=>{let k=el.dataset.layer;layerState[k]=!layerState[k];if(k==='base'){if(layerState.base&&!map.hasLayer(osm))osm.addTo(map);if(!layerState.base&&map.hasLayer(osm))map.removeLayer(osm)}openTools();renderAll()});document.getElementById('addLocal').onclick=openLocalForm;document.getElementById('sourcesBtn').onclick=openSources;document.getElementById('trBtn').onclick=()=>{sh.classList.remove('open');map.fitBounds([[35.7,25.6],[42.2,44.9]],{padding:[20,20]})};document.getElementById('closeTools').onclick=()=>sh.classList.remove('open')}
function openSources(){let sh=document.getElementById('sheet');sh.innerHTML='<h2>Kaynak kataloğu</h2>'+Object.values(SOURCES).map(s=>'<div class="sourceBox"><b>'+esc(s.name)+'</b><div>'+esc(s.kind)+'</div><div class="muted">'+esc(s.note)+'</div></div>').join('')+'<div class="warn">Kaynak kataloğu uygulamanın veri modelini gösterir. Tüm Türkiye ve dünya literatürünün eksiksiz içe aktarımı değildir; her kayıt için kaynak zinciri ayrıca gösterilir.</div><button id="backTools" class="b">Geri</button>';document.getElementById('backTools').onclick=openTools}
function openLocalForm(){let sh=document.getElementById('sheet'),c=map.getCenter();sh.innerHTML='<h2>Yerel / sözlü anlatı ekle</h2><div class="warn">Haritanın mevcut merkezi yaklaşık bölge olarak kaydedilir. Bu kayıt doğrulanmış arkeolojik alan sayılmaz.</div><input id="ln" class="input" placeholder="Anlatı / yer adı"><input id="lp" class="input" placeholder="Dönem (bilmiyorsanız boş)"><input id="lplace" class="input" placeholder="Köy / mahalle / mevki"><textarea id="lnote" class="input" rows="4" placeholder="Kimden / nasıl duyuldu, anlatının özeti"></textarea><button id="saveLocal" class="b">Kaydet</button> <button id="cancelLocal" class="b">İptal</button>';document.getElementById('saveLocal').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name){alert('Bir ad yazın');return}let arr=getLocal();arr.push({name,period:document.getElementById('lp').value.trim(),place:document.getElementById('lplace').value.trim(),note:document.getElementById('lnote').value.trim(),lat:c.lat,lon:c.lng,radius:3500});localStorage.setItem('localNarratives',JSON.stringify(arr));sh.classList.remove('open');renderAll()};document.getElementById('cancelLocal').onclick=openTools}
async function searchAll(){let term=document.getElementById('q').value.trim();if(!term)return;let sh=document.getElementById('sheet');sh.innerHTML='<h2>Aranıyor…</h2><div class="muted">Güncel yer adı + tarihî kayıtlar</div>';sh.classList.add('open');let local=records.filter(r=>(r.anc+' '+r.modern+' '+r.place+' '+r.type+' '+r.periods.join(' ')).toLocaleLowerCase('tr').includes(term.toLocaleLowerCase('tr')));let geo=[];try{let cacheKey='geo:'+term.toLocaleLowerCase('tr'),cached=sessionStorage.getItem(cacheKey);if(cached)geo=JSON.parse(cached);else{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tr&limit=8&addressdetails=1&q='+encodeURIComponent(term);let res=await fetch(url,{headers:{'Accept-Language':'tr'}});if(res.ok){geo=await res.json();sessionStorage.setItem(cacheKey,JSON.stringify(geo))}}}catch(e){}let html='<h2>Arama sonuçları</h2>';local.forEach(r=>html+='<div class="result histResult" data-id="'+r.id+'"><b>'+esc(r.anc)+' / '+esc(r.modern)+'</b><div class="muted">'+esc(r.place)+' • '+esc(r.periods.join(', '))+' • '+className(r.class)+'</div></div>');geo.forEach((g,i)=>html+='<div class="result geoResult" data-i="'+i+'"><b>'+esc(g.name||g.display_name.split(',')[0])+'</b><div class="muted">'+esc(g.display_name)+'</div><span class="accuracy">OSM güncel yer sonucu</span></div>');if(!local.length&&!geo.length)html+='<div class="warn">Sonuç bulunamadı. Yazımı veya daha geniş yer adını deneyin.</div>';html+='<button id="closeSearch" class="b">Kapat</button>';sh.innerHTML=html;sh.querySelectorAll('.histResult').forEach(el=>el.onclick=()=>{let r=records.find(x=>x.id===el.dataset.id);sh.classList.remove('open');map.setView([r.lat,r.lon],13);detailRecord(r)});sh.querySelectorAll('.geoResult').forEach(el=>el.onclick=()=>{let g=geo[Number(el.dataset.i)];sh.classList.remove('open');groups.search.clearLayers();let lat=Number(g.lat),lon=Number(g.lon);map.setView([lat,lon],g.type==='city'||g.type==='town'?11:14);L.marker([lat,lon]).bindPopup('<b>'+esc(g.display_name)+'</b><br><small>OpenStreetMap/Nominatim güncel yer sonucu</small>').addTo(groups.search).openPopup()});document.getElementById('closeSearch').onclick=()=>sh.classList.remove('open')}
function locate(){try{if(window.AndroidApp&&AndroidApp.requestLocation){AndroidApp.requestLocation();return}}catch(e){}navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>window.onNativeLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy))}
window.onNativeLocation=(a,b,c)=>{groups.search.clearLayers();L.circle([a,b],{radius:Math.max(c,15),color:'#2877c7',fillOpacity:.12}).addTo(groups.search);L.marker([a,b]).bindPopup('Konumunuz • ~'+Math.round(c)+' m').addTo(groups.search).openPopup();map.setView([a,b],14)};
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchAll()}});document.getElementById('locBtn').onclick=locate;document.getElementById('toolsBtn').onclick=openTools;map.on('zoomend',renderAll);renderControls();renderAll();map.fitBounds([[35.7,25.6],[42.2,44.9]],{padding:[18,18]});
</script>
</body></html>
