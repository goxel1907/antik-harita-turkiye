<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Antik Harita Türkiye</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:system-ui;background:#0d1117}.top{position:fixed;z-index:1000;top:8px;left:8px;right:8px;background:#111821ee;color:white;padding:9px;border-radius:14px}.row{display:flex;gap:6px;flex-wrap:wrap}.q{flex:1;min-width:140px;padding:10px;border-radius:9px;border:1px solid #445;background:#0d131a;color:white}.b{padding:9px;border:0;border-radius:9px;background:#e7bd68;font-weight:800}.chips{display:flex;gap:5px;overflow:auto;margin-top:7px}.c{white-space:nowrap;padding:5px 8px;border-radius:20px;background:#26313d;color:#fff;border:1px solid #465365}.sheet{position:fixed;z-index:1500;bottom:0;left:0;right:0;background:#151b23;color:#fff;padding:14px;border-radius:18px 18px 0 0;max-height:70vh;overflow:auto;display:none}.sheet.open{display:block}.card{min-width:240px}.muted{color:#9aa8b7;font-size:12px}.leaflet-control-zoom{margin-top:150px!important}</style></head><body><div id="map"></div><div class="top"><div class="row"><input id="q" class="q" placeholder="Antik ad, güncel ad, il, dönem ara"><button class="b" onclick="locate()">📍 Konum</button><button class="b" onclick="tools()">☰</button></div><div class="chips"><button class="c" onclick="filter('')">Tümü</button><button class="c" onclick="filter('Roma')">Roma</button><button class="c" onclick="filter('Bizans')">Bizans</button><button class="c" onclick="filter('Helenistik')">Helenistik</button><button class="c" onclick="filter('Hitit')">Hitit</button><button class="c" onclick="filter('Urartu')">Urartu</button><button class="c" onclick="filter('Selçuklu')">Selçuklu</button><button class="c" onclick="filter('Osmanlı')">Osmanlı</button></div></div><div id="sheet" class="sheet"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const sites=[['Ephesos','Efes','Selçuk, İzmir','Helenistik Roma Bizans',37.939,27.341,'Antik kent / liman'],['Pergamon','Bergama','Bergama, İzmir','Helenistik Roma Bizans',39.1325,27.1841,'Antik kent'],['Sardis','Sart / Sardes','Salihli, Manisa','Lidya Helenistik Roma Bizans',38.4887,28.0402,'Antik kent'],['Troia','Troya','Çanakkale','Tunç Çağı Helenistik Roma',39.9575,26.2389,'Antik kent'],['Hierapolis','Hierapolis','Pamukkale, Denizli','Helenistik Roma Bizans',37.925,29.125,'Antik kent'],['Aphrodisias','Afrodisias','Karacasu, Aydın','Helenistik Roma Bizans',37.7088,28.7234,'Antik kent'],['Miletos','Milet','Didim, Aydın','Helenistik Roma Bizans',37.5308,27.2784,'Antik kent'],['Priene','Priene','Söke, Aydın','Helenistik Roma Bizans',37.659,27.297,'Antik kent'],['Hattusa','Hattuşa','Boğazkale, Çorum','Hitit',40.019,34.615,'Başkent / yerleşim'],['Gordion','Gordion','Polatlı, Ankara','Frig Helenistik Roma',39.654,31.994,'Antik yerleşim'],['Ancyra','Ankara','Ankara','Roma Bizans Selçuklu Osmanlı',39.938,32.864,'Tarihî kent'],['Byzantion / Constantinopolis','İstanbul','İstanbul','Roma Bizans Osmanlı',41.008,28.978,'Tarihî kent'],['Nikaia','İznik','Bursa','Roma Bizans Osmanlı',40.429,29.721,'Tarihî kent'],['Ani','Ani','Kars','Ortaçağ Selçuklu',40.507,43.573,'Ortaçağ kenti'],['Tushpa','Tuşpa / Van Kalesi','Van','Urartu',38.501,43.34,'Kale / başkent'],['Zeugma','Zeugma','Nizip, Gaziantep','Helenistik Roma',37.058,37.865,'Antik kent'],['Amida','Diyarbakır','Diyarbakır','Roma Bizans Selçuklu Osmanlı',37.914,40.23,'Tarihî kent'],['Perge','Perge','Aksu, Antalya','Helenistik Roma Bizans',36.961,30.853,'Antik kent'],['Aspendos','Aspendos','Serik, Antalya','Roma Bizans',36.939,31.172,'Antik kent'],['Side','Side','Manavgat, Antalya','Helenistik Roma Bizans',36.767,31.39,'Antik kent'],['Patara','Patara','Kaş, Antalya','Likya Roma Bizans',36.263,29.314,'Antik kent / liman'],['Xanthos','Ksantos','Kaş, Antalya','Likya Helenistik Roma Bizans',36.356,29.319,'Antik kent'],['Termessos','Termessos','Antalya','Helenistik Roma',36.983,30.465,'Dağ kenti'],['Sagalassos','Sagalassos','Ağlasun, Burdur','Helenistik Roma Bizans',37.678,30.519,'Antik kent'],['Çatalhöyük','Çatalhöyük','Çumra, Konya','Neolitik',37.667,32.828,'Höyük'],['Göbekli Tepe','Göbekli Tepe','Şanlıurfa','Neolitik',37.223,38.922,'Tarihöncesi yerleşim'],['Arslantepe','Arslantepe','Battalgazi, Malatya','Kalkolitik Tunç Hitit',38.381,38.361,'Höyük'],['Nemrut','Nemrut Dağı','Kahta, Adıyaman','Kommagene Helenistik',37.981,38.741,'Kutsal alan']];const potential=[['Troas araştırma bölgesi',39.82,26.35,42000],['Bakırçay–Gediz',38.85,27.35,65000],['Büyük Menderes',37.78,28.10,72000],['Kapadokya',38.68,34.90,78000],['Orta Kızılırmak',39.70,34.60,90000],['Yukarı Fırat',38.65,38.25,100000],['Yukarı Dicle',38.05,40.35,90000],['Şanlıurfa platosu',37.20,38.90,90000],['Van Gölü',38.55,43.25,95000]];const map=L.map('map').setView([39,35],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map),pot=L.layerGroup();let active='';function draw(){layer.clearLayers();let q=(document.getElementById('q').value||'').toLowerCase();for(const s of sites){let txt=s.join(' ').toLowerCase();if((active&&!s[3].includes(active))||(q&&!txt.includes(q)))continue;L.circleMarker([s[4],s[5]],{radius:6}).bindPopup(`<div class=card><b>${s[0]}</b><br>${s[1]}<br><span class=muted>${s[2]}</span><hr>${s[3]}<br>${s[6]}<br><button class=b onclick="nav(${s[4]},${s[5]},'${s[1]}')">Yol tarifi</button></div>`).addTo(layer)}}function filter(x){active=x;draw()}document.getElementById('q').oninput=draw;draw();function locate(){try{AndroidApp.requestLocation()}catch(e){navigator.geolocation.getCurrentPosition(x=>window.onNativeLocation(x.coords.latitude,x.coords.longitude,x.coords.accuracy))}}window.onNativeLocation=(a,b,c)=>{L.marker([a,b]).addTo(map).bindPopup('Konumunuz • ~'+Math.round(c)+' m').openPopup();map.setView([a,b],13)};function nav(a,b,n){try{AndroidApp.openGeo(a,b,n)}catch(e){}}function tools(){let s=document.getElementById('sheet');s.innerHTML='<h2>Araçlar</h2><button class=b onclick="togglePot()">Potansiyel araştırma bölgeleri</button> <button class=b onclick="scan()">Bu alanı kamu kayıtlarında tara</button> <button class=b onclick="report()">Gözlem kaydı</button> <p class=muted>Potansiyel bölgeler yaklaşık araştırma alanlarıdır; gizli/yayımlanmamış hassas kazı veya define hedefi içermez.</p><button class=b onclick="closeS()">Kapat</button>';s.classList.add('open')}function closeS(){document.getElementById('sheet').classList.remove('open')}function togglePot(){if(map.hasLayer(pot)){map.removeLayer(pot)}else{pot.clearLayers();potential.forEach(x=>L.circle([x[1],x[2]],{radius:x[3],dashArray:'6 5',fillOpacity:.05}).bindPopup('<b>'+x[0]+'</b><br>Yaklaşık araştırma bölgesi').addTo(pot));pot.addTo(map)}closeS()}async function scan(){closeS();let b=map.getBounds(),q='[out:json][timeout:25];(node[historic=archaeological_site]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+');way[historic=archaeological_site]('+b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()+'););out center tags;';try{let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q}),j=await r.json();j.elements.forEach(e=>{let a=e.lat||e.center?.lat,b=e.lon||e.center?.lon;if(a&&b)L.circleMarker([a,b],{radius:4}).bindPopup('<b>'+(e.tags?.name||'Kamuya açık arkeolojik kayıt')+'</b><br>OpenStreetMap').addTo(layer)});alert(j.elements.length+' kayıt yüklendi')}catch(e){alert('Tarama şu an yapılamadı.')}}function report(){closeS();let note=prompt('Yüzeyde gördüğünüz izi kısaca yazın. Kazı yapmayın veya buluntuyu yerinden oynatmayın.');if(note)try{AndroidApp.requestLocation();localStorage.setItem('lastObservation',JSON.stringify({time:new Date().toISOString(),note}))}catch(e){}}window.onNativeSaved=p=>alert('Kaydedildi: '+p);window.onNativeError=e=>alert(e);</script></body></html>
