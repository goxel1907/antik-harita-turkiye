const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([39,35],6);
const base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const curatedLayer=L.layerGroup().addTo(map),roadLayer=L.layerGroup().addTo(map),publicLayer=L.layerGroup().addTo(map),wikiLayer=L.layerGroup().addTo(map),modelLayer=L.layerGroup();
let period='Tümü',evidence='Tümü',publicOn=true,wikiOn=true,modelOn=false,loadTimer=null,lastAreaKey='',publicCount=0,wikiCount=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSheet(html){const s=document.getElementById('sheet');s.innerHTML=html;s.classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function markerIcon(color,symbol,small=false){const z=small?28:36;return L.divIcon({className:'',html:`<div style="width:${z}px;height:${z}px;border-radius:50%;background:${color};border:3px solid #f4e4bd;box-shadow:0 2px 8px #0008;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:${small?14:18}px">${symbol}</div>`,iconSize:[z,z],iconAnchor:[z/2,z/2]})}
function visibleCurated(){return curated.filter(x=>(period==='Tümü'||x.p.includes(period))&&(evidence==='Tümü'||evidence===x.e))}
function drawCurated(){curatedLayer.clearLayers();roadLayer.clearLayers();const rows=visibleCurated();document.getElementById('count').textContent=rows.length;rows.forEach(x=>{const c=period==='Tümü'?'#9c6d2f':PERIODS[period].color;const sym=period==='Tümü'?'●':PERIODS[period].symbol;const m=L.marker([x.lat,x.lon],{icon:markerIcon(c,sym,map.getZoom()>=10)}).addTo(curatedLayer);if(map.getZoom()>=9)m.bindTooltip(esc(x.a),{permanent:map.getZoom()>=12,direction:'top',className:'hist-label'});m.on('click',()=>showSheet(`<h2>${esc(x.a)}</h2><div class="detailGrid"><div class="k">Güncel ad</div><div class="v">${esc(x.n)}</div><div class="k">Mevki</div><div class="v">${esc(x.m)}</div><div class="k">Dönem</div><div class="v">${esc(x.p.join(', '))}</div><div class="k">Tür</div><div class="v">${esc(x.t)}</div><div class="k">Kanıt</div><div class="v">${esc(x.e)}</div><div class="k">Kaynak</div><div class="v">${esc(x.src)}</div><div class="k">Konum</div><div class="v">${esc(x.acc)}</div></div><div class="warn">Bu kayıt kaynak tipine göre temsil noktasıdır; nokta hassasiyeti saha ölçümü anlamına gelmez.</div><button class="b" onclick="closeSheet()">Kapat</button>`)});});if(period!=='Tümü'&&roads[period])roads[period].forEach(r=>L.polyline(r[1],{color:PERIODS[period].color,weight:5,opacity:.75}).bindTooltip(esc(r[0]),{className:'hist-label'}).addTo(roadLayer));document.getElementById('periodLabel').textContent=PERIODS[period].title;document.getElementById('periodTitle').textContent=PERIODS[period].title;drawLegend()}
function drawLegend(){document.getElementById('legend').innerHTML=`<div><span style="color:#d7b15b">●</span> Kaynaklı tarihî kayıt</div><div><span style="color:#2e8eb8">●</span> OSM kamu arkeoloji kaydı</div><div><span style="color:#8a5bc2">◆</span> Wikidata / bilgi grafiği</div><div><span style="color:#ba7373">◌</span> Bölgesel model (kesin hedef değil)</div><div class="tiny">Yakınlaştır: çevredeki ayrıntılar otomatik yüklenir.</div>`}
function drawModels(){modelLayer.clearLayers();if(!modelOn)return;modelRegions.forEach(x=>{const c=L.circle([x.lat,x.lon],{radius:x.r,color:'#a55b5b',weight:2,dashArray:'7 7',fillOpacity:.08}).addTo(modelLayer);c.on('click',()=>showSheet(`<h2>${esc(x.name)}</h2><p>${esc(x.note)}</p><div class="warn">Model alanı kesin arkeolojik nokta değildir ve metre hassasiyetinde hedef üretmez.</div><button class="b" onclick="closeSheet()">Kapat</button>`))})}
function setLoading(v){document.getElementById('loading').style.display=v?'block':'none'}
function bboxKey(){const b=map.getBounds(),z=Math.floor(map.getZoom());return [z,b.getSouth().toFixed(2),b.getWest().toFixed(2),b.getNorth().toFixed(2),b.getEast().toFixed(2)].join(':')}
async function loadOverpass(){if(!publicOn||map.getZoom()<10)return;const key=bboxKey();if(key===lastAreaKey)return;lastAreaKey=key;const b=map.getBounds();const bb=`${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;const q=`[out:json][timeout:20];(nwr[historic=archaeological_site](${bb});nwr[historic=ruins](${bb});nwr[archaeological_site](${bb});nwr[tourism=archaeological_site](${bb}););out center tags 250;`;setLoading(true);try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();publicLayer.clearLayers();publicCount=0;(j.elements||[]).forEach(el=>{const lat=el.lat??el.center?.lat,lon=el.lon??el.center?.lon;if(lat==null||lon==null)return;const t=el.tags||{},name=t.name||t['name:tr']||t['name:en']||t['historic:name']||'Adsız arkeolojik kayıt';const type=t.historic||t.archaeological_site||t.tourism||'arkeolojik kayıt';const m=L.circleMarker([lat,lon],{radius:map.getZoom()>=13?6:4,color:'#176889',fillColor:'#2e9bc5',fillOpacity:.9,weight:2}).addTo(publicLayer);publicCount++;if(map.getZoom()>=12)m.bindTooltip(esc(name),{permanent:map.getZoom()>=14,direction:'top',className:'public-label'});m.on('click',()=>{const tags=Object.entries(t).filter(([k])=>['name','historic','archaeological_site','site_type','start_date','inscription','wikidata','wikipedia','heritage','description'].includes(k)).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('');showSheet(`<h2>${esc(name)}</h2><div class="ok">Kamuya açık OpenStreetMap arkeoloji/tarih kaydı</div><div class="detailGrid"><div class="k">Tür</div><div class="v">${esc(type)}</div><div class="k">Kaynak</div><div class="v">OpenStreetMap öğesi ${esc(el.type)} ${esc(el.id)}</div><div class="k">Konum doğruluğu</div><div class="v">OSM üzerinde yayımlanmış nokta/geometri merkezi</div></div><div>${tags}</div><button class="b" onclick="closeSheet()">Kapat</button>`)});});updateLocalCount()}catch(e){console.log(e);document.getElementById('zoomBadge').textContent='OSM çevre verisi yüklenemedi'}finally{setLoading(false)}}
async function loadWikidata(){if(!wikiOn||map.getZoom()<8)return;const c=map.getCenter();const radius=map.getZoom()>=12?25:map.getZoom()>=10?50:100;const query=`SELECT ?item ?itemLabel ?coord ?description WHERE { VALUES ?class { wd:Q839954 wd:Q15661340 } ?item wdt:P31/wdt:P279* ?class; wdt:P625 ?coord. SERVICE wikibase:around { ?item wdt:P625 ?coord. bd:serviceParam wikibase:center \"Point(${c.lng} ${c.lat})\"^^geo:wktLiteral; wikibase:radius \"${radius}\". } OPTIONAL{?item schema:description ?description FILTER(LANG(?description)=\"tr\")} SERVICE wikibase:label { bd:serviceParam wikibase:language \"tr,en\". } } LIMIT 120`;try{const u='https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query);const r=await fetch(u,{headers:{'Accept':'application/sparql-results+json'}});if(!r.ok)throw new Error('wd '+r.status);const j=await r.json();wikiLayer.clearLayers();wikiCount=0;(j.results?.bindings||[]).forEach(x=>{const w=x.coord?.value||'';const m=w.match(/Point\(([-0-9.]+) ([-0-9.]+)\)/);if(!m)return;const lon=+m[1],lat=+m[2],name=x.itemLabel?.value||'Wikidata arkeolojik yer';const mk=L.circleMarker([lat,lon],{radius:5,color:'#5c3885',fillColor:'#8a5bc2',fillOpacity:.8,weight:2}).addTo(wikiLayer);wikiCount++;if(map.getZoom()>=11)mk.bindTooltip(esc(name),{permanent:map.getZoom()>=14,direction:'bottom',className:'public-label'});mk.on('click',()=>showSheet(`<h2>${esc(name)}</h2><div class="ok">Wikidata bilgi grafiği kaydı</div><p>${esc(x.description?.value||'Açıklama yok')}</p><div class="detailGrid"><div class="k">Kaynak</div><div class="v">${esc(x.item?.value||'Wikidata')}</div><div class="k">Konum</div><div class="v">Wikidata temsil koordinatı</div></div><button class="b" onclick="closeSheet()">Kapat</button>`))});updateLocalCount()}catch(e){console.log(e)}}
function updateLocalCount(){document.getElementById('countbox').textContent=`Yerel çevre: ${publicCount+wikiCount} kamu kaydı`;document.getElementById('zoomBadge').textContent=map.getZoom()<10?'Yakınlaşınca çevre kayıtları yüklenir':`${publicCount} OSM + ${wikiCount} bilgi grafiği`}
function scheduleLoads(){clearTimeout(loadTimer);loadTimer=setTimeout(()=>{drawCurated();loadOverpass();loadWikidata();updateLocalCount()},650)}
async function searchPlace(){const text=document.getElementById('q').value.trim();if(!text)return;const local=curated.filter(x=>[x.a,x.n,x.m,x.t].join(' ').toLocaleLowerCase('tr').includes(text.toLocaleLowerCase('tr')));let remote=[];try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tr&limit=8&addressdetails=1&q='+encodeURIComponent(text);const r=await fetch(u,{headers:{'Accept-Language':'tr'}});if(r.ok)remote=await r.json()}catch(e){}let html='<h2>Arama</h2>';if(!local.length&&!remote.length)html+='<p>Sonuç bulunamadı.</p>';local.forEach((x,i)=>html+=`<div class="result" onclick="goCur(${curated.indexOf(x)})"><b>${esc(x.a)} — ${esc(x.n)}</b><div class="muted">${esc(x.m)} • tarihî kayıt • ${esc(x.e)}</div></div>`);remote.forEach((x,i)=>{const a=x.address||{},kind=a.village?'köy':a.town?'ilçe/kasaba':a.city?'şehir':a.suburb||a.neighbourhood?'mahalle':'yer';html+=`<div class="result" onclick="goRemote(${+x.lat},${+x.lon},'${esc((x.display_name||'').replace(/'/g,''))}')"><b>${esc(x.name||x.display_name.split(',')[0])}</b><div class="muted">${esc(kind)} • ${esc(x.display_name)}</div></div>`});html+='<button class="b" onclick="closeSheet()">Kapat</button>';showSheet(html)}
function goCur(i){const x=curated[i];closeSheet();map.setView([x.lat,x.lon],13)}
function goRemote(lat,lon,name){closeSheet();map.setView([lat,lon],13);L.popup().setLatLng([lat,lon]).setContent('<b>'+name+'</b><br>Güncel OSM yer sonucu').openOn(map);scheduleLoads()}
function buildControls(){const p=document.getElementById('periods');p.innerHTML='';Object.keys(PERIODS).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===period?' active':'');b.textContent=k;b.onclick=()=>{period=k;buildControls();drawCurated()};p.appendChild(b)});const e=document.getElementById('evidence');e.innerHTML='';EVIDENCE.forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===evidence?' active':'');b.textContent=k;b.onclick=()=>{evidence=k;buildControls();drawCurated()};e.appendChild(b)})}
function openLayers(){showSheet(`<h2>Katmanlar ve ayrıntı</h2><div class="layerRow on"><div class="layerText"><b>Güncel Türkiye tabanı</b><span class="muted">İl, ilçe, köy ve yol referansı</span></div><button class="b" onclick="toggleBase()">Aç/Kapat</button></div><div class="layerRow ${publicOn?'on':''}"><div class="layerText"><b>Kamu arkeoloji kayıtları</b><span class="muted">Yakınlaştırınca OSM'den canlı yüklenir</span></div><button class="b" onclick="togglePublic()">${publicOn?'Açık':'Kapalı'}</button></div><div class="layerRow ${wikiOn?'on':''}"><div class="layerText"><b>Wikidata antik/arkeolojik</b><span class="muted">Yakın çevrede bilgi grafiği kayıtları</span></div><button class="b" onclick="toggleWiki()">${wikiOn?'Açık':'Kapalı'}</button></div><div class="layerRow ${modelOn?'on':''}"><div class="layerText"><b>Bölgesel model</b><span class="muted">Kesin hedef olmayan geniş koruma bölgeleri</span></div><button class="b" onclick="toggleModel()">${modelOn?'Açık':'Kapalı'}</button></div><div class="card"><b>Yakınlaştırma mantığı</b><div class="muted">Zoom 6–8: kaynaklı ana merkezler • 9–11: bölgesel arkeoloji kayıtları • 12+: isim etiketleri • 14+: yoğun yerel ayrıntı.</div></div><button class="b" onclick="map.fitBounds([[35.8,25.5],[42.3,44.8]]);closeSheet()">Türkiye görünümü</button> <button class="b" onclick="closeSheet()">Kapat</button>`)}
function toggleBase(){map.hasLayer(base)?map.removeLayer(base):base.addTo(map);openLayers()}
function togglePublic(){publicOn=!publicOn;if(!publicOn)publicLayer.clearLayers();else loadOverpass();openLayers()}
function toggleWiki(){wikiOn=!wikiOn;if(!wikiOn)wikiLayer.clearLayers();else loadWikidata();openLayers()}
function toggleModel(){modelOn=!modelOn;if(modelOn)modelLayer.addTo(map);else map.removeLayer(modelLayer);drawModels();openLayers()}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPlace()}});document.getElementById('toolsBtn').onclick=openLayers;document.getElementById('locBtn').onclick=()=>map.locate({setView:true,maxZoom:14,enableHighAccuracy:true});map.on('moveend zoomend',scheduleLoads);map.on('locationfound',e=>L.circleMarker(e.latlng,{radius:7,color:'#1678d2',fillColor:'#2d9bf0',fillOpacity:1}).addTo(map).bindPopup('Konumunuz').openPopup());
buildControls();drawCurated();drawLegend();map.fitBounds([[35.8,25.5],[42.3,44.8]]);setTimeout(scheduleLoads,1000);
</script>
</body>
