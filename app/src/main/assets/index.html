<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Harita Türkiye</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#dce8ec}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bcd8e5}.tiles,.overlay{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.overlay{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid #f5e4b3;box-shadow:0 3px 10px #0008;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;pointer-events:auto}.marker.public{width:18px;height:18px;border-width:2px;background:#1680a8}.marker.potential{width:34px;height:34px;border:2px dashed #8d603c;background:#b47a3c55;color:#4c311c}.label{position:absolute;transform:translate(8px,-50%);background:#17222de8;color:#fff;border:1px solid #4c6579;border-radius:7px;padding:2px 6px;font-size:11px;white-space:nowrap;pointer-events:none}.top{position:fixed;z-index:50;top:8px;left:8px;right:8px;background:#101820f5;color:#fff;padding:10px;border-radius:18px;box-shadow:0 8px 28px #0008}.row{display:flex;gap:7px}.q{flex:1;min-width:80px;padding:11px;border-radius:11px;border:1px solid #566472;background:#0c1218;color:#fff;font-size:16px}.b{border:0;border-radius:11px;padding:10px 12px;background:#efc768;color:#1b1408;font-weight:850}.chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px}.chip{border:1px solid #596775;border-radius:22px;background:#26313c;color:#fff;padding:8px 13px;white-space:nowrap;font-size:14px}.chip.active{background:#f1c766;color:#1d1407;border-color:#f7da99;font-weight:900}.status{display:flex;gap:7px;overflow:auto;margin-top:8px}.badge{white-space:nowrap;background:#202a34;color:#c9d2da;border-radius:10px;padding:4px 8px;font-size:12px}.zoom{position:fixed;z-index:40;left:12px;top:300px;display:flex;flex-direction:column}.zoom button{width:48px;height:48px;border:1px solid #8696a0;background:#fff;font-size:30px;font-weight:900}.zoom button:first-child{border-radius:8px 8px 0 0}.zoom button:last-child{border-radius:0 0 8px 8px}.sheet{position:fixed;z-index:80;left:0;right:0;bottom:0;display:none;max-height:78vh;overflow:auto;background:#101821;color:#fff;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -12px 35px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px}.card,.result{padding:12px;border:1px solid #344656;border-radius:13px;margin:9px 0;background:#17222c}.muted{color:#9eabb7;font-size:12px;margin-top:4px}.tag{display:inline-block;padding:3px 7px;border-radius:9px;background:#2a3440;font-size:11px;margin:3px 4px 0 0}.ok{background:#18372c;color:#bff4d4;border:1px solid #3d7a61;padding:8px;border-radius:10px;font-size:12px}.warn{background:#4b3521;color:#ffe0a2;border:1px solid #8f693a;padding:9px;border-radius:11px;font-size:12px;margin-top:10px}.legend{position:fixed;z-index:35;left:10px;bottom:12px;background:#121921e9;color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.7}.counter{position:fixed;z-index:35;right:10px;bottom:12px;background:#101820df;color:#fff;padding:7px 9px;border-radius:10px;font-size:11px}.loading{position:fixed;z-index:60;left:50%;top:235px;transform:translateX(-50%);background:#101820e8;color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;display:none}
</style>
</head>
<body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><div id="overlay" class="overlay"></div></div>
<div class="top"><div class="row"><input id="q" class="q" placeholder="İl, ilçe, mahalle, köy veya antik ad"><button id="loc" class="b">📍</button><button id="menu" class="b">☰</button></div><div id="periods" class="chips"></div><div id="evidence" class="chips"></div><div class="status"><span class="badge"><span id="count">0</span> tarihî kayıt</span><span class="badge" id="periodLabel">Tüm dönemler</span><span class="badge" id="zoomLabel">Yakınlaşınca çevre kayıtları yüklenir</span></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<div id="sheet" class="sheet"></div><div id="loading" class="loading">Çevre kayıtları yükleniyor…</div>
<div class="legend">● Belgelenmiş/literatür<br>● Kamu arkeoloji kaydı<br>◌ Potansiyel koruma bağlamı</div><div id="counter" class="counter">Zoom 6</div>
<script>
const PERIODS={Tümü:'#d5b15a',Helenistik:'#b5792a',Roma:'#a64038',Bizans:'#704fb4',Selçuklu:'#2f8063',Osmanlı:'#2d6e99',Hitit:'#8f5b35',Frig:'#7a6539',Urartu:'#4b7080',Neolitik:'#6a8b45'};
const EVIDENCE=['Tümü','Belgelenmiş','Literatür','Kamu','Model'];
const curated=[
['Ephesos','Efes','Selçuk / İzmir',37.939,27.341,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Pergamon','Bergama','İzmir',39.1325,27.1841,['Helenistik','Roma','Bizans'],'Akropol / kent','Literatür'],['Sardis','Sart','Manisa',38.4887,28.0402,['Helenistik','Roma','Bizans'],'Antik kent','Literatür'],['Troia','Troya','Çanakkale',39.9575,26.2389,['Helenistik','Roma'],'Yerleşim','Belgelenmiş'],['Hierapolis','Hierapolis','Denizli',37.925,29.125,['Helenistik','Roma','Bizans'],'Kent / nekropol','Belgelenmiş'],['Aphrodisias','Afrodisias','Aydın',37.7088,28.7234,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Miletos','Milet','Aydın',37.5308,27.2784,['Helenistik','Roma','Bizans'],'Liman kenti','Literatür'],['Ancyra','Ankara','Ankara',39.938,32.864,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Nikaia','İznik','Bursa',40.429,29.721,['Roma','Bizans','Osmanlı'],'Surlu kent','Literatür'],['Constantinopolis','İstanbul','İstanbul',41.008,28.978,['Roma','Bizans','Osmanlı'],'Başkent','Literatür'],['Perge','Perge','Antalya',36.961,30.853,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Aspendos','Aspendos','Antalya',36.939,31.172,['Roma','Bizans'],'Antik kent','Belgelenmiş'],['Side','Side','Antalya',36.767,31.39,['Helenistik','Roma','Bizans'],'Liman kenti','Belgelenmiş'],['Sagalassos','Sagalassos','Burdur',37.678,30.519,['Helenistik','Roma','Bizans'],'Dağ kenti','Belgelenmiş'],['Laodikeia','Laodikeia','Denizli',37.836,29.108,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Aizanoi','Aizanoi','Kütahya',39.201,29.611,['Roma','Bizans'],'Antik kent','Belgelenmiş'],['Zeugma','Zeugma','Gaziantep',37.058,37.865,['Helenistik','Roma'],'Antik kent','Belgelenmiş'],['Amida','Diyarbakır','Diyarbakır',37.914,40.23,['Roma','Bizans','Selçuklu','Osmanlı'],'Surlu kent','Literatür'],['Dara','Dara','Mardin',37.179,40.955,['Roma','Bizans'],'Sınır kenti','Belgelenmiş'],['Hasankeyf','Hasankeyf','Batman',37.714,41.414,['Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Belgelenmiş'],['Ahlat','Ahlat','Bitlis',38.75,42.48,['Selçuklu','Osmanlı'],'Tarihî kent','Belgelenmiş'],['Ikonion','Konya','Konya',37.87,32.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Caesarea','Kayseri','Kayseri',38.72,35.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Sebasteia','Sivas','Sivas',39.75,37.02,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Antiochia','Antakya','Hatay',36.202,36.161,['Helenistik','Roma','Bizans'],'Metropol kent','Literatür'],['Hattusa','Boğazkale','Çorum',40.019,34.615,['Hitit'],'Başkent','Belgelenmiş'],['Gordion','Yassıhöyük','Ankara',39.654,31.994,['Frig'],'Başkent / höyük','Belgelenmiş'],['Tuşpa','Van Kalesi','Van',38.501,43.341,['Urartu'],'Başkent / kale','Belgelenmiş'],['Çatalhöyük','Çatalhöyük','Konya',37.667,32.826,['Neolitik'],'Yerleşim','Belgelenmiş']
];
let lat=39.0,lon=35.2,zoom=6,selPeriod='Tümü',selEvidence='Tümü',publicItems=[],potentialCells=[];const tileSize=256;
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet'),loading=document.getElementById('loading');
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function worldSize(z){return tileSize*Math.pow(2,z)}function project(la,lo,z){const s=worldSize(z),x=(lo+180)/360*s;const sin=Math.sin(la*Math.PI/180);const y=(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s;return[x,y]}function unproject(x,y,z){const s=worldSize(z),lo=x/s*360-180,n=Math.PI-2*Math.PI*y/s,la=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[la,lo]}
function centerWorld(){return project(lat,lon,zoom)}function screenFor(la,lo){const c=centerWorld(),p=project(la,lo,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=centerWorld(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/256)-1,maxX=Math.floor((left+innerWidth)/256)+1,minY=Math.floor(top/256)-1,maxY=Math.floor((top+innerHeight)/256)+1,n=Math.pow(2,zoom);for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*256-left)+'px';img.style.top=(y*256-top)+'px';img.onerror=()=>{img.style.background='#dce8ec'};tiles.appendChild(img)}}
function colorFor(p){return PERIODS[p]||'#777'}function marker(el,la,lo,color,text,cls=''){const [x,y]=screenFor(la,lo);if(x<-60||x>innerWidth+60||y<-60||y>innerHeight+60)return;const d=document.createElement('div');d.className='marker '+cls;d.style.left=x+'px';d.style.top=y+'px';d.style.background=color;d.textContent=text||'';d.onclick=el;overlay.appendChild(d);return d}function label(la,lo,txt){const[x,y]=screenFor(la,lo);if(x<0||x>innerWidth||y<0||y>innerHeight)return;const d=document.createElement('div');d.className='label';d.style.left=x+'px';d.style.top=y+'px';d.textContent=txt;overlay.appendChild(d)}
function showSheet(html){sheet.innerHTML=html;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}window.closeSheet=closeSheet;
function detailCur(r){showSheet(`<h2>${r[0]}</h2><div class="ok">${r[6]} • ${r[7]}</div><div class="card"><b>Güncel ad:</b> ${r[1]}<br><b>Mevki:</b> ${r[2]}<br><b>Dönem:</b> ${r[5].join(', ')}<br><b>Konum:</b> temsil noktası / kaynak doğrulaması gerekir</div><div class="warn">Bu kayıt tarihî araştırma/koruma görünümüdür; kesin saha hedefi anlamına gelmez.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function renderOverlay(){overlay.innerHTML='';let n=0;for(const r of curated){if(selPeriod!=='Tümü'&&!r[5].includes(selPeriod))continue;if(selEvidence!=='Tümü'&&r[7]!==selEvidence)continue;n++;const p=selPeriod==='Tümü'?r[5][0]:selPeriod;marker(()=>detailCur(r),r[3],r[4],colorFor(p),'●');if(zoom>=9)label(r[3],r[4],r[0])}for(const it of publicItems){if(selEvidence!=='Tümü'&&selEvidence!=='Kamu')continue;marker(()=>detailPublic(it),it.lat,it.lon,'#1680a8','', 'public');if(zoom>=13&&it.name)label(it.lat,it.lon,it.name)}for(const c of potentialCells){if(selEvidence!=='Tümü'&&selEvidence!=='Model')continue;marker(()=>detailPotential(c),c.lat,c.lon,'#b47a3c55','◌','potential')}document.getElementById('count').textContent=n;document.getElementById('periodLabel').textContent=selPeriod==='Tümü'?'Tüm dönemler':selPeriod;document.getElementById('counter').textContent=`Zoom ${zoom} • kamu ${publicItems.length} • model ${potentialCells.length}`}
function render(){renderTiles();renderOverlay();document.getElementById('zoomLabel').textContent=zoom<11?'Zoom 11+ çevre kayıtları':'Kamu + potansiyel bağlam';if(zoom>=11)scheduleNearby()}
function setCenter(la,lo,z){lat=clamp(la,-85,85);lon=lo;zoom=clamp(Math.round(z),3,17);render()}
document.getElementById('zin').onclick=()=>setCenter(lat,lon,zoom+1);document.getElementById('zout').onclick=()=>setCenter(lat,lon,zoom-1);
let drag=null;map.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,c:centerWorld()};map.setPointerCapture(e.pointerId)});map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,[la,lo]=unproject(drag.c[0]-dx,drag.c[1]-dy,zoom);lat=la;lon=lo;renderTiles();renderOverlay()});map.addEventListener('pointerup',e=>{drag=null;scheduleNearby()});
map.addEventListener('wheel',e=>{e.preventDefault();setCenter(lat,lon,zoom+(e.deltaY<0?1:-1))},{passive:false});
function buildChips(){const p=document.getElementById('periods');p.innerHTML='';Object.keys(PERIODS).forEach(x=>{const b=document.createElement('button');b.className='chip'+(x===selPeriod?' active':'');b.textContent=x;b.onclick=()=>{selPeriod=x;buildChips();renderOverlay()};p.appendChild(b)});const ev=document.getElementById('evidence');ev.innerHTML='';EVIDENCE.forEach(x=>{const b=document.createElement('button');b.className='chip'+(x===selEvidence?' active':'');b.textContent=x;b.onclick=()=>{selEvidence=x;buildChips();renderOverlay()};ev.appendChild(b)})}
async function searchPlace(q){q=q.trim();if(!q)return;const local=curated.filter(r=>(r[0]+' '+r[1]+' '+r[2]).toLowerCase().includes(q.toLowerCase()));loading.style.display='block';let remote=[];try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=tr&q='+encodeURIComponent(q);const res=await fetch(u,{headers:{'Accept-Language':'tr'}});if(res.ok)remote=await res.json()}catch(e){}loading.style.display='none';let html='<h2>Arama</h2>';local.forEach((r,i)=>html+=`<div class="result" onclick="jumpLocal(${curated.indexOf(r)})"><b>${r[0]}</b><div class="muted">${r[1]} • ${r[2]}</div></div>`);remote.forEach((r,i)=>html+=`<div class="result" onclick="jumpRemote(${i})"><b>${(r.name||r.display_name.split(',')[0]).replace(/</g,'&lt;')}</b><div class="muted">${r.display_name.replace(/</g,'&lt;')}</div></div>`);if(!local.length&&!remote.length)html+='<p>Sonuç bulunamadı.</p>';html+='<button class="b" onclick="closeSheet()">Kapat</button>';window._remote=remote;showSheet(html)}
window.jumpLocal=i=>{const r=curated[i];closeSheet();setCenter(r[3],r[4],12)};window.jumpRemote=i=>{const r=window._remote[i];closeSheet();setCenter(+r.lat,+r.lon,13)};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace(e.target.value)});
document.getElementById('loc').onclick=()=>{try{if(window.AndroidApp&&AndroidApp.requestLocation)AndroidApp.requestLocation()}catch(e){}};window.onNativeLocation=(la,lo,acc)=>setCenter(la,lo,14);
document.getElementById('menu').onclick=()=>showSheet(`<h2>Katmanlar</h2><div class="card">Harita motoru: <b>yerel saf JavaScript</b><br>Taban: OpenStreetMap kareleri<br>Zoom 11+: kamu arkeoloji/tarihî bağlam kayıtları<br>Potansiyel alanlar: birden fazla açık göstergenin bölgesel kesişimi</div><button class="b" onclick="setCenter(39,35.2,6);closeSheet()">Türkiye görünümü</button> <button class="b" onclick="closeSheet()">Kapat</button>`);
function classify(t){const h=(t.historic||'').toLowerCase();if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site')return['Arkeoloji/yerleşim',4];if(h==='caravanserai'||h==='inn')return['Han/konaklama',4];if(h==='bridge'||t.ford==='yes'||t.bridge==='yes')return['Geçiş/köprü',3];if(t.mountain_pass==='yes')return['Geçit',3];if(t.natural==='spring')return['Su kaynağı',2];if(h==='castle'||h==='fort'||h==='fortification')return['Savunma yapısı',4];if(t.natural==='cave_entrance')return['Yayımlanmış mağara',2];if(h==='road')return['Tarihî yol',4];return['Tarihî bağlam',1]}
let nearbyTimer=null,lastNearby='';function scheduleNearby(){clearTimeout(nearbyTimer);if(zoom<11){publicItems=[];potentialCells=[];renderOverlay();return}nearbyTimer=setTimeout(loadNearby,700)}
function bbox(){const c=centerWorld(),nw=unproject(c[0]-innerWidth/2,c[1]-innerHeight/2,zoom),se=unproject(c[0]+innerWidth/2,c[1]+innerHeight/2,zoom);return[nw[0],nw[1],se[0],se[1]]}
async function loadNearby(){const b=bbox(),key=b.map(x=>x.toFixed(3)).join(',')+':'+zoom;if(key===lastNearby)return;lastNearby=key;loading.style.display='block';const bb=`${b[2]},${b[1]},${b[0]},${b[3]}`;const q=`[out:json][timeout:18];(nwr[historic=archaeological_site](${bb});nwr[historic=ruins](${bb});nwr[tourism=archaeological_site](${bb});nwr[historic=caravanserai](${bb});nwr[historic=inn](${bb});nwr[historic=bridge](${bb});nwr[historic=castle](${bb});nwr[historic=fort](${bb});node[mountain_pass=yes](${bb});node[ford=yes](${bb});node[natural=spring](${bb});node[natural=cave_entrance](${bb}););out center tags 350;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw 0;const j=await r.json();publicItems=(j.elements||[]).map(el=>{const la=el.lat??el.center?.lat,lo=el.lon??el.center?.lon,t=el.tags||{},cl=classify(t);return la==null?null:{lat:la,lon:lo,name:t.name||t['name:tr']||t.old_name||cl[0],kind:cl[0],weight:cl[1],src:`OSM ${el.type} ${el.id}`,tags:t}}).filter(Boolean);buildPotential()}catch(e){publicItems=[];potentialCells=[]}loading.style.display='none';renderOverlay()}
function buildPotential(){const step=zoom>=14?.012:zoom>=13?.02:zoom>=12?.035:.055,cells=new Map();for(const x of publicItems){const k=Math.floor(x.lat/step)+':'+Math.floor(x.lon/step);if(!cells.has(k))cells.set(k,{lat:0,lon:0,n:0,score:0,kinds:new Set(),items:[]});const c=cells.get(k);c.lat+=x.lat;c.lon+=x.lon;c.n++;c.score+=x.weight;c.kinds.add(x.kind);c.items.push(x)}potentialCells=[];cells.forEach(c=>{if(c.n>=2||c.kinds.size>=2){c.lat/=c.n;c.lon/=c.n;c.score=Math.min(10,c.score+Math.max(0,c.kinds.size-1));potentialCells.push(c)}})}
function detailPublic(it){showSheet(`<h2>${it.name}</h2><div class="ok">${it.kind} • kamuya açık kayıt</div><div class="card"><b>Kaynak:</b> ${it.src}<br><b>Eski ad:</b> ${it.tags.old_name||'—'}<br><b>Dönem:</b> ${it.tags.start_date||it.tags.period||it.tags.historic||'Belirtilmemiş'}</div><div class="warn">Kamu haritası kaydıdır; akademik kaynakla ayrıca doğrulanmalıdır.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function detailPotential(c){const tags=[...c.kinds].map(k=>`<span class="tag">${k}</span>`).join('');showSheet(`<h2>Potansiyel tarihî kullanım / koruma bağlamı</h2><div class="ok">Bağlam skoru ${c.score}/10 • ${c.n} açık gösterge</div><div class="card">${tags}</div><div class="warn">Bu alan kesin arkeolojik veya saklama noktası değildir. Birden fazla kamuya açık peyzaj/tarihî göstergenin bölgesel kesişimidir.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
buildChips();render();
</script>
</body></html>
