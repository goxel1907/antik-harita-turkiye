#ffe0a2!important;border:1px solid #9c6b2e!important;border-radius:7px!important;padding:2px 5px!important;box-shadow:0 2px 8px #0005!important;font-weight:800!important;font-size:11px!important}.leaflet-tooltip.hist-label:before{display:none}.hist-icon{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff6;box-shadow:0 2px 9px #0009;color:white;font-size:17px;font-weight:900}.roadLabel{background:#2d2016e6!important;color:#f7d994!important;border:1px solid #8f6532!important;border-radius:7px!important;font-size:10px!important;font-weight:800!important;padding:2px 5px!important}.leaflet-tooltip.roadLabel:before{display:none}.leaflet-control-zoom{margin-top:184px!important}.detailGrid{display:grid;grid-template-columns:110px 1fr;gap:8px 10px}.k{color:#95a3b1}.v{font-weight:700}

zans','Selçuklu','Osmanlı'],'Tarihî kent'],['Sebasteia','Sivas','Sivas',39.75,37.02,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent'],['Antiochia','Antakya','Hatay',36.202,36.161,['Helenistik','Roma','Bizans'],'Metropol kent'],['Priene','Priene','Aydın',37.659,27.297,['Helenistik','Roma','Bizans'],'Antik kent'],['Magnesia','Magnesia','Aydın',37.852,27.527,['Helenistik','Roma','Bizans'],'Antik kent'],['Tralleis','Tralleis','Aydın',37.856,27.845,['Helenistik','Roma','Bizans'],'Antik kent'],['Assos','Assos','Çanakkale',39.492,26.337,['Helenistik','Roma','Bizans'],'Antik kent / liman'],['Alexandria Troas','Alexandria Troas','Çanakkale',39.753,26.158,['Helenistik','Roma','Bizans'],'Antik kent / liman'],['Stratonikeia','Stratonikeia','Muğla',37.313,28.064,['Helenistik','Roma','Bizans','Osmanlı'],'Yerleşim'],['Kaunos','Kaunos','Muğla',36.825,28.621,['Helenistik','Roma','Bizans'],'Antik kent / liman']];

Roma:[['Via Sebaste / Pisidia',[[36.96,30.85],[37.10,30.60],[37.42,30.53],[37.68,30.52],[38.02,31.01]]],['Menderes ekseni',[[37.53,27.28],[37.85,27.53],[37.86,27.85],[37.84,29.11]]],['Ancyra–Caesarea',[[39.94,32.86],[39.20,34.00],[38.72,35.49]]],['Troas hattı',[[39.49,26.34],[39.75,26.16],[39.96,26.24]]],['Yukarı Mezopotamya',[[37.18,40.96],[37.31,40.74],[37.91,40.23],[37.71,41.41]]]],

Selçuklu:[['Konya–Aksaray–Kayseri',[[37.87,32.49],[38.05,32.42],[38.09,32.64],[38.25,33.55],[38.38,33.99],[38.72,34.91],[38.72,35.49]]],['Antalya–Burdur–Konya',[[36.90,30.70],[37.09,30.58],[37.42,30.53],[37.49,30.59],[37.68,30.52],[37.87,32.49]]],['Kayseri–Sivas',[[38.72,35.49],[39.20,36.20],[39.75,37.02]]],['Ahlat–Hasankeyf–Amida',[[38.75,42.48],[37.714,41.414],[37.914,40.23]]]],
Osmanlı:[['İstanbul–İznik–Ankara',[[41.008,28.978],[40.429,29.721],[40.30,31.00],[39.938,32.864]]],['Ankara–Konya',[[39.938,32.864],[39.10,32.60],[37.87,32.49]]],['Konya–Kayseri–Sivas',[[37.87,32.49],[38.72,35.49],[39.75,37.02]]],['Diyarbakır–Hasankeyf',[[37.914,40.23],[37.714,41.414]]]],
Helenistik:[['Batı Anadolu iç hattı',[[39.13,27.18],[38.49,28.04],[37.84,29.11]]],['Miletos–Magnesia–Tralleis',[[37.53,27.28],[37.85,27.53],[37.86,27.85]]],['Pamphylia hattı',[[36.96,30.85],[36.94,31.17],[36.77,31.39]]],['Zeugma–Antiochia',[[37.06,37.87],[36.20,36.16]]]]};

const bridges=[['Justinianus Köprüsü','Sakarya',40.756,30.365,['Bizans']],['Taşköprü','Adana',36.987,35.334,['Roma','Bizans','Osmanlı']],['Malabadi Köprüsü','Diyarbakır',38.157,41.203,['Selçuklu']],['Irgandı Köprüsü','Bursa',40.182,29.073,['Osmanlı']]];
const model={Roma:[[[37.50,27.20],[37.90,28.10],[38.20,29.00]],[[39.60,31.80],[39.30,33.20],[38.90,34.70]]],Bizans:[[[40.35,29.60],[40.00,31.00],[39.80,32.60]],[[37.80,40.20],[37.90,41.00],[37.70,41.50]]],Selçuklu:[[[37.80,32.30],[38.10,33.20],[38.40,34.00]],[[37.00,30.50],[37.50,30.55],[37.90,32.00]]],Osmanlı:[[[40.80,29.10],[40.30,30.10],[39.90,32.80]],[[38.00,32.50],[38.70,35.00],[39.70,37.00]]],Helenistik:[[[38.90,27.10],[38.30,28.00],[37.80,29.00]],[[36.80,30.70],[37.10,31.10],[37.50,31.30]]]};
const map=L.map('map',{zoomControl:true,tap:true,attributionControl:false}).setView([39,35],6);
L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(map);
const gSites=L.layerGroup().addTo(map),gRoads=L.layerGroup().addTo(map),gStops=L.layerGroup().addTo(map),gBridges=L.layerGroup().addTo(map),gModel=L.layerGroup();
let current='Roma';const vis={sites:true,roads:true,stops:true,bridges:true,model:false};
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function iconFor(period,type){const p=PERIODS[period];let sym=p.symbol;if(type==='capital')sym='★';return L.divIcon({className:'',html:'<div class="hist-icon" style="width:30px;height:30px;background:'+p.color+'">'+sym+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}
function renderPeriodButtons(){const box=document.getElementById('periods');box.innerHTML='';Object.keys(PERIODS).forEach(id=>{const b=document.createElement('button');b.className='chip'+(id===current?' active':'');b.textContent=id;b.onclick=()=>{current=id;renderPeriodButtons();draw()};box.appendChild(b)})}
function showDetail(s){const sh=document.getElementById('sheet');sh.innerHTML='<h2>'+esc(s[0])+'</h2><div class="detailGrid"><div class="k">Güncel ad</div><div class="v">'+esc(s[1])+'</div><div class="k">Mevki</div><div class="v">'+esc(s[2])+'</div><div class="k">Dönem</div><div class="v">'+esc(current)+'</div><div class="k">Tür</div><div class="v">'+esc(s[6])+'</div></div><p class="muted">Gösterim kamuya açık tarihî/arkeolojik kayıtların rekonstrüksiyonudur.</p><button class="b" id="closeSh">Kapat</button>';sh.classList.add('open');document.getElementById('closeSh').onclick=()=>sh.classList.remove('open')}
function draw(){gSites.clearLayers();gRoads.clearLayers();gStops.clearLayers();gBridges.clearLayers();gModel.clearLayers();const p=PERIODS[current];const q=(document.getElementById('q').value||'').toLowerCase();let n=0;if(vis.sites){sites.filter(s=>s[5].includes(current)).forEach(s=>{if(q&&!s.join(' ').toLowerCase().includes(q))return;const isCapital=/başkent/i.test(s[6]);const m=L.marker([s[3],s[4]],{icon:iconFor(current,isCapital?'capital':'site')}).addTo(gSites);m.bindTooltip(s[0],{permanent:map.getZoom()>=6,direction:'top',offset:[0,-16],className:'hist-label'});m.on('click',()=>showDetail(s));n++})}if(vis.roads){(roads[current]||[]).forEach(r=>{const line=L.polyline(r[1],{color:p.road,weight:5,opacity:.88,lineCap:'round'}).addTo(gRoads);line.bindTooltip(r[0],{sticky:true,className:'roadLabel'})})}if(vis.stops){stops.filter(x=>x[4].includes(current)).forEach(x=>{L.circleMarker([x[2],x[3]],{radius:7,color:'#5b3510',weight:2,fillColor:'#e1a13b',fillOpacity:1}).bindTooltip(x[0],{permanent:true,direction:'right',className:'hist-label'}).addTo(gStops)})}if(vis.bridges){bridges.filter(x=>x[4].includes(current)).forEach(x=>{L.circleMarker([x[2],x[3]],{radius:7,color:'#153e5a',weight:2,fillColor:'#65add8',fillOpacity:1}).bindTooltip(x[0],{permanent:true,direction:'right',className:'hist-label'}).addTo(gBridges)})}if(vis.model){(model[current]||[]).forEach(x=>L.polyline(x,{color:'#8d62b5',weight:8,opacity:.35,dashArray:'12 10'}).addTo(gModel))}document.getElementById('count').textContent=n;document.getElementById('periodLabel').textContent=current;document.getElementById('periodTitle').textContent=p.title+' rekonstrüksiyonu';document.getElementById('legend').innerHTML='<div><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+p.color+';margin-right:6px"></span>'+current+' yerleşimi</div><div><span style="display:inline-block;width:22px;border-top:4px solid '+p.road+';margin-right:6px"></span>Dönem yolu</div><div>● Han / durak &nbsp; ● Köprü / geçit</div>'}
function openLayers(){const sh=document.getElementById('sheet');const rows=[['sites','Dönem yerleşimleri','Büyük sembol + kalıcı antik ad'],['roads','Dönem yolları','Yalnız seçili dönemin rekonstrüksiyonu'],['stops','Han / menzil / durak','Döneme göre kamuya açık kayıtlar'],['bridges','Köprü / geçit','Döneme göre tarihî geçişler'],['model','Model çıkarımı','Belgelenmiş kayıtlardan ayrı yaklaşık koridor']];sh.innerHTML='<h2>Katmanlar • '+current+'</h2>'+rows.map(r=>'<div class="layerRow '+(vis[r[0]]?'on':'')+'"><div class="layerText"><b>'+r[1]+'</b><span class="muted">'+r[2]+'</span></div><button class="b toggle" data-k="'+r[0]+'">'+(vis[r[0]]?'Açık':'Kapalı')+'</button></div>').join('')+'<button class="b" id="closeSh">Kapat</button>';sh.classList.add('open');sh.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const k=b.dataset.k;vis[k]=!vis[k];if(k==='model'){if(vis[k])map.addLayer(gModel);else map.removeLayer(gModel)}draw();openLayers()});document.getElementById('closeSh').onclick=()=>sh.classList.remove('open')}
document.getElementById('toolsBtn').onclick=openLayers;document.getElementById('q').oninput=draw;document.getElementById('locBtn').onclick=()=>{try{if(window.AndroidApp&&AndroidApp.requestLocation){AndroidApp.requestLocation();return}}catch(e){}navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>window.onNativeLocation(x.coords.latitude,x.coords.longitude,x.coords.accuracy))};window.onNativeLocation=(a,b,c)=>{L.circleMarker([a,b],{radius:8,color:'#111',fillColor:'#fff',fillOpacity:1}).addTo(map).bindPopup('Konumunuz • ~'+Math.round(c)+' m').openPopup();map.setView([a,b],11)};map.on('zoomend',draw);renderPeriodButtons();draw();
</script>
