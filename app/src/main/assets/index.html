const map=L.map('map',{zoomControl:true,tap:true,preferCanvas:true});

map.fitBounds(turkeyBounds,{paddingTopLeft:[16,215],paddingBottomRight:[16,90]});

const layers={sites:L.layerGroup().addTo(map),roads:L.layerGroup().addTo(map),stops:L.layerGroup().addTo(map),bridges:L.layerGroup().addTo(map),model:L.layerGroup()};
const enabled={base:true,sites:true,roads:true,stops:true,bridges:true,model:false};
let active='Roma';
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isCapital(s){return s[0]==='Constantinopolis'||s[0]==='Ancyra'||s[0]==='Ikonion'}
function iconFor(s){const p=PERIODS[active],cap=isCapital(s);return L.divIcon({className:'',html:'<div class="histIcon '+(cap?'capital':'')+'" style="background:'+p.color+'">'+p.symbol+'</div>',iconSize:[cap?34:28,cap?34:28],iconAnchor:[cap?17:14,cap?17:14]})}
function detailSite(s){const sh=document.getElementById('sheet');sh.innerHTML='<h2>'+esc(s[0])+'</h2><div class="detailGrid"><div class="k">Güncel ad</div><div class="v">'+esc(s[1])+'</div><div class="k">Mevki</div><div class="v">'+esc(s[2])+'</div><div class="k">Dönemler</div><div class="v">'+esc(s[5].join(', '))+'</div><div class="k">Tür</div><div class="v">'+esc(s[6])+'</div><div class="k">Koordinat</div><div class="v">'+s[3].toFixed(5)+', '+s[4].toFixed(5)+'</div></div><div class="sourceNote">Harita tabanı güncel coğrafi referanstır. Tarihî yollar rekonstrüksiyon/genel güzergâh olarak ayrıca çizilir.</div><div class="closeRow"><button id="closeSheet" class="b">Kapat</button><button id="zoomHere" class="b">Yakınlaştır</button></div>';sh.classList.add('open');document.getElementById('closeSheet').addEventListener('click',()=>sh.classList.remove('open'));document.getElementById('zoomHere').addEventListener('click',()=>{map.setView([s[3],s[4]],12);sh.classList.remove('open')})}
function draw(){Object.values(layers).forEach(l=>l.clearLayers());const p=PERIODS[active];let count=0;
 if(enabled.sites){sites.filter(s=>s[5].includes(active)).forEach(s=>{count++;const m=L.marker([s[3],s[4]],{icon:iconFor(s)}).addTo(layers.sites);m.bindTooltip(s[0],{permanent:false,direction:'top',offset:[0,-15],className:'histLabel'});m.bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br><small>'+esc(s[2])+' • '+esc(s[6])+'</small>');m.on('click',()=>detailSite(s))})}
 if(enabled.roads){(roads[active]||[]).forEach(r=>{const line=L.polyline(r[1],{color:p.road,weight:5,opacity:.88}).addTo(layers.roads);line.bindTooltip(r[0],{sticky:true,className:'roadLabel'})})}
 if(enabled.stops){stops.filter(x=>x[4].includes(active)).forEach(x=>{L.circleMarker([x[2],x[3]],{radius:8,color:'#fff3',weight:3,fillColor:'#d48d17',fillOpacity:.96}).addTo(layers.stops).bindTooltip('Han / durak: '+x[0],{sticky:true,className:'histLabel'}).bindPopup('<b>'+x[0]+'</b><br>'+x[1])})}
 if(enabled.bridges){bridges.filter(x=>x[4].includes(active)).forEach(x=>{L.circleMarker([x[2],x[3]],{radius:8,color:'#fff3',weight:3,fillColor:'#4e9bc6',fillOpacity:.96}).addTo(layers.bridges).bindTooltip('Köprü / geçit: '+x[0],{sticky:true,className:'histLabel'}).bindPopup('<b>'+x[0]+'</b><br>'+x[1])})}

 document.getElementById('count').textContent=count;document.getElementById('periodLabel').textContent=active;document.getElementById('periodTitle').textContent=p.title+' rekonstrüksiyonu';renderLegend();}
function renderLegend(){const p=PERIODS[active];document.getElementById('legend').innerHTML='<div class="legendRow"><span class="sw" style="background:'+p.color+'"></span>'+active+' yerleşimi</div><div class="legendRow"><span class="ln" style="border-color:'+p.road+'"></span>Tarihî yol</div><div class="legendRow"><span class="sw" style="background:#d48d17"></span>Han / durak</div><div class="legendRow"><span class="sw" style="background:#4e9bc6"></span>Köprü / geçit</div>'+(enabled.model?'<div class="legendRow"><span class="ln dash" style="border-color:#8d66b8"></span>Model koridoru</div>':'')}
function renderPeriods(){const box=document.getElementById('periods');box.innerHTML='';Object.keys(PERIODS).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===active?' active':'');b.textContent=k;b.type='button';b.addEventListener('click',()=>{active=k;renderPeriods();draw()});box.appendChild(b)})}
function showLayers(){const sh=document.getElementById('sheet');const rows=[['base','Güncel Türkiye tabanı','Bugünkü il, ilçe, yol ve coğrafi referans'],['sites','Dönem yerleşimleri','Seçilen döneme ait tarihî merkezler'],['roads','Tarihî yollar','Belgelendirilmiş / genel rekonstrüksiyon güzergâhları'],['stops','Han / menzil / durak','Tarihî konaklama ve menzil noktaları'],['bridges','Köprü / geçit','Tarihî geçiş düğümleri'],['model','Model koridorları','Belge değil; tarihsel kullanım çıkarımı']];sh.innerHTML='<h2>Katmanlar</h2>'+rows.map(r=>'<div class="layerRow '+(enabled[r[0]]?'on':'')+'"><div class="layerText"><b>'+r[1]+'</b><span class="muted">'+r[2]+'</span></div><button class="b toggle" data-layer="'+r[0]+'">'+(enabled[r[0]]?'Açık':'Kapalı')+'</button></div>').join('')+'<div class="closeRow"><button id="fitTurkey" class="b">Türkiye görünümü</button><button id="closeSheet" class="b">Kapat</button></div><div class="sourceNote">Güncel harita yalnızca coğrafi referans sağlar. Renkli çizgiler ve semboller seçilen tarihî dönemin ayrı katmanlarıdır.</div>';sh.classList.add('open');sh.querySelectorAll('[data-layer]').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.layer;enabled[k]=!enabled[k];if(k==='base'){if(enabled.base){osm.addTo(map)}else{map.removeLayer(osm)}document.getElementById('baseLabel').textContent=enabled.base?'Güncel Türkiye tabanı açık':'Güncel taban kapalı'}if(k==='model'){enabled.model?layers.model.addTo(map):map.removeLayer(layers.model)}draw();showLayers()}));document.getElementById('fitTurkey').addEventListener('click',()=>{map.fitBounds(turkeyBounds,{paddingTopLeft:[16,215],paddingBottomRight:[16,90]});sh.classList.remove('open')});document.getElementById('closeSheet').addEventListener('click',()=>sh.classList.remove('open'))}
function doSearch(){const q=document.getElementById('q').value.trim().toLocaleLowerCase('tr-TR');if(q.length<2)return;const rs=sites.filter(s=>(s[0]+' '+s[1]+' '+s[2]+' '+s[5].join(' ')+' '+s[6]).toLocaleLowerCase('tr-TR').includes(q)).slice(0,12);const sh=document.getElementById('sheet');sh.innerHTML='<h2>Arama</h2>'+(rs.length?rs.map((s,i)=>'<div class="searchResult"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+' • '+esc(s[2])+'</span><br><span class="muted">'+esc(s[5].join(', '))+' • '+esc(s[6])+'</span><br><button class="b smallBtn" data-i="'+i+'">Haritada göster</button></div>').join(''):'<p>Sonuç bulunamadı.</p>')+'<div class="closeRow"><button id="closeSheet" class="b">Kapat</button></div>';sh.classList.add('open');sh.querySelectorAll('[data-i]').forEach(btn=>btn.addEventListener('click',()=>{const s=rs[Number(btn.dataset.i)];map.setView([s[3],s[4]],12);sh.classList.remove('open')}));document.getElementById('closeSheet').addEventListener('click',()=>sh.classList.remove('open'))}
document.getElementById('toolsBtn').addEventListener('click',showLayers);document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});document.getElementById('q').addEventListener('input',e=>{if(e.target.value.trim().length===0)document.getElementById('sheet').classList.remove('open')});document.getElementById('locBtn').addEventListener('click',()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],13);L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:9,color:'#fff',weight:3,fillColor:'#2376d8',fillOpacity:1}).addTo(map).bindPopup('Konumunuz').openPopup()},()=>{})});
map.on('zoomend',()=>{const z=map.getZoom();document.querySelectorAll('.leaflet-tooltip.histLabel').forEach(el=>el.style.display=z>=8?'block':'none')});
renderPeriods();draw();
</script>
</body></html>
