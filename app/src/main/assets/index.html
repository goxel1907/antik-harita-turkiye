<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Harita Türkiye</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#dce8ec}.top{position:fixed;z-index:1200;top:8px;left:8px;right:8px;background:#111820f3;color:#fff;padding:10px;border-radius:17px;box-shadow:0 8px 28px #0008}.row{display:flex;gap:7px}.q{flex:1;min-width:90px;padding:11px;border-radius:11px;border:1px solid #566472;background:#0c1218;color:#fff;font-size:15px}.b{border:0;border-radius:11px;padding:10px 12px;background:#efc768;color:#1b1408;font-weight:850}.chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px}.chip{border:1px solid #596775;border-radius:22px;background:#26313c;color:#fff;padding:8px 13px;white-space:nowrap;font-size:14px}.chip.active{background:#f1c766;color:#1d1407;border-color:#f7da99;font-weight:900}.status{display:flex;gap:7px;overflow:auto;margin-top:8px}.badge{white-space:nowrap;background:#202a34;color:#c9d2da;border-radius:10px;padding:4px 8px;font-size:12px}.sheet{position:fixed;z-index:1600;left:0;right:0;bottom:0;display:none;max-height:76vh;overflow:auto;background:#101821;color:#fff;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -12px 35px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px}.result{padding:12px;border:1px solid #344656;border-radius:13px;margin:9px 0;background:#17222c}.result:active{background:#23313d}.result b{display:block;font-size:16px}.muted{color:#9eabb7;font-size:12px;margin-top:4px}.layerRow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1a2530;border:1px solid #344656;border-radius:13px;padding:12px;margin:9px 0}.layerRow.on{border-color:#e8bd65;background:#27313c}.layerText b{display:block;font-size:17px}.legend{position:fixed;z-index:1100;left:10px;bottom:13px;background:#121921e9;color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.6}.periodTitle{position:fixed;z-index:1100;right:10px;bottom:13px;background:#24190fee;color:#ffe0a0;border:1px solid #a97b38;padding:8px 10px;border-radius:12px;font-size:11px;font-weight:900}.hist-label{background:#21170fe6!important;color:#ffe0a2!important;border:1px solid #9c6b2e!important;border-radius:7px!important;padding:2px 5px!important;box-shadow:0 2px 8px #0005!important;font-weight:800!important;font-size:11px!important}.leaflet-tooltip.hist-label:before{display:none}.leaflet-control-zoom{margin-top:184px!important}.detailGrid{display:grid;grid-template-columns:108px 1fr;gap:8px 10px;font-size:14px}.k{color:#95a3b1}.v{font-weight:700}.accuracy{display:inline-block;padding:3px 7px;border-radius:9px;background:#2a3440;font-size:11px;margin-top:7px}.warn{background:#4b3521;color:#ffe0a2;border:1px solid #8f693a;padding:9px;border-radius:11px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="row"><input id="q" class="q" placeholder="İl, ilçe, mahalle, köy veya antik ad"><button id="locBtn" class="b">📍</button><button id="toolsBtn" class="b">☰ Katmanlar</button></div>
  <div id="periods" class="chips"></div>
  <div class="status"><span class="badge"><span id="count">0</span> tarihî kayıt</span><span class="badge" id="periodLabel">Roma</span><span class="badge">OSM güncel taban</span></div>
</div>
<div id="sheet" class="sheet"></div>
<div id="legend" class="legend"></div>
<div id="periodTitle" class="periodTitle"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
try{if(window.AndroidApp&&AndroidApp.setScreenshotProtection)AndroidApp.setScreenshotProtection(false)}catch(e){}
const PERIODS={Roma:{title:'Roma • MS 1–4. yy',color:'#a64038',road:'#7b2e29',symbol:'●'},Bizans:{title:'Bizans • MS 5–12. yy',color:'#704fb4',road:'#50337f',symbol:'✚'},Selçuklu:{title:'Selçuklu • 11–13. yy',color:'#2f8063',road:'#215c48',symbol:'◆'},Osmanlı:{title:'Osmanlı • 15–19. yy',color:'#2d6e99',road:'#214f70',symbol:'■'},Helenistik:{title:'Helenistik • MÖ 4–1. yy',color:'#b5792a',road:'#80531d',symbol:'✦'}};
/* Prototip tarihî envanter: koordinatlar kaynak doğrulaması tamamlanana kadar yaklaşık kabul edilir. */
const sites=[
['Ephesos','Efes','Selçuk / İzmir',37.939,27.341,['Helenistik','Roma','Bizans'],'Antik kent / liman','yaklaşık','Prototip envanter'],
['Pergamon','Bergama','Bergama / İzmir',39.1325,27.1841,['Helenistik','Roma','Bizans'],'Akropol / kent','yaklaşık','Prototip envanter'],
['Sardis','Sart','Salihli / Manisa',38.4887,28.0402,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Troia','Troya','Ezine / Çanakkale',39.9575,26.2389,['Helenistik','Roma'],'Yerleşim','yaklaşık','Prototip envanter'],
['Hierapolis','Hierapolis','Pamukkale / Denizli',37.925,29.125,['Helenistik','Roma','Bizans'],'Kent / nekropol','yaklaşık','Prototip envanter'],
['Aphrodisias','Afrodisias','Karacasu / Aydın',37.7088,28.7234,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Miletos','Milet','Didim / Aydın',37.5308,27.2784,['Helenistik','Roma','Bizans'],'Liman kenti','yaklaşık','Prototip envanter'],
['Ancyra','Ankara','Ankara',39.938,32.864,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Nikaia','İznik','İznik / Bursa',40.429,29.721,['Roma','Bizans','Osmanlı'],'Surlu kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Constantinopolis','İstanbul','İstanbul',41.008,28.978,['Roma','Bizans','Osmanlı'],'Başkent','şehir merkezi yaklaşığı','Prototip envanter'],
['Perge','Perge','Aksu / Antalya',36.961,30.853,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Aspendos','Aspendos','Serik / Antalya',36.939,31.172,['Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Side','Side','Manavgat / Antalya',36.767,31.39,['Helenistik','Roma','Bizans'],'Liman kenti','yaklaşık','Prototip envanter'],
['Sagalassos','Sagalassos','Ağlasun / Burdur',37.678,30.519,['Helenistik','Roma','Bizans'],'Dağ kenti','yaklaşık','Prototip envanter'],
['Laodikeia','Laodikeia','Denizli',37.836,29.108,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Aizanoi','Aizanoi','Çavdarhisar / Kütahya',39.201,29.611,['Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Zeugma','Zeugma','Nizip / Gaziantep',37.058,37.865,['Helenistik','Roma'],'Antik kent','yaklaşık','Prototip envanter'],
['Amida','Diyarbakır','Diyarbakır',37.914,40.23,['Roma','Bizans','Selçuklu','Osmanlı'],'Surlu kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Dara','Dara','Artuklu / Mardin',37.179,40.955,['Roma','Bizans'],'Sınır kenti','yaklaşık','Prototip envanter'],
['Hasankeyf','Hasankeyf','Batman',37.714,41.414,['Bizans','Selçuklu','Osmanlı'],'Tarihî kent','yaklaşık','Prototip envanter'],
['Ahlat','Ahlat','Bitlis',38.75,42.48,['Selçuklu','Osmanlı'],'Tarihî kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Ikonion','Konya','Konya',37.87,32.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Caesarea','Kayseri','Kayseri',38.72,35.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Sebasteia','Sivas','Sivas',39.75,37.02,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Antiochia','Antakya','Hatay',36.202,36.161,['Helenistik','Roma','Bizans'],'Metropol kent','şehir merkezi yaklaşığı','Prototip envanter'],
['Priene','Priene','Söke / Aydın',37.659,27.297,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Magnesia','Magnesia','Germencik / Aydın',37.852,27.527,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Tralleis','Tralleis','Aydın',37.856,27.845,['Helenistik','Roma','Bizans'],'Antik kent','yaklaşık','Prototip envanter'],
['Assos','Assos','Ayvacık / Çanakkale',39.492,26.337,['Helenistik','Roma','Bizans'],'Antik kent / liman','yaklaşık','Prototip envanter'],
['Alexandria Troas','Alexandria Troas','Ezine / Çanakkale',39.753,26.158,['Helenistik','Roma','Bizans'],'Antik kent / liman','yaklaşık','Prototip envanter'],
['Stratonikeia','Stratonikeia','Yatağan / Muğla',37.313,28.064,['Helenistik','Roma','Bizans','Osmanlı'],'Yerleşim','yaklaşık','Prototip envanter'],
['Kaunos','Kaunos','Ortaca / Muğla',36.825,28.621,['Helenistik','Roma','Bizans'],'Antik kent / liman','yaklaşık','Prototip envanter']
];
const roads={Roma:[['Via Sebaste / Pisidia',[[36.96,30.85],[37.10,30.60],[37.42,30.53],[37.68,30.52],[38.02,31.01]]],['Menderes ekseni',[[37.53,27.28],[37.85,27.53],[37.86,27.85],[37.84,29.11]]],['Ancyra–Caesarea',[[39.94,32.86],[39.20,34.00],[38.72,35.49]]],['Troas hattı',[[39.49,26.34],[39.75,26.16],[39.96,26.24]]]],Bizans:[['Constantinopolis–Nikaia',[[41.008,28.978],[40.72,29.30],[40.429,29.721]]],['Nikaia–Ancyra',[[40.429,29.721],[39.70,31.20],[39.938,32.864]]],['Ancyra–Caesarea',[[39.938,32.864],[39.20,34.00],[38.72,35.49]]]],Selçuklu:[['Konya–Aksaray–Kayseri',[[37.87,32.49],[38.25,33.55],[38.38,33.99],[38.72,34.91],[38.72,35.49]]],['Antalya–Burdur–Konya',[[36.90,30.70],[37.09,30.58],[37.42,30.53],[37.49,30.59],[37.87,32.49]]]],Osmanlı:[['İstanbul–İznik–Ankara',[[41.008,28.978],[40.429,29.721],[40.30,31.00],[39.938,32.864]]],['Ankara–Konya',[[39.938,32.864],[39.10,32.60],[37.87,32.49]]],['Konya–Kayseri–Sivas',[[37.87,32.49],[38.72,35.49],[39.75,37.02]]]],Helenistik:[['Batı Anadolu iç hattı',[[39.13,27.18],[38.49,28.04],[37.84,29.11]]],['Miletos–Magnesia–Tralleis',[[37.53,27.28],[37.85,27.53],[37.86,27.85]]],['Pamphylia hattı',[[36.96,30.85],[36.94,31.17],[36.77,31.39]]]]};
const stops=[['Sultan Hanı','Aksaray',38.247,33.548,['Selçuklu','Osmanlı']],['Ağzıkara Han','Aksaray',38.381,33.993,['Selçuklu']],['Zazadin Han','Konya',38.085,32.641,['Selçuklu']],['Kızılören Han','Konya-Beyşehir',37.869,32.169,['Selçuklu']],['Evdir Han','Antalya',37.094,30.606,['Selçuklu']],['Kırkgöz Han','Antalya',37.091,30.557,['Selçuklu']],['Susuz Han','Burdur',37.421,30.528,['Selçuklu']],['İncir Han','Burdur',37.492,30.59,['Selçuklu']],['Akhan','Denizli',37.866,29.173,['Selçuklu']]];
const bridges=[['Justinianus Köprüsü','Sakarya',40.756,30.365,['Bizans']],['Taşköprü','Adana',36.987,35.334,['Roma','Bizans','Osmanlı']],['Malabadi Köprüsü','Diyarbakır',38.157,41.203,['Selçuklu']],['Irgandı Köprüsü','Bursa',40.182,29.073,['Osmanlı']]];
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([39.0,35.2],6);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const groups={sites:L.layerGroup().addTo(map),roads:L.layerGroup().addTo(map),stops:L.layerGroup().addTo(map),bridges:L.layerGroup().addTo(map)};
let current='Roma'; let layerState={sites:true,roads:true,stops:true,bridges:true,base:true}; let lastGeoRequest=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function icon(color,symbol,size=34){return L.divIcon({className:'',html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:3px solid #f4e2bc;box-shadow:0 2px 8px #0008;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px">${symbol}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}
function detailSite(s){document.getElementById('sheet').innerHTML=`<h2>${esc(s[0])}</h2><div class="detailGrid"><span class="k">Güncel ad</span><span class="v">${esc(s[1])}</span><span class="k">Mevki</span><span class="v">${esc(s[2])}</span><span class="k">Tür</span><span class="v">${esc(s[6])}</span><span class="k">Dönem</span><span class="v">${esc(s[5].join(', '))}</span><span class="k">Koordinat</span><span class="v">${s[3].toFixed(5)}, ${s[4].toFixed(5)}</span><span class="k">Kaynak durumu</span><span class="v">${esc(s[8])}</span></div><span class="accuracy">Konum doğruluğu: ${esc(s[7])}</span><div class="warn">Bu tarihî koordinat prototip envanter kaydıdır; resmî/akademik kaynak doğrulaması tamamlanmadan kesin arkeolojik koordinat olarak kullanılmamalıdır.</div><button class="b" style="margin-top:12px;width:100%" onclick="closeSheet()">Kapat</button>`;document.getElementById('sheet').classList.add('open')}
function redraw(){Object.values(groups).forEach(g=>g.clearLayers()); const p=PERIODS[current]; let n=0;
 if(layerState.sites)sites.filter(s=>s[5].includes(current)).forEach(s=>{n++;let m=L.marker([s[3],s[4]],{icon:icon(p.color,p.symbol,36)}).addTo(groups.sites);m.bindTooltip(s[0],{direction:'top',className:'hist-label',opacity:.94});m.on('click',()=>detailSite(s))});
 if(layerState.roads)(roads[current]||[]).forEach(r=>{L.polyline(r[1],{color:p.road,weight:5,opacity:.88}).addTo(groups.roads).bindTooltip(r[0],{sticky:true})});
 if(layerState.stops)stops.filter(x=>x[4].includes(current)).forEach(x=>L.marker([x[2],x[3]],{icon:icon('#c98312','H',30)}).addTo(groups.stops).bindPopup(`<b>${esc(x[0])}</b><br>${esc(x[1])}<br><small>Kamuya açık tarihî durak kaydı</small>`));
 if(layerState.bridges)bridges.filter(x=>x[4].includes(current)).forEach(x=>L.marker([x[2],x[3]],{icon:icon('#438ab3','↔',30)}).addTo(groups.bridges).bindPopup(`<b>${esc(x[0])}</b><br>${esc(x[1])}`));
 document.getElementById('count').textContent=n;document.getElementById('periodLabel').textContent=current;document.getElementById('periodTitle').textContent=PERIODS[current].title;document.getElementById('legend').innerHTML=`<div><span style="color:${p.color}">●</span> ${current} yerleşimi</div><div><span style="color:${p.road}">━━━━</span> Tarihî yol (yaklaşık)</div><div>🟠 Han / durak</div><div>🔵 Köprü / geçit</div>`}
function renderPeriods(){let e=document.getElementById('periods');e.innerHTML='';Object.keys(PERIODS).forEach(k=>{let b=document.createElement('button');b.className='chip'+(k===current?' active':'');b.textContent=k;b.onclick=()=>{current=k;renderPeriods();redraw()};e.appendChild(b)})}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function showTools(){let s=document.getElementById('sheet');const rows=[['base','Güncel Türkiye tabanı','OSM il/ilçe/mahalle/köy ve yol referansı'],['sites','Dönem yerleşimleri','Seçili dönemin tarihî kayıtları'],['roads','Tarihî yollar','Yaklaşık rekonstrüksiyon koridorları'],['stops','Han / menzil / durak','Kamuya açık tarihî duraklar'],['bridges','Köprü / geçit','Kamuya açık tarihî geçiş noktaları']];s.innerHTML='<h2>Katmanlar</h2>'+rows.map(r=>`<div class="layerRow ${layerState[r[0]]?'on':''}"><div class="layerText"><b>${r[1]}</b><span class="muted">${r[2]}</span></div><button class="b" onclick="toggleLayer('${r[0]}')">${layerState[r[0]]?'Açık':'Kapalı'}</button></div>`).join('')+'<button class="b" style="width:100%;margin-top:8px" onclick="map.fitBounds([[35.7,25.5],[42.2,45.2]],{padding:[20,20]});closeSheet()">Türkiye görünümü</button><button class="b" style="width:100%;margin-top:8px" onclick="closeSheet()">Kapat</button>';s.classList.add('open')}
function toggleLayer(k){layerState[k]=!layerState[k];if(k==='base'){if(layerState.base)osm.addTo(map);else map.removeLayer(osm)}redraw();showTools()}
async function searchNow(){let q=document.getElementById('q').value.trim();if(!q)return;let local=sites.filter(s=>[s[0],s[1],s[2],s[6],...s[5]].join(' ').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))).slice(0,8);let geo=[];let cacheKey='geo:'+q.toLocaleLowerCase('tr');try{geo=JSON.parse(localStorage.getItem(cacheKey)||'[]')}catch(e){}
 if(!geo.length){let wait=Math.max(0,1100-(Date.now()-lastGeoRequest));if(wait)await new Promise(r=>setTimeout(r,wait));lastGeoRequest=Date.now();try{let u='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=tr&accept-language=tr&q='+encodeURIComponent(q);let res=await fetch(u,{headers:{'Accept':'application/json'}});if(res.ok){geo=await res.json();localStorage.setItem(cacheKey,JSON.stringify(geo))}}catch(e){}}
 let s=document.getElementById('sheet');let html='<h2>Arama</h2>';if(local.length){html+='<div class="muted">Tarihî kayıtlar</div>'+local.map((x,i)=>`<div class="result" onclick="openLocal(${sites.indexOf(x)})"><b>${esc(x[0])} / ${esc(x[1])}</b><div>${esc(x[2])}</div><div class="muted">${esc(x[5].join(', '))} • ${esc(x[6])} • doğruluk: ${esc(x[7])}</div></div>`).join('')}
 if(geo.length){html+='<div class="muted" style="margin-top:12px">Güncel OSM yer sonuçları</div>'+geo.map((g,i)=>`<div class="result" onclick="openGeo(${i})"><b>${esc((g.address&& (g.address.city||g.address.town||g.address.village||g.address.municipality||g.address.county))||g.display_name.split(',')[0])}</b><div>${esc(g.display_name)}</div><div class="muted">OSM • ${esc(g.type||g.category||'yer')} • önem ${Number(g.importance||0).toFixed(3)}</div></div>`).join('');window.__geo=geo}
 if(!local.length&&!geo.length)html+='<p>Sonuç bulunamadı. İnternet bağlantısını ve yazımı kontrol et.</p>';html+='<button class="b" style="width:100%;margin-top:10px" onclick="closeSheet()">Kapat</button>';s.innerHTML=html;s.classList.add('open')}
function openLocal(i){let x=sites[i];map.setView([x[3],x[4]],13);closeSheet();setTimeout(()=>detailSite(x),300)}
function openGeo(i){let g=window.__geo[i],bb=g.boundingbox;if(bb&&bb.length===4)map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]],{maxZoom:16,padding:[30,30]});else map.setView([+g.lat,+g.lon],14);L.marker([+g.lat,+g.lon]).addTo(map).bindPopup(`<b>${esc(g.display_name.split(',')[0])}</b><br>${esc(g.display_name)}<br><small>Kaynak: OpenStreetMap/Nominatim</small>`).openPopup();closeSheet()}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchNow()}});document.getElementById('toolsBtn').onclick=showTools;document.getElementById('locBtn').onclick=()=>{if(!navigator.geolocation)return alert('Konum desteği yok');navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],14),()=>alert('Konum izni verilemedi'),{enableHighAccuracy:true,timeout:10000})};
renderPeriods();redraw();map.fitBounds([[35.7,25.5],[42.2,45.2]],{padding:[12,12]});
</script>
</body>
</html>
