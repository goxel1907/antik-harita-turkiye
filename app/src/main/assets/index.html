*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#bdd8e4;color:#fff}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bdd8e4}.tiles,.svgwrap,.markers{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.svgwrap{pointer-events:none}.svgwrap path,.svgwrap circle{pointer-events:auto}.markers{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 2px 11px #0008}.poi{width:38px;height:38px;border-radius:50%;border:3px solid #fff;font-size:18px;font-weight:900}.cluster{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#152331;font-weight:900}.label{position:absolute;transform:translate(24px,-50%);background:#0b151eee;border:1px solid #71818f;border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap;max-width:235px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.label small{font-weight:600;color:#b8c5ce}.top{position:fixed;z-index:50;top:8px;left:8px;right:8px;background:#101820f6;padding:10px;border-radius:18px;box-shadow:0 8px 28px #0008}.row{display:flex;gap:7px}.q{flex:1;min-width:80px;padding:11px;border-radius:11px;border:1px solid #566472;background:#0c1218;color:#fff;font-size:16px}.b{border:0;border-radius:11px;padding:10px 12px;background:#efc768;color:#1b1408;font-weight:850}.chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid #596775;border-radius:22px;background:#26313c;color:#fff;padding:8px 13px;white-space:nowrap;font-size:14px}.chip.active{background:#f1c766;color:#1d1407;border-color:#f7da99;font-weight:900}.status{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.badge{white-space:nowrap;backgroun und:#2a3440;font-size:11px;margin:3px 4px 0 0}.okbox{background:#18372c;color:#bff4d4;border:1px solid #3d7a61;padding:8px;border-radius:10px;font-size:12px}.warn{background:#4b3521;color:#ffe0a2;border:1px solid #8f693a;padding:9px;border-radius:11px;font-size:12px;margin-top:10px}.kindrow{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center}.kindicon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #ffffff88}.distance{font-size:11px;color:#c7d1d9}.attrib{position:fixed;right:3px;bottom:0;z-index:30;background:#fff9;color:#345;font-size:9px;padding:1px 3px}

<body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><svg id="svg" class="svgwrap" width="100%" height="100%"></svg><div id="markers" class="markers"></div></div>
<div class="top"><div class="row"><input id="q" class="q" placeholder="İl, ilçe, köy veya tarihî ad"><button id="loc" class="b">📍</button><button id="menu" class="b">☰</button></div><div id="periods" class="chips"></div><div id="categories" class="chips"></div><div class="status"><span id="recordBadge" class="badge">Zoom 11+ canlı ayrıntı</span><span id="periodBadge" class="badge">Tüm dönemler</span><span id="networkBadge" class="badge">Hazır</span></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div><div class="version">v10 FAST</div><button id="nearBtn" class="nearbtn">☷ Yakındakiler</button><div id="sheet" class="sheet"></div><div id="loading" class="loading">Yakın çevre yükleniyor…</div><div id="empty" class="empty"></div><div id="legend" class="legend"></div><div id="counter" class="counter">Zoom 6</div><div class="attrib">© OpenStreetMap contributors</div>
<script>
const PERIODS=['Tümü','Helenistik','Roma','Bizans','Selçuklu','Osmanlı','Hitit','Frig','Urartu','Neolitik'];
const CATEGORIES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Yapı','Potansiyel'];
const CAT={Yerleşim:{icon:'🏛',color:'#b04a40',label:'Yerleşim / arkeoloji',w:4},Yol:{icon:'≋',color:'#8f5b3f',label:'Tarihî yol / güzergâh',w:3},Konaklama:{icon:'H',color:'#c8891e',label:'Han / kervansaray',w:4},Savunma:{icon:'🏰',color:'#6d4db0',label:'Kale / savunma',w:4},Geçiş:{icon:'↔',color:'#3784b6',label:'Köprü / geçit',w:3},Su:{icon:'💧',color:'#2a92bd',label:'Su yapısı / kaynak',w:2},Mağara:{icon:'◒',color:'#6c6c6c',label:'Yayımlanmış mağara',w:2},Yapı:{icon:'▣',color:'#56765a',label:'Tarihî yapı',w:2},Diğer:{icon:'•',color:'#7b8792',label:'Diğer',w:1}};
let lat=39,lon=35.2,zoom=6,selPeriod='Tümü',selCategory='Tümü',publicItems=[],potentialCells=[],nearbyTimer=null,queryInFlight=false,pendingSearch='',requestSeq=0,lastAppliedRequest=0,networkState='idle',lastSource='';
const TS=256,queryCache=new Map(),map=document.getElementById('map'),tiles=document.getElementById('tiles'),svg=document.getElementById('svg'),markers=document.getElementById('markers'),sheet=document.getElementById('sheet'),loading=document.getElementById('loading'),empty=document.getElementById('empty');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),world=z=>TS*Math.pow(2,z),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function project(a,o,z){const s=world(z),x=(o+180)/360*s,sn=Math.sin(clamp(a,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}function unproject(x,y,z){const s=world(z),o=x/s*360-180,n=Math.PI-2*Math.PI*y/s,a=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[a,o]}function centerWorld(){return project(lat,lon,zoom)}function screenFor(a,o){const c=centerWorld(),p=project(a,o,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}function bbox(){const c=centerWorld(),nw=unproject(c[0]-innerWidth/2,c[1]-innerHeight/2,zoom),se=unproject(c[0]+innerWidth/2,c[1]+innerHeight/2,zoom);return[nw[0],nw[1],se[0],se[1]]}
function renderTiles(){tiles.innerHTML='';const c=centerWorld(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=2**zoom;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function setCenter(a,o,z,load=true){lat=clamp(a,-85,85);lon=o;zoom=clamp(Math.round(z),3,18);render();if(load)scheduleNearby()}
function centroid(g){if(!g||!g.length)return null;let a=0,o=0,n=0;for(const p of g)if(Number.isFinite(p.lat)&&Number.isFinite(p.lon)){a+=p.lat;o+=p.lon;n++}return n?[a/n,o/n]:null}
function classify(t){const h=(t.historic||'').toLowerCase(),nm=((t.name||'')+' '+(t.description||'')).toLowerCase();if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes')return'Yerleşim';if(h==='road'||h==='milestone'||h==='route'||t['route:historic']==='yes')return'Yol';if(h==='caravanserai'||h==='inn'||t.tourism==='caravanserai'||/kervansaray|caravanserai|\bhan\b/.test(nm))return'Konaklama';if(['castle','fort','fortification','city_gate','citywalls','tower'].includes(h)||t.fortification_type)return'Savunma';if(h==='bridge'||t.ford==='yes'||t.mountain_pass==='yes')return'Geçiş';if(h==='aqueduct'||t.natural==='spring'||t.man_made==='water_well')return'Su';if(t.natural==='cave_entrance'||h==='cave')return'Mağara';if(['monastery','manor','palace','church','mosque','temple','wayside_shrine','wayside_cross'].includes(h)||t.heritage)return'Yapı';return'Diğer'}
function detectPeriods(t){const s=[t.period,t.start_date,t['historic:civilization'],t.civilization,t.description,t.old_name,t.name].filter(Boolean).join(' ').toLowerCase(),o=[];for(const[p,r]of[['Helenistik',/hellen|helen/],['Roma',/roman|roma\b/],['Bizans',/byzant|bizans/],['Selçuklu',/seljuk|selçuk/],['Osmanlı',/ottoman|osmanl/],['Hitit',/hittite|hitit/],['Frig',/phryg|frig/],['Urartu',/urartu/],['Neolitik',/neolith|neolit/]])if(r.test(s))o.push(p);return o}
function parseElements(raw){const j=JSON.parse(raw),seen=new Set(),out=[];for(const e of j.elements||[]){const id=e.type+':'+e.id;if(seen.has(id))continue;seen.add(id);const t=e.tags||{},kind=classify(t);if(kind==='Diğer')continue;let a=e.lat,o=e.lon,g=e.geometry||[];if((a==null||o==null)&&e.center){a=e.center.lat;o=e.center.lon}if((a==null||o==null)&&g.length){const c=centroid(g);if(c){a=c[0];o=c[1]}}if(a==null||o==null)continue;out.push({id,lat:+a,lon:+o,tags:t,kind,name:t['name:tr']||t.name||t.old_name||`Adsız ${CAT[kind].label}`,periods:detectPeriods(t),geometry:g,src:'OpenStreetMap / Overpass'})}return out}
function matches(it){return(selCategory==='Tümü'||selCategory==='Potansiyel'||it.kind===selCategory)&&(selPeriod==='Tümü'||it.periods.includes(selPeriod))}function hav(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}function distText(k){return k<1?Math.round(k*1000)+' m':k.toFixed(k<10?1:0)+' km'}
function addMarker(it){const[x,y]=screenFor(it.lat,it.lon);if(x<-80||x>innerWidth+80||y<-80||y>innerHeight+80)return;const c=CAT[it.kind],d=document.createElement('div');d.className='marker poi';d.style.cssText=`left:${x}px;top:${y}px;background:${c.color}`;d.textContent=c.icon;d.onclick=()=>detailItem(it);markers.appendChild(d);if(zoom>=13){const l=document.createElement('div');l.className='label';l.style.left=x+'px';l.style.top=y+'px';l.innerHTML=`${esc(c.label.split(' / ')[0])} • ${esc(it.name)}${it.periods.length?` <small>(${esc(it.periods.join(', '))})</small>`:''}`;markers.appendChild(l)}}
function addCluster(list){let a=0,o=0;for(const i of list){a+=i.lat;o+=i.lon}a/=list.length;o/=list.length;const[x,y]=screenFor(a,o),d=document.createElement('div');d.className='marker cluster';d.style.left=x+'px';d.style.top=y+'px';d.textContent=list.length;d.onclick=()=>setCenter(a,o,zoom+2);markers.appendChild(d)}
function renderGeometry(it){if(zoom<14||!it.geometry||it.geometry.length<2)return;const c=CAT[it.kind],p=document.createElementNS('http://www.w3.org/2000/svg','path');let d='';for(let i=0;i<it.geometry.length;i++){const[x,y]=screenFor(it.geometry[i].lat,it.geometry[i].lon);d+=(i?'L':'M')+x+','+y}p.setAttribute('d',d);p.setAttribute('fill',['Yerleşim','Savunma','Yapı'].includes(it.kind)?c.color+'22':'none');p.setAttribute('stroke',c.color);p.setAttribute('stroke-width',it.kind==='Yol'?5:3);p.setAttribute('opacity','.92');p.style.pointerEvents='stroke';p.onclick=()=>detailItem(it);svg.appendChild(p)}
function buildPotential(){const step=zoom<=12?.03:.012,cells=new Map();for(const it of publicItems){if(!['Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara'].includes(it.kind))continue;const k=Math.floor(it.lat/step)+':'+Math.floor(it.lon/step);if(!cells.has(k))cells.set(k,{lat:0,lon:0,n:0,score:0,kinds:new Set(),step});const c=cells.get(k);c.lat+=it.lat;c.lon+=it.lon;c.n++;c.score+=CAT[it.kind].w;c.kinds.add(it.kind)}potentialCells=[];for(const c of cells.values())if(c.n>=3&&c.kinds.size>=2&&c.score>=8){c.lat/=c.n;c.lon/=c.n;c.score=Math.min(10,Math.round(c.score/2+c.kinds.size));potentialCells.push(c)}}
function renderPotential(c){const[x,y]=screenFor(c.lat,c.lon),[x2]=screenFor(c.lat,c.lon+c.step/2),r=clamp(Math.abs(x2-x),35,110),el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('r',r);el.setAttribute('fill','#b47a3c20');el.setAttribute('stroke','#b47a3c');el.setAttribute('stroke-width','2');el.setAttribute('stroke-dasharray','7 6');el.onclick=()=>detailPotential(c);svg.appendChild(el)}
function renderOverlay(){markers.innerHTML='';svg.innerHTML='';const v=publicItems.filter(matches);for(const it of v)renderGeometry(it);if(zoom<=12&&selCategory!=='Potansiyel'){const cells=new Map();for(const it of v){const[x,y]=screenFor(it.lat,it.lon),k=Math.floor(x/74)+':'+Math.floor(y/74);if(!cells.has(k))cells.set(k,[]);cells.get(k).push(it)}for(const l of cells.values())l.length>1?addCluster(l):addMarker(l[0])}else if(selCategory!=='Potansiyel')for(const it of v)addMarker(it);for(const c of potentialCells)renderPotential(c);updateStatus(v.length)}
function updateStatus(n){document.getElementById('periodBadge').textContent=selPeriod==='Tümü'?'Tüm dönemler':selPeriod;document.getElementById('recordBadge').textContent=zoom<11?'Zoom 11+ canlı ayrıntı':`${publicItems.length} kayıt • ${n} görünür`;const b=document.getElementById('networkBadge');b.className='badge'+(networkState==='ok'?' ok':networkState==='error'?' err':'');b.textContent=networkState==='loading'?'Yükleniyor':networkState==='ok'?`Canlı • ${lastSource||'kaynak'}`:networkState==='error'?'Bağlantı yok':'Hazır';document.getElementById('counter').textContent=`Zoom ${zoom} • kayıt ${publicItems.length} • alan ${potentialCells.length}`;document.getElementById('nearBtn').textContent=`☷ Yakındakiler (${n})`;empty.style.display=zoom>=11&&!queryInFlight&&!publicItems.length?'block':'none';if(empty.style.display==='block')empty.textContent=networkState==='error'?'Canlı kaynaklara erişilemedi. Harita kullanılabilir; tekrar denemek için menüyü açın.':'Bu yakın çevrede eşleşen açık kayıt yok.'}
function render(){renderTiles();renderOverlay()}function showSheet(h){sheet.innerHTML=h;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}window.closeSheet=closeSheet;
function detailItem(it){const c=CAT[it.kind],t=it.tags,per=it.periods.length?it.periods.join(', '):'Kaynakta dönem etiketi yok',extra=['historic','archaeological_site','site_type','old_name','start_date','period','heritage','wikidata','wikipedia','description'].filter(k=>t[k]).map(k=>`<span class="tag">${esc(k)}: ${esc(t[k])}</span>`).join('');showSheet(`<h2>${c.icon} ${esc(it.name)}</h2><div class="okbox">${esc(c.label)} • ${distText(hav(lat,lon,it.lat,it.lon))}</div><div class="card"><b>Dönem:</b> ${esc(per)}<br><b>Kaynak:</b> ${esc(it.src)}<br><b>Kayıt:</b> ${esc(it.id)}<br>${extra}</div><div class="warn">Kamuya açık kayıt bilgisidir; arkeolojik yorum ve hukuki statü ayrıca doğrulanmalıdır.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function detailPotential(c){showSheet(`<h2>Bölgesel koruma / araştırma bağlamı</h2><div class="okbox">${c.n} açık gösterge • ${c.kinds.size} tür • skor ${c.score}/10</div><div class="card">${[...c.kinds].map(k=>`<span class="tag">${esc(CAT[k].label)}</span>`).join('')}</div><div class="warn">Genelleştirilmiş alandır; kesin arkeolojik veya saklama noktası değildir.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function openNearby(){const list=publicItems.filter(matches).map(x=>({...x,d:hav(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.d-b.d).slice(0,60);let h='<h2>Yakındaki kayıtlar</h2>';if(!list.length)h+='<div class="warn">Yüklü kayıt yok. Canlı kaynağı yeniden deneyebilirsin.</div>';for(const it of list){const c=CAT[it.kind];h+=`<div class="result" onclick="jump(${it.lat},${it.lon},14)"><div class="kindrow"><div class="kindicon" style="background:${c.color}">${c.icon}</div><div><b>${esc(it.name)}</b><div class="muted">${esc(c.label)}${it.periods.length?' • '+esc(it.periods.join(', ')):''}</div></div><div class="distance">${distText(it.d)}</div></div></div>`}h+='<button class="b" onclick="closeSheet()">Kapat</button>';showSheet(h)}
function buildChips(){for(const[id,arr,sel,setter]of[['periods',PERIODS,selPeriod,x=>selPeriod=x],['categories',CATEGORIES,selCategory,x=>selCategory=x]]){const e=document.getElementById(id);e.innerHTML='';for(const x of arr){const b=document.createElement('button');b.className='chip'+(x===sel?' active':'');b.textContent=x;b.onclick=()=>{setter(x);buildChips();renderOverlay();if(id==='categories'&&zoom>=11)scheduleNearby(true)};e.appendChild(b)}}}
function legend(){document.getElementById('legend').innerHTML='<b>Türler</b><br>🏛 Yerleşim/arkeoloji &nbsp; ≋ Yol<br>H Han/kervansaray &nbsp; 🏰 Kale/savunma<br>↔ Köprü/geçit &nbsp; 💧 Su<br>◒ Mağara &nbsp; ▣ Tarihî yapı<br>◌ Bölgesel potansiyel'}
function radius(){return zoom<=11?7000:zoom===12?4500:zoom===13?2800:zoom===14?1800:1200}function qA(f,r){return`nwr(around:${r},${lat.toFixed(5)},${lon.toFixed(5)})${f};`}function queryKey(){const r=radius(),d=Math.max(.006,r/111000/2);return`${zoom}:${Math.round(lat/d)}:${Math.round(lon/d)}:${selCategory}`}
function buildQuery(){const r=radius(),q=[];const wants=x=>selCategory==='Tümü'||selCategory===x||selCategory==='Potansiyel';if(wants('Yerleşim')){q.push(qA('[historic~"^(archaeological_site|ruins)$"]',r),qA('[archaeological_site]',r),qA('[tourism=archaeological_site]',r))}if(wants('Yol'))q.push(qA('[historic~"^(road|route|milestone)$"]',r),qA('[route:historic=yes]',r));if(wants('Konaklama'))q.push(qA('[historic~"^(caravanserai|inn)$"]',r),qA('[tourism=caravanserai]',r));if(wants('Savunma'))q.push(qA('[historic~"^(castle|fort|fortification|city_gate|citywalls|tower)$"]',r));if(wants('Geçiş'))q.push(qA('[historic=bridge]',r),qA('[ford=yes]',r),qA('[mountain_pass=yes]',r));if(selCategory==='Su'||selCategory==='Potansiyel')q.push(qA('[historic=aqueduct]',r),qA('[natural=spring]',Math.min(r,1800)),qA('[man_made=water_well]',Math.min(r,1200)));if(selCategory==='Mağara'||selCategory==='Potansiyel')q.push(qA('[natural=cave_entrance]',r));if(selCategory==='Yapı')q.push(qA('[historic~"^(monastery|manor|palace|church|mosque|temple|wayside_shrine|wayside_cross)$"]',r),qA('[heritage]',Math.min(r,1400)));return`[out:json][timeout:12];(${q.join('')})${zoom>=14?'out body geom qt;':'out body center qt;'}`}
function scheduleNearby(force=false){clearTimeout(nearbyTimer);if(zoom<11){publicItems=[];potentialCells=[];networkState='idle';queryInFlight=false;loading.style.display='none';renderOverlay();return}nearbyTimer=setTimeout(()=>loadNearby(force),1200)}
function loadNearby(force=false){const k=queryKey();if(!force&&queryCache.has(k)){publicItems=queryCache.get(k);buildPotential();networkState='ok';lastSource='önbellek';renderOverlay();return}if(queryInFlight)return;queryInFlight=true;networkState='loading';loading.style.display='block';empty.style.display='none';updateStatus(publicItems.filter(matches).length);const id=String(++requestSeq);try{AndroidApp.fetchOverpassV2(id,buildQuery())}catch(e){onNativeOverpassError(e.message)}}
window.onNativeOverpassV2=function(id,raw,source){const n=+id||0;if(n<lastAppliedRequest)return;lastAppliedRequest=n;queryInFlight=false;loading.style.display='none';try{const data=parseElements(raw);publicItems=data;queryCache.set(queryKey(),data);if(queryCache.size>20)queryCache.delete(queryCache.keys().next().value);buildPotential();networkState='ok';lastSource=source||'canlı';renderOverlay()}catch(e){onNativeOverpassError('Ayrıştırma: '+e.message)}};window.onNativeOverpass=function(raw){window.onNativeOverpassV2(String(++requestSeq),raw,'canlı')};window.onNativeOverpassError=function(msg){queryInFlight=false;loading.style.display='none';networkState='error';lastSource='';renderOverlay();empty.style.display='block';empty.textContent='Canlı veri alınamadı. Önceki kayıtlar korunur; menüden tekrar deneyin.';document.getElementById('networkBadge').title=msg};
function doSearch(text){pendingSearch=text.trim();if(!pendingSearch)return;try{AndroidApp.geocode(pendingSearch)}catch(e){onNativeGeocodeError(e.message)}}window.onNativeGeocode=function(raw){let a=[];try{a=JSON.parse(raw)}catch(e){}let h='<h2>Yer arama</h2>';for(const r of a)h+=`<div class="result" onclick="jump(${+r.lat},${+r.lon},14)"><b>${esc(r.name||String(r.display_name||'').split(',')[0])}</b><div class="muted">${esc(r.display_name||'')}</div></div>`;if(!a.length)h+='<p>Sonuç bulunamadı.</p>';h+='<button class="b" onclick="closeSheet()">Kapat</button>';showSheet(h)};window.onNativeGeocodeError=m=>showSheet(`<h2>Arama</h2><div class="warn">${esc(m)}</div><button class="b" onclick="closeSheet()">Kapat</button>`);
window.jump=(a,o,z)=>{closeSheet();setCenter(a,o,z)};window.onNativeLocation=(a,o)=>setCenter(a,o,15);document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch(e.target.value)}});document.getElementById('loc').onclick=()=>{try{AndroidApp.requestLocation()}catch(e){}};document.getElementById('nearBtn').onclick=openNearby;document.getElementById('menu').onclick=()=>showSheet(`<h2>v10 FAST • Harita ve veri</h2><div class="card"><b>Zoom 11–12:</b> hızlı çekirdek tarihî kayıtlar.<br><b>Zoom 13:</b> her işarette tür + ad etiketi.<br><b>Zoom 14+:</b> çizgi/alan geometrileri.</div><div class="card"><b>Tarama yarıçapı:</b> yaklaşık ${Math.round(radius()/1000)} km<br><b>Yüklü kayıt:</b> ${publicItems.length}<br><b>Kaynak:</b> ${esc(lastSource||'henüz yok')}</div><button class="b" onclick="retryNearby()">Canlı veriyi yeniden yükle</button> <button class="b" onclick="jump(39,35.2,6)">Türkiye görünümü</button> <button class="b" onclick="closeSheet()">Kapat</button>`);window.retryNearby=()=>{queryInFlight=false;networkState='idle';closeSheet();loadNearby(true)};document.getElementById('zin').onclick=()=>setCenter(lat,lon,zoom+1);document.getElementById('zout').onclick=()=>setCenter(lat,lon,zoom-1);
const pointers=new Map();let dragStart=null,pinchStart=null;const parr=()=>[...pointers.values()];map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);if(pointers.size===1)dragStart={x:e.clientX,y:e.clientY,c:centerWorld(),z:zoom};else if(pointers.size===2){const a=parr(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;pinchStart={dist:Math.hypot(dx,dy),zoom,lat,lon};dragStart=null}});map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragStart){const p=parr()[0],[a,o]=unproject(dragStart.c[0]-(p.x-dragStart.x),dragStart.c[1]-(p.y-dragStart.y),dragStart.z);lat=a;lon=o;renderTiles();renderOverlay()}else if(pointers.size===2&&pinchStart){const a=parr(),d=Math.max(20,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)),z=clamp(Math.round(pinchStart.zoom+Math.log2(d/pinchStart.dist)),3,18);if(z!==zoom){zoom=z;lat=pinchStart.lat;lon=pinchStart.lon;render()}}});function endPointer(e){pointers.delete(e.pointerId);if(!pointers.size){dragStart=null;pinchStart=null;scheduleNearby()}else if(pointers.size===1){const p=parr()[0];dragStart={x:p.x,y:p.y,c:centerWorld(),z:zoom};pinchStart=null}}map.addEventListener('pointerup',endPointer);map.addEventListener('pointercancel',endPointer);window.addEventListener('resize',()=>render());buildChips();legend();render();
</script>
