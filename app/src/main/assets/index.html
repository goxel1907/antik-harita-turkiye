<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Harita Türkiye</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#dce8ec;color:#fff}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bdd8e4}.tiles,.svgwrap,.markers{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.svgwrap{pointer-events:none}.svgwrap path,.svgwrap circle{pointer-events:auto}.markers{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 2px 10px #0008}.poi{width:30px;height:30px;border-radius:50%;border:2px solid #fff7;font-size:15px;font-weight:900}.cluster{width:38px;height:38px;border-radius:50%;border:3px solid #fff8;background:#182532;color:#fff;font-size:13px;font-weight:900}.label{position:absolute;transform:translate(18px,-50%);background:#101820e8;border:1px solid #637687;border-radius:7px;padding:3px 6px;font-size:10px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.top{position:fixed;z-index:50;top:8px;left:8px;right:8px;background:#101820f5;padding:10px;border-radius:18px;box-shadow:0 8px 28px #0008}.row{display:flex;gap:7px}.q{flex:1;min-width:80px;padding:11px;border-radius:11px;border:1px solid #566472;background:#0c1218;color:#fff;font-size:16px}.b{border:0;border-radius:11px;padding:10px 12px;background:#efc768;color:#1b1408;font-weight:850}.chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid #596775;border-radius:22px;background:#26313c;color:#fff;padding:8px 13px;white-space:nowrap;font-size:14px}.chip.active{background:#f1c766;color:#1d1407;border-color:#f7da99;font-weight:900}.status{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.badge{white-space:nowrap;background:#202a34;color:#d4dce3;border-radius:10px;padding:5px 8px;font-size:12px}.zoom{position:fixed;z-index:40;left:12px;top:330px;display:flex;flex-direction:column}.zoom button{width:50px;height:50px;border:1px solid #8696a0;background:#fff;color:#111;font-size:30px;font-weight:900}.zoom button:first-child{border-radius:8px 8px 0 0}.zoom button:last-child{border-radius:0 0 8px 8px}.sheet{position:fixed;z-index:80;left:0;right:0;bottom:0;display:none;max-height:78vh;overflow:auto;background:#101821;color:#fff;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -12px 35px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px}.card,.result{padding:12px;border:1px solid #344656;border-radius:13px;margin:9px 0;background:#17222c}.result{cursor:pointer}.muted{color:#9eabb7;font-size:12px;margin-top:4px}.tag{display:inline-block;padding:3px 7px;border-radius:9px;background:#2a3440;font-size:11px;margin:3px 4px 0 0}.ok{background:#18372c;color:#bff4d4;border:1px solid #3d7a61;padding:8px;border-radius:10px;font-size:12px}.warn{background:#4b3521;color:#ffe0a2;border:1px solid #8f693a;padding:9px;border-radius:11px;font-size:12px;margin-top:10px}.legend{position:fixed;z-index:35;left:10px;bottom:12px;background:#121921ed;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.65;max-width:230px}.counter{position:fixed;z-index:35;right:10px;bottom:12px;background:#101820e8;padding:7px 9px;border-radius:10px;font-size:11px}.loading{position:fixed;z-index:60;left:50%;top:270px;transform:translateX(-50%);background:#101820ec;border-radius:999px;padding:8px 11px;font-size:11px;display:none}.attrib{position:fixed;right:4px;bottom:0;z-index:30;background:#fff9;color:#345;font-size:9px;padding:1px 3px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.line{display:inline-block;width:18px;height:3px;margin:0 5px 3px 0;vertical-align:middle}.empty{position:fixed;z-index:34;left:50%;top:50%;transform:translate(-50%,-50%);background:#101820d8;border-radius:14px;padding:12px 15px;font-size:12px;color:#d7e0e7;text-align:center;max-width:280px;display:none}
</style>
</head>
<body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><svg id="svg" class="svgwrap" width="100%" height="100%"></svg><div id="markers" class="markers"></div></div>
<div class="top"><div class="row"><input id="q" class="q" placeholder="İl, ilçe, mahalle, köy veya tarihî ad"><button id="loc" class="b">📍</button><button id="menu" class="b">☰</button></div><div id="periods" class="chips"></div><div id="categories" class="chips"></div><div class="status"><span class="badge" id="recordBadge">Canlı envanter • zoom 11+</span><span class="badge" id="periodBadge">Tüm dönemler</span><span class="badge" id="potentialBadge">Potansiyel: bölgesel</span></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<div id="sheet" class="sheet"></div><div id="loading" class="loading">Yakın çevre kaynakları yükleniyor…</div><div id="empty" class="empty"></div><div id="legend" class="legend"></div><div id="counter" class="counter">Zoom 6</div><div class="attrib">© OpenStreetMap contributors</div>
<script>
const PERIODS=['Tümü','Helenistik','Roma','Bizans','Selçuklu','Osmanlı','Hitit','Frig','Urartu','Neolitik'];
const CATEGORIES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Yapı','Potansiyel'];
const CAT={'Yerleşim':{icon:'▲',color:'#b04a40',weight:4},'Yol':{icon:'≋',color:'#8f5b3f',weight:3,line:true},'Konaklama':{icon:'H',color:'#c8891e',weight:4},'Savunma':{icon:'◆',color:'#6d4db0',weight:4},'Geçiş':{icon:'↔',color:'#3784b6',weight:3},'Su':{icon:'≈',color:'#2a92bd',weight:2},'Mağara':{icon:'◒',color:'#6a6a6a',weight:2},'Yapı':{icon:'■',color:'#56765a',weight:2},'Diğer':{icon:'•',color:'#7b8792',weight:1}};
let lat=39,lon=35.2,zoom=6,selPeriod='Tümü',selCategory='Tümü',publicItems=[],potentialCells=[],lastNearby='',nearbyTimer=null,queryInFlight=false,pendingSearch='';const TS=256;
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),svg=document.getElementById('svg'),markers=document.getElementById('markers'),sheet=document.getElementById('sheet'),loading=document.getElementById('loading'),empty=document.getElementById('empty');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const world=z=>TS*Math.pow(2,z);
function project(la,lo,z){const s=world(z),x=(lo+180)/360*s,sn=Math.sin(clamp(la,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}
function unproject(x,y,z){const s=world(z),lo=x/s*360-180,n=Math.PI-2*Math.PI*y/s,la=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[la,lo]}
function centerWorld(){return project(lat,lon,zoom)}function screenFor(la,lo){const c=centerWorld(),p=project(la,lo,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=centerWorld(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=Math.pow(2,zoom);for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.alt='';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function setCenter(la,lo,z,load=true){lat=clamp(la,-85,85);lon=lo;zoom=clamp(Math.round(z),3,18);render();if(load)scheduleNearby()}
function bbox(){const c=centerWorld(),nw=unproject(c[0]-innerWidth/2,c[1]-innerHeight/2,zoom),se=unproject(c[0]+innerWidth/2,c[1]+innerHeight/2,zoom);return[nw[0],nw[1],se[0],se[1]]}
function centroid(g){if(!g||!g.length)return null;let a=0,o=0,n=0;for(const p of g){if(Number.isFinite(p.lat)&&Number.isFinite(p.lon)){a+=p.lat;o+=p.lon;n++}}return n?[a/n,o/n]:null}
function classify(t){const h=(t.historic||'').toLowerCase(),a=(t.archaeological_site||'').toLowerCase(),name=((t.name||'')+' '+(t.description||'')).toLowerCase();if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site'||t.ruins==='yes')return'Yerleşim';if(h==='road'||h==='milestone'||t['route:historic']==='yes'||h==='route')return'Yol';if(h==='caravanserai'||h==='inn'||/kervansaray|caravanserai|\bhan\b/.test(name))return'Konaklama';if(['castle','fort','fortification','city_gate','citywalls','tower','bunker'].includes(h)||t.fortification_type)return'Savunma';if(h==='bridge'||t.ford==='yes'||t.bridge==='yes'||t.mountain_pass==='yes')return'Geçiş';if(h==='aqueduct'||t.natural==='spring'||t.man_made==='water_well'||t.amenity==='drinking_water')return'Su';if(t.natural==='cave_entrance'||h==='cave')return'Mağara';if(['monastery','manor','palace','church','mosque','temple','wayside_shrine','wayside_cross'].includes(h)||t.heritage)return'Yapı';if(a)return'Yerleşim';return'Diğer'}
function detectPeriods(t){const s=[t.period,t.start_date,t['historic:civilization'],t.civilization,t.archaeological_site,t.description,t.old_name,t.name].filter(Boolean).join(' ').toLowerCase(),out=[];const tests=[['Helenistik',/hellen|helen/],['Roma',/roman|roma\b/],['Bizans',/byzant|bizans/],['Selçuklu',/seljuk|selçuk/],['Osmanlı',/ottoman|osmanl/],['Hitit',/hittite|hitit/],['Frig',/phryg|frig/],['Urartu',/urartu/],['Neolitik',/neolith|neolit/]];for(const[p,r]of tests)if(r.test(s))out.push(p);return out}
function featureName(t,kind){return t.name||t['name:tr']||t.old_name||t['name:ota']||t['name:grc']||kind}
function parseElements(raw){const j=JSON.parse(raw),seen=new Set(),items=[];for(const el of j.elements||[]){const key=el.type+':'+el.id;if(seen.has(key))continue;seen.add(key);const t=el.tags||{},kind=classify(t);if(kind==='Diğer'&&!t.historic)continue;let a=el.lat,o=el.lon,g=el.geometry||[];if((a==null||o==null)&&g.length){const c=centroid(g);if(c){a=c[0];o=c[1]}}if(a==null||o==null)continue;items.push({id:key,lat:+a,lon:+o,tags:t,kind,name:featureName(t,kind),periods:detectPeriods(t),geometry:g,src:'OpenStreetMap / Overpass'})}return items}
function matchesFilter(it){if(selCategory!=='Tümü'&&selCategory!=='Potansiyel'&&it.kind!==selCategory)return false;if(selPeriod!=='Tümü'&&!it.periods.includes(selPeriod))return false;return true}
function createEl(tag,attrs={}){const e=document.createElement(tag);Object.assign(e,attrs);return e}
function addMarker(it){const[x,y]=screenFor(it.lat,it.lon);if(x<-60||x>innerWidth+60||y<-60||y>innerHeight+60)return;const cfg=CAT[it.kind]||CAT.Diğer,d=createEl('div');d.className='marker poi';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cfg.color;d.textContent=cfg.icon;d.onclick=()=>detailItem(it);markers.appendChild(d);if(zoom>=13&&it.name&&it.name!==it.kind){const l=createEl('div');l.className='label';l.style.left=x+'px';l.style.top=y+'px';l.textContent=it.name;markers.appendChild(l)}}
function addCluster(list){let a=0,o=0;for(const x of list){a+=x.lat;o+=x.lon}a/=list.length;o/=list.length;const[x,y]=screenFor(a,o),d=createEl('div');d.className='marker cluster';d.style.left=x+'px';d.style.top=y+'px';d.textContent=list.length;d.onclick=()=>setCenter(a,o,zoom+2);markers.appendChild(d)}
function pathD(geom){let d='';for(let i=0;i<geom.length;i++){const p=geom[i],[x,y]=screenFor(p.lat,p.lon);d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}return d}
function renderGeometry(it){if(!it.geometry||it.geometry.length<2)return;const cfg=CAT[it.kind]||CAT.Diğer,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathD(it.geometry));p.setAttribute('fill',it.kind==='Yerleşim'||it.kind==='Savunma'||it.kind==='Yapı'?cfg.color+'22':'none');p.setAttribute('stroke',cfg.color);p.setAttribute('stroke-width',it.kind==='Yol'?4:2.5);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.setAttribute('opacity','0.82');p.style.pointerEvents='stroke';p.onclick=()=>detailItem(it);svg.appendChild(p)}
function buildPotential(){const step=zoom<=11?.05:zoom===12?.03:.012,cells=new Map();for(const it of publicItems){if(!['Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara'].includes(it.kind))continue;const k=Math.floor(it.lat/step)+':'+Math.floor(it.lon/step);if(!cells.has(k))cells.set(k,{lat:0,lon:0,n:0,score:0,kinds:new Set(),items:[]});const c=cells.get(k),w=(CAT[it.kind]||CAT.Diğer).weight;c.lat+=it.lat;c.lon+=it.lon;c.n++;c.score+=w;c.kinds.add(it.kind);c.items.push(it)}potentialCells=[];for(const c of cells.values()){if(c.n>=3&&c.kinds.size>=2&&c.score>=8){c.lat/=c.n;c.lon/=c.n;c.score=Math.min(10,Math.round(c.score/2+c.kinds.size));c.step=step;potentialCells.push(c)}}}
function renderPotential(c){const[x,y]=screenFor(c.lat,c.lon),[x2]=screenFor(c.lat,c.lon+c.step/2),r=clamp(Math.abs(x2-x),30,120),circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',r);circle.setAttribute('fill','#b47a3c22');circle.setAttribute('stroke','#b47a3c');circle.setAttribute('stroke-width','2');circle.setAttribute('stroke-dasharray','6 5');circle.onclick=()=>detailPotential(c);svg.appendChild(circle)}
function renderOverlay(){markers.innerHTML='';svg.innerHTML='';const visible=publicItems.filter(matchesFilter);for(const it of visible)if(it.geometry&&it.geometry.length>1)renderGeometry(it);if(selCategory==='Potansiyel'){for(const c of potentialCells)renderPotential(c)}else{if(zoom<=11){const cells=new Map();for(const it of visible){const[x,y]=screenFor(it.lat,it.lon),k=Math.floor(x/64)+':'+Math.floor(y/64);if(!cells.has(k))cells.set(k,[]);cells.get(k).push(it)}for(const list of cells.values())list.length>1?addCluster(list):addMarker(list[0])}else for(const it of visible)addMarker(it);for(const c of potentialCells)renderPotential(c)}updateStatus(visible.length)}
function updateStatus(visibleCount){document.getElementById('periodBadge').textContent=selPeriod==='Tümü'?'Tüm dönemler':selPeriod;document.getElementById('recordBadge').textContent=zoom<11?'Canlı envanter • zoom 11+':`${publicItems.length} çevre kaydı • ${visibleCount} görünür`;document.getElementById('potentialBadge').textContent=`Potansiyel alan ${potentialCells.length} • ≥1 km genelleştirme`;document.getElementById('counter').textContent=`Zoom ${zoom} • kayıt ${publicItems.length} • alan ${potentialCells.length}`;empty.style.display=zoom>=11&&!queryInFlight&&publicItems.length===0?'block':'none';if(empty.style.display==='block')empty.textContent='Bu görünümde açık veri kaydı bulunamadı veya kaynak yanıt vermedi. Haritayı biraz kaydırıp yeniden deneyin.'}
function render(){renderTiles();renderOverlay()}
function detailItem(it){const cfg=CAT[it.kind]||CAT.Diğer,t=it.tags,period=it.periods.length?it.periods.join(', '):'Etiketlenmemiş';const extra=['historic','archaeological_site','site_type','old_name','name:grc','name:ota','start_date','period','heritage','wikidata','wikipedia','description'].filter(k=>t[k]).map(k=>`<span class="tag">${esc(k)}: ${esc(t[k])}</span>`).join('');showSheet(`<h2>${esc(it.name)}</h2><div class="ok">${cfg.icon} ${esc(it.kind)} • kamuya açık kaynak</div><div class="card"><b>Dönem:</b> ${esc(period)}<br><b>Kaynak:</b> ${esc(it.src)}<br><b>Kayıt:</b> ${esc(it.id)}<br>${extra}</div><div class="warn">Bu kayıt açık/kamuya açık veriden gelir. Alanın hukuki statüsü ve arkeolojik doğruluğu ayrıca teyit edilmelidir.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function detailPotential(c){const tags=[...c.kinds].map(k=>`<span class="tag">${esc(k)}</span>`).join('');showSheet(`<h2>Bölgesel potansiyel / koruma bağlamı</h2><div class="ok">Skor ${c.score}/10 • ${c.n} açık gösterge • ${c.kinds.size} farklı tür</div><div class="card">${tags}</div><div class="warn">Bu alan en az yaklaşık 1 km ölçeğinde genelleştirilmiş modeldir. Kesin arkeolojik, sığınak veya saklama noktası değildir; koruma/araştırma önceliği bağlamıdır.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function showSheet(h){sheet.innerHTML=h;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}window.closeSheet=closeSheet;
function buildChips(){const p=document.getElementById('periods');p.innerHTML='';for(const x of PERIODS){const b=createEl('button');b.className='chip'+(x===selPeriod?' active':'');b.textContent=x;b.onclick=()=>{selPeriod=x;buildChips();renderOverlay()};p.appendChild(b)}const c=document.getElementById('categories');c.innerHTML='';for(const x of CATEGORIES){const b=createEl('button');b.className='chip'+(x===selCategory?' active':'');b.textContent=x;b.onclick=()=>{selCategory=x;buildChips();renderOverlay()};c.appendChild(b)}}
function legend(){document.getElementById('legend').innerHTML=`<span class="dot" style="background:${CAT.Yerleşim.color}"></span>Yerleşim / arkeoloji<br><span class="line" style="background:${CAT.Yol.color}"></span>Tarihî yol / güzergâh<br><span class="dot" style="background:${CAT.Konaklama.color}"></span>Han / kervansaray<br><span class="dot" style="background:${CAT.Savunma.color}"></span>Kale / savunma<br><span class="dot" style="background:${CAT.Geçiş.color}"></span>Köprü / geçit<br><span class="dot" style="background:${CAT.Su.color}"></span>Su yapısı / kaynak<br><span class="dot" style="background:${CAT.Mağara.color}"></span>Yayımlanmış mağara<br>◌ Potansiyel: bölgesel model`}
function buildQuery(){const b=bbox(),bb=`${b[2]},${b[1]},${b[0]},${b[3]}`,q=[],add=s=>q.push(s.replaceAll('{bb}',bb));add('nwr[historic=archaeological_site]({bb});');add('nwr[historic=ruins]({bb});');add('nwr[archaeological_site]({bb});');add('nwr[tourism=archaeological_site]({bb});');add('nwr[ruins=yes]({bb});');add('nwr[historic=road]({bb});');add('nwr[route:historic=yes]({bb});');add('nwr[historic=milestone]({bb});');add('nwr[historic=caravanserai]({bb});');add('nwr[historic=inn]({bb});');add('nwr[historic=bridge]({bb});');add('nwr[historic=aqueduct]({bb});');add('nwr[historic=castle]({bb});');add('nwr[historic=fort]({bb});');add('nwr[historic=fortification]({bb});');add('nwr[historic=city_gate]({bb});');add('nwr[historic=citywalls]({bb});');add('nwr[historic=monastery]({bb});');add('nwr[historic=manor]({bb});');add('nwr[historic=palace]({bb});');add('nwr[historic=wayside_shrine]({bb});');add('nwr[historic=wayside_cross]({bb});');add('node[mountain_pass=yes]({bb});');add('node[ford=yes]({bb});');add('node[natural=spring]({bb});');add('node[natural=cave_entrance]({bb});');if(zoom>=13)add('nwr[historic]({bb});');return`[out:json][timeout:28];(${q.join('')});out body geom;`}
function scheduleNearby(){clearTimeout(nearbyTimer);if(zoom<11){publicItems=[];potentialCells=[];lastNearby='';queryInFlight=false;loading.style.display='none';renderOverlay();return}nearbyTimer=setTimeout(loadNearby,650)}
function loadNearby(){const b=bbox(),key=b.map(x=>x.toFixed(3)).join(',')+':'+zoom;if(key===lastNearby||queryInFlight)return;lastNearby=key;queryInFlight=true;loading.style.display='block';empty.style.display='none';try{if(window.AndroidApp&&AndroidApp.fetchOverpass)AndroidApp.fetchOverpass(buildQuery());else throw new Error('Android veri köprüsü yok')}catch(e){onNativeOverpassError(e.message)}}
window.onNativeOverpass=function(raw){queryInFlight=false;loading.style.display='none';try{publicItems=parseElements(raw);buildPotential();renderOverlay()}catch(e){onNativeOverpassError('Veri ayrıştırma: '+e.message)}};
window.onNativeOverpassError=function(msg){queryInFlight=false;loading.style.display='none';publicItems=[];potentialCells=[];renderOverlay();empty.style.display='block';empty.textContent='Çevre verisi alınamadı: '+msg};
function doSearch(text){pendingSearch=text.trim();if(!pendingSearch)return;const local=publicItems.filter(x=>(x.name+' '+(x.tags.old_name||'')).toLocaleLowerCase('tr').includes(pendingSearch.toLocaleLowerCase('tr'))).slice(0,20);let h='<h2>Arama</h2>';for(const x of local)h+=`<div class="result" onclick="jump(${x.lat},${x.lon},14)"><b>${esc(x.name)}</b><div class="muted">${esc(x.kind)} • mevcut canlı kayıt</div></div>`;h+='<div class="muted">Güncel yer adları aranıyor…</div><button class="b" onclick="closeSheet()">Kapat</button>';showSheet(h);try{if(window.AndroidApp&&AndroidApp.geocode)AndroidApp.geocode(pendingSearch)}catch(e){onNativeGeocodeError(e.message)}}
window.onNativeGeocode=function(raw){let arr=[];try{arr=JSON.parse(raw)}catch(e){}const local=publicItems.filter(x=>(x.name+' '+(x.tags.old_name||'')).toLocaleLowerCase('tr').includes(pendingSearch.toLocaleLowerCase('tr'))).slice(0,20);let h='<h2>Arama</h2>';for(const x of local)h+=`<div class="result" onclick="jump(${x.lat},${x.lon},14)"><b>${esc(x.name)}</b><div class="muted">${esc(x.kind)} • tarihî/açık kayıt</div></div>`;for(const r of arr)h+=`<div class="result" onclick="jump(${+r.lat},${+r.lon},14)"><b>${esc(r.name||String(r.display_name||'').split(',')[0])}</b><div class="muted">${esc(r.display_name||'')}</div></div>`;if(!local.length&&!arr.length)h+='<p>Sonuç bulunamadı.</p>';h+='<button class="b" onclick="closeSheet()">Kapat</button>';showSheet(h)};
window.onNativeGeocodeError=function(msg){showSheet(`<h2>Arama</h2><div class="warn">Güncel yer araması alınamadı: ${esc(msg)}</div><button class="b" onclick="closeSheet()">Kapat</button>`)};
window.jump=(a,o,z)=>{closeSheet();setCenter(a,o,z)};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch(e.target.value)}});document.getElementById('loc').onclick=()=>{try{if(window.AndroidApp&&AndroidApp.requestLocation)AndroidApp.requestLocation()}catch(e){}};window.onNativeLocation=(a,o)=>setCenter(a,o,15);
document.getElementById('menu').onclick=()=>showSheet(`<h2>Canlı tarihî envanter</h2><div class="card"><b>Zoom 3–10:</b> güncel Türkiye referans haritası.<br><b>Zoom 11–12:</b> açık tarih/arkeoloji kayıtları ve kümeler.<br><b>Zoom 13+:</b> daha geniş historic=* taraması, adlar ve çizgi/alan geometrileri.</div><div class="card">Potansiyel katmanı tek bir gizli hedef üretmez. Yayınlanmış yerleşim, yol, konaklama, savunma, geçiş, su ve mağara göstergelerinin bir araya geldiği alanları en az yaklaşık 1 km ölçeğinde genelleştirir.</div><button class="b" onclick="jump(39,35.2,6)">Türkiye görünümü</button> <button class="b" onclick="closeSheet()">Kapat</button>`);
document.getElementById('zin').onclick=()=>setCenter(lat,lon,zoom+1);document.getElementById('zout').onclick=()=>setCenter(lat,lon,zoom-1);
const pointers=new Map();let dragStart=null,pinchStart=null;function parr(){return[...pointers.values()]}
map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);if(pointers.size===1)dragStart={x:e.clientX,y:e.clientY,c:centerWorld(),z:zoom};else if(pointers.size===2){const a=parr(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;pinchStart={dist:Math.hypot(dx,dy),zoom,lat,lon};dragStart=null}});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragStart){const p=parr()[0],dx=p.x-dragStart.x,dy=p.y-dragStart.y,[la,lo]=unproject(dragStart.c[0]-dx,dragStart.c[1]-dy,dragStart.z);lat=la;lon=lo;renderTiles();renderOverlay()}else if(pointers.size===2&&pinchStart){const a=parr(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y,dist=Math.max(20,Math.hypot(dx,dy)),target=clamp(Math.round(pinchStart.zoom+Math.log2(dist/pinchStart.dist)),3,18);if(target!==zoom){zoom=target;lat=pinchStart.lat;lon=pinchStart.lon;render()}}});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===0){dragStart=null;pinchStart=null;scheduleNearby()}else if(pointers.size===1){const p=parr()[0];dragStart={x:p.x,y:p.y,c:centerWorld(),z:zoom};pinchStart=null}}map.addEventListener('pointerup',endPointer);map.addEventListener('pointercancel',endPointer);window.addEventListener('resize',()=>{render();scheduleNearby()});buildChips();legend();render();
</script>
