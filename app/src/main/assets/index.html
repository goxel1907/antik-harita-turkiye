<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Harita Türkiye</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#dce8ec}.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#bdd8e4}.tiles,.overlay{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}.overlay{pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 2px 9px #0007}.marker.cur{width:30px;height:30px;border:3px solid #f4dfac;color:#fff;font-weight:900}.marker.pub{width:18px;height:18px;border:2px solid #e4f5ff;background:#1687ad}.marker.model{width:32px;height:32px;border:2px dashed #8d603c;background:#b47a3c66;color:#5a351a;font-weight:900}.label{position:absolute;transform:translate(8px,-50%);background:#12202de8;color:#fff;border:1px solid #557187;border-radius:7px;padding:2px 5px;font-size:10px;white-space:nowrap;pointer-events:none;max-width:180px;overflow:hidden;text-overflow:ellipsis}.top{position:fixed;z-index:50;top:8px;left:8px;right:8px;background:#101820f5;color:#fff;padding:10px;border-radius:18px;box-shadow:0 8px 28px #0008}.row{display:flex;gap:7px}.q{flex:1;min-width:80px;padding:11px;border-radius:11px;border:1px solid #566472;background:#0c1218;color:#fff;font-size:16px}.b{border:0;border-radius:11px;padding:10px 12px;background:#efc768;color:#1b1408;font-weight:850}.chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px}.chip{border:1px solid #596775;border-radius:22px;background:#26313c;color:#fff;padding:8px 13px;white-space:nowrap;font-size:14px}.chip.active{background:#f1c766;color:#1d1407;border-color:#f7da99;font-weight:900}.status{display:flex;gap:7px;overflow:auto;margin-top:8px}.badge{white-space:nowrap;background:#202a34;color:#c9d2da;border-radius:10px;padding:4px 8px;font-size:12px}.zoom{position:fixed;z-index:40;left:12px;top:310px;display:flex;flex-direction:column}.zoom button{width:50px;height:50px;border:1px solid #8696a0;background:#fff;font-size:30px;font-weight:900}.zoom button:first-child{border-radius:8px 8px 0 0}.zoom button:last-child{border-radius:0 0 8px 8px}.sheet{position:fixed;z-index:80;left:0;right:0;bottom:0;display:none;max-height:78vh;overflow:auto;background:#101821;color:#fff;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -12px 35px #0009}.sheet.open{display:block}.sheet h2{margin:0 0 12px}.card,.result{padding:12px;border:1px solid #344656;border-radius:13px;margin:9px 0;background:#17222c}.muted{color:#9eabb7;font-size:12px;margin-top:4px}.tag{display:inline-block;padding:3px 7px;border-radius:9px;background:#2a3440;font-size:11px;margin:3px 4px 0 0}.ok{background:#18372c;color:#bff4d4;border:1px solid #3d7a61;padding:8px;border-radius:10px;font-size:12px}.warn{background:#4b3521;color:#ffe0a2;border:1px solid #8f693a;padding:9px;border-radius:11px;font-size:12px;margin-top:10px}.legend{position:fixed;z-index:35;left:10px;bottom:12px;background:#121921e9;color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.7}.counter{position:fixed;z-index:35;right:10px;bottom:12px;background:#101820df;color:#fff;padding:7px 9px;border-radius:10px;font-size:11px}.loading{position:fixed;z-index:60;left:50%;top:245px;transform:translateX(-50%);background:#101820e8;color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;display:none}
</style>
</head>
<body>
<div id="map" class="map"><div id="tiles" class="tiles"></div><div id="overlay" class="overlay"></div></div>
<div class="top"><div class="row"><input id="q" class="q" placeholder="İl, ilçe, mahalle, köy veya antik ad"><button id="loc" class="b">📍</button><button id="menu" class="b">☰</button></div><div id="periods" class="chips"></div><div id="evidence" class="chips"></div><div class="status"><span class="badge"><span id="count">0</span> kaynaklı kayıt</span><span class="badge" id="periodLabel">Tüm dönemler</span><span class="badge" id="zoomLabel">Zoom 11+ ayrıntı</span></div></div>
<div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<div id="sheet" class="sheet"></div><div id="loading" class="loading">Yakın çevre tarihî verileri yükleniyor…</div>
<div class="legend">● Kaynaklı tarihî kayıt<br>● Kamu tarih/arkeoloji kaydı<br>◌ Bölgesel koruma bağlamı</div><div id="counter" class="counter">Zoom 6</div>
<script>
const PERIODS={Tümü:'#b48a42',Helenistik:'#b5792a',Roma:'#a64038',Bizans:'#704fb4',Selçuklu:'#2f8063',Osmanlı:'#2d6e99',Hitit:'#8f5b35',Frig:'#7a6539',Urartu:'#4b7080',Neolitik:'#6a8b45'};
const EVIDENCE=['Tümü','Belgelenmiş','Literatür','Kamu','Model'];
const curated=[
['Ephesos','Efes','İzmir',37.939,27.341,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Pergamon','Bergama','İzmir',39.1325,27.1841,['Helenistik','Roma','Bizans'],'Kent','Literatür'],['Sardis','Sart','Manisa',38.4887,28.0402,['Helenistik','Roma','Bizans'],'Antik kent','Literatür'],['Troia','Troya','Çanakkale',39.9575,26.2389,['Helenistik','Roma'],'Yerleşim','Belgelenmiş'],['Hierapolis','Hierapolis','Denizli',37.925,29.125,['Helenistik','Roma','Bizans'],'Kent / nekropol','Belgelenmiş'],['Aphrodisias','Afrodisias','Aydın',37.7088,28.7234,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Miletos','Milet','Aydın',37.5308,27.2784,['Helenistik','Roma','Bizans'],'Liman kenti','Literatür'],['Ancyra','Ankara','Ankara',39.938,32.864,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Nikaia','İznik','Bursa',40.429,29.721,['Roma','Bizans','Osmanlı'],'Surlu kent','Literatür'],['Constantinopolis','İstanbul','İstanbul',41.008,28.978,['Roma','Bizans','Osmanlı'],'Başkent','Literatür'],['Perge','Perge','Antalya',36.961,30.853,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Aspendos','Aspendos','Antalya',36.939,31.172,['Roma','Bizans'],'Antik kent','Belgelenmiş'],['Side','Side','Antalya',36.767,31.39,['Helenistik','Roma','Bizans'],'Liman kenti','Belgelenmiş'],['Sagalassos','Sagalassos','Burdur',37.678,30.519,['Helenistik','Roma','Bizans'],'Dağ kenti','Belgelenmiş'],['Laodikeia','Laodikeia','Denizli',37.836,29.108,['Helenistik','Roma','Bizans'],'Antik kent','Belgelenmiş'],['Aizanoi','Aizanoi','Kütahya',39.201,29.611,['Roma','Bizans'],'Antik kent','Belgelenmiş'],['Zeugma','Zeugma','Gaziantep',37.058,37.865,['Helenistik','Roma'],'Antik kent','Belgelenmiş'],['Amida','Diyarbakır','Diyarbakır',37.914,40.23,['Roma','Bizans','Selçuklu','Osmanlı'],'Surlu kent','Literatür'],['Dara','Dara','Mardin',37.179,40.955,['Roma','Bizans'],'Sınır kenti','Belgelenmiş'],['Hasankeyf','Hasankeyf','Batman',37.714,41.414,['Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Belgelenmiş'],['Ahlat','Ahlat','Bitlis',38.75,42.48,['Selçuklu','Osmanlı'],'Tarihî kent','Belgelenmiş'],['Ikonion','Konya','Konya',37.87,32.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Caesarea','Kayseri','Kayseri',38.72,35.49,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Sebasteia','Sivas','Sivas',39.75,37.02,['Roma','Bizans','Selçuklu','Osmanlı'],'Tarihî kent','Literatür'],['Antiochia','Antakya','Hatay',36.202,36.161,['Helenistik','Roma','Bizans'],'Metropol','Literatür'],['Hattusa','Boğazkale','Çorum',40.019,34.615,['Hitit'],'Başkent','Belgelenmiş'],['Gordion','Yassıhöyük','Ankara',39.654,31.994,['Frig'],'Başkent / höyük','Belgelenmiş'],['Tuşpa','Van Kalesi','Van',38.501,43.341,['Urartu'],'Başkent / kale','Belgelenmiş'],['Çatalhöyük','Çatalhöyük','Konya',37.667,32.826,['Neolitik'],'Yerleşim','Belgelenmiş']];
let lat=39,lon=35.2,zoom=6,selPeriod='Tümü',selEvidence='Tümü',publicItems=[],potentialCells=[];const TS=256;
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet'),loading=document.getElementById('loading');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const world=z=>TS*Math.pow(2,z);
function project(la,lo,z){const s=world(z),x=(lo+180)/360*s,sn=Math.sin(clamp(la,-85,85)*Math.PI/180),y=(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s;return[x,y]}
function unproject(x,y,z){const s=world(z),lo=x/s*360-180,n=Math.PI-2*Math.PI*y/s,la=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));return[la,lo]}
function centerWorld(){return project(lat,lon,zoom)}function screenFor(la,lo){const c=centerWorld(),p=project(la,lo,zoom);return[p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function renderTiles(){tiles.innerHTML='';const c=centerWorld(),left=c[0]-innerWidth/2,top=c[1]-innerHeight/2,minX=Math.floor(left/TS)-1,maxX=Math.floor((left+innerWidth)/TS)+1,minY=Math.floor(top/TS)-1,maxY=Math.floor((top+innerHeight)/TS)+1,n=Math.pow(2,zoom);for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n,img=document.createElement('img');img.className='tile';img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*TS-left)+'px';img.style.top=(y*TS-top)+'px';tiles.appendChild(img)}}
function addMarker(la,lo,cls,color,text,cb){const[x,y]=screenFor(la,lo);if(x<-50||x>innerWidth+50||y<-50||y>innerHeight+50)return;const d=document.createElement('div');d.className='marker '+cls;d.style.left=x+'px';d.style.top=y+'px';if(color)d.style.background=color;d.textContent=text||'';d.onclick=cb;overlay.appendChild(d)}
function addLabel(la,lo,text){const[x,y]=screenFor(la,lo);if(x<0||x>innerWidth||y<0||y>innerHeight)return;const d=document.createElement('div');d.className='label';d.style.left=x+'px';d.style.top=y+'px';d.textContent=text;overlay.appendChild(d)}
function showSheet(h){sheet.innerHTML=h;sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}window.closeSheet=closeSheet;
function detailCur(r){showSheet(`<h2>${r[0]}</h2><div class="ok">${r[6]} • ${r[7]}</div><div class="card"><b>Güncel ad:</b> ${r[1]}<br><b>Mevki:</b> ${r[2]}<br><b>Dönem:</b> ${r[5].join(', ')}</div><div class="warn">Konum temsil noktasıdır; kaynak hassasiyeti ayrıca doğrulanmalıdır.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function detailPublic(it){const extra=['historic','archaeological_site','site_type','old_name','start_date','period','description'].filter(k=>it.tags[k]).map(k=>`<span class="tag">${k}: ${it.tags[k]}</span>`).join('');showSheet(`<h2>${it.name}</h2><div class="ok">${it.kind} • kamuya açık kayıt</div><div class="card"><b>Kaynak:</b> ${it.src}<br>${extra}</div><div class="warn">Açık harita kaydıdır; akademik doğrulama ayrıca gerekir.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function detailPotential(c){const tags=[...c.kinds].map(k=>`<span class="tag">${k}</span>`).join('');showSheet(`<h2>Potansiyel tarihî kullanım / koruma bağlamı</h2><div class="ok">Bağlam skoru ${c.score}/10 • ${c.n} gösterge</div><div class="card">${tags}</div><div class="warn">Bölgesel koruma/araştırma bağlamıdır; kesin arkeolojik veya saklama noktası değildir.</div><button class="b" onclick="closeSheet()">Kapat</button>`)}
function renderOverlay(){overlay.innerHTML='';let n=0;for(const r of curated){if(selPeriod!=='Tümü'&&!r[5].includes(selPeriod))continue;if(selEvidence!=='Tümü'&&r[7]!==selEvidence)continue;n++;addMarker(r[3],r[4],'cur',selPeriod==='Tümü'?PERIODS[r[5][0]]:PERIODS[selPeriod],'●',()=>detailCur(r));if(zoom>=10)addLabel(r[3],r[4],r[0])}if(selEvidence==='Tümü'||selEvidence==='Kamu')for(const it of publicItems){addMarker(it.lat,it.lon,'pub',null,'',()=>detailPublic(it));if(zoom>=13)addLabel(it.lat,it.lon,it.name)}if(selEvidence==='Tümü'||selEvidence==='Model')for(const c of potentialCells)addMarker(c.lat,c.lon,'model',null,'◌',()=>detailPotential(c));document.getElementById('count').textContent=n;document.getElementById('periodLabel').textContent=selPeriod;document.getElementById('counter').textContent=`Zoom ${zoom} • çevre ${publicItems.length} • model ${potentialCells.length}`}
function render(){renderTiles();renderOverlay();document.getElementById('zoomLabel').textContent=zoom<11?'Zoom 11+ çevre ayrıntısı':`${publicItems.length} çevre kaydı`;if(zoom>=11)scheduleNearby()}
function setCenter(la,lo,z){lat=clamp(la,-85,85);lon=lo;zoom=clamp(Math.round(z),3,18);render()}
document.getElementById('zin').onclick=()=>setCenter(lat,lon,zoom+1);document.getElementById('zout').onclick=()=>setCenter(lat,lon,zoom-1);
const pointers=new Map();let dragStart=null,pinchStart=null;
function pointerArray(){return [...pointers.values()]}
map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);if(pointers.size===1){dragStart={x:e.clientX,y:e.clientY,c:centerWorld(),z:zoom}}else if(pointers.size===2){const a=pointerArray(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;pinchStart={dist:Math.hypot(dx,dy),zoom,lat,lon};dragStart=null}});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragStart){const p=pointerArray()[0],dx=p.x-dragStart.x,dy=p.y-dragStart.y,[la,lo]=unproject(dragStart.c[0]-dx,dragStart.c[1]-dy,dragStart.z);lat=la;lon=lo;renderTiles();renderOverlay()}else if(pointers.size===2&&pinchStart){const a=pointerArray(),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y,dist=Math.max(20,Math.hypot(dx,dy)),delta=Math.log2(dist/pinchStart.dist),target=clamp(Math.round(pinchStart.zoom+delta),3,18);if(target!==zoom){zoom=target;lat=pinchStart.lat;lon=pinchStart.lon;render()}}});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===0){dragStart=null;pinchStart=null;scheduleNearby()}else if(pointers.size===1){const p=pointerArray()[0];dragStart={x:p.x,y:p.y,c:centerWorld(),z:zoom};pinchStart=null}}
map.addEventListener('pointerup',endPointer);map.addEventListener('pointercancel',endPointer);map.addEventListener('wheel',e=>{e.preventDefault();setCenter(lat,lon,zoom+(e.deltaY<0?1:-1))},{passive:false});
function buildChips(){const p=document.getElementById('periods');p.innerHTML='';Object.keys(PERIODS).forEach(x=>{const b=document.createElement('button');b.className='chip'+(x===selPeriod?' active':'');b.textContent=x;b.onclick=()=>{selPeriod=x;buildChips();renderOverlay()};p.appendChild(b)});const ev=document.getElementById('evidence');ev.innerHTML='';EVIDENCE.forEach(x=>{const b=document.createElement('button');b.className='chip'+(x===selEvidence?' active':'');b.textContent=x;b.onclick=()=>{selEvidence=x;buildChips();renderOverlay()};ev.appendChild(b)})}
async function searchPlace(q){q=q.trim();if(!q)return;const local=curated.filter(r=>(r[0]+' '+r[1]+' '+r[2]).toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));loading.style.display='block';let remote=[];try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=tr&addressdetails=1&q='+encodeURIComponent(q);const res=await fetch(u,{headers:{'Accept-Language':'tr'}});if(res.ok)remote=await res.json()}catch(e){}loading.style.display='none';let h='<h2>Arama</h2>';local.forEach(r=>h+=`<div class="result" onclick="jump(${r[3]},${r[4]},13)"><b>${r[0]} — ${r[1]}</b><div class="muted">${r[2]} • tarihî kayıt</div></div>`);remote.forEach(r=>h+=`<div class="result" onclick="jump(${+r.lat},${+r.lon},14)"><b>${(r.name||r.display_name.split(',')[0]).replace(/</g,'&lt;')}</b><div class="muted">${r.display_name.replace(/</g,'&lt;')}</div></div>`);if(!local.length&&!remote.length)h+='<p>Sonuç bulunamadı.</p>';h+='<button class="b" onclick="closeSheet()">Kapat</button>';showSheet(h)}
window.jump=(a,o,z)=>{closeSheet();setCenter(a,o,z)};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPlace(e.target.value)}});
document.getElementById('loc').onclick=()=>{try{if(window.AndroidApp&&AndroidApp.requestLocation)AndroidApp.requestLocation()}catch(e){}};window.onNativeLocation=(a,o)=>setCenter(a,o,15);
document.getElementById('menu').onclick=()=>showSheet(`<h2>Harita ayrıntısı</h2><div class="card"><b>Yakınlaştırma:</b> iki parmak pinch veya +/−<br><b>Zoom 11–12:</b> bölgesel tarih/arkeoloji kayıtları<br><b>Zoom 13–14:</b> daha yoğun ad/yer etiketi<br><b>Zoom 15+:</b> yakın çevrede yayımlanmış detaylar</div><div class="card">Canlı açık veri: arkeolojik alan/harabe, tarihî yol, han-kervansaray, köprü/ford, kale/fort, geçit, kaynak ve yayımlanmış mağara kayıtları.</div><button class="b" onclick="jump(39,35.2,6)">Türkiye görünümü</button> <button class="b" onclick="closeSheet()">Kapat</button>`);
function classify(t){const h=(t.historic||'').toLowerCase();if(h==='road'||t['route:historic']==='yes')return['Tarihî yol',4];if(h==='archaeological_site'||h==='ruins'||t.archaeological_site||t.tourism==='archaeological_site')return['Arkeoloji/yerleşim',4];if(h==='caravanserai'||h==='inn'||/han|kervansaray|caravan/i.test((t.name||'')+' '+(t.description||'')))return['Han/konaklama',4];if(h==='bridge'||t.ford==='yes'||t.bridge==='yes')return['Geçiş/köprü',3];if(t.mountain_pass==='yes')return['Geçit',3];if(t.natural==='spring'||t.amenity==='drinking_water')return['Su kaynağı',2];if(h==='castle'||h==='fort'||h==='fortification'||t.fortification_type)return['Savunma yapısı',4];if(t.natural==='cave_entrance')return['Yayımlanmış mağara',2];return['Tarihî bağlam',1]}
let nearbyTimer=null,lastNearby='';function scheduleNearby(){clearTimeout(nearbyTimer);if(zoom<11){publicItems=[];potentialCells=[];renderOverlay();return}nearbyTimer=setTimeout(loadNearby,600)}
function bbox(){const c=centerWorld(),nw=unproject(c[0]-innerWidth/2,c[1]-innerHeight/2,zoom),se=unproject(c[0]+innerWidth/2,c[1]+innerHeight/2,zoom);return[nw[0],nw[1],se[0],se[1]]}
async function loadNearby(){const b=bbox(),key=b.map(x=>x.toFixed(3)).join(',')+':'+zoom;if(key===lastNearby)return;lastNearby=key;loading.style.display='block';const bb=`${b[2]},${b[1]},${b[0]},${b[3]}`;const q=`[out:json][timeout:22];(nwr[historic=archaeological_site](${bb});nwr[historic=ruins](${bb});nwr[archaeological_site](${bb});nwr[tourism=archaeological_site](${bb});nwr[historic=road](${bb});nwr[route:historic=yes](${bb});nwr[historic=caravanserai](${bb});nwr[historic=inn](${bb});nwr[historic=bridge](${bb});nwr[historic=castle](${bb});nwr[historic=fort](${bb});node[mountain_pass=yes](${bb});node[ford=yes](${bb});node[natural=spring](${bb});node[amenity=drinking_water](${bb});node[natural=cave_entrance](${bb}););out center tags 700;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();publicItems=(j.elements||[]).map(el=>{const a=el.lat??el.center?.lat,o=el.lon??el.center?.lon,t=el.tags||{},cl=classify(t);return a==null?null:{lat:a,lon:o,name:t.name||t['name:tr']||t.old_name||cl[0],kind:cl[0],weight:cl[1],src:`OSM ${el.type} ${el.id}`,tags:t}}).filter(Boolean);buildPotential()}catch(e){publicItems=[];potentialCells=[]}loading.style.display='none';renderOverlay()}
function buildPotential(){const step=zoom>=15?.008:zoom>=14?.012:zoom>=13?.02:zoom>=12?.035:.055,cells=new Map();for(const x of publicItems){const k=Math.floor(x.lat/step)+':'+Math.floor(x.lon/step);if(!cells.has(k))cells.set(k,{lat:0,lon:0,n:0,score:0,kinds:new Set(),items:[]});const c=cells.get(k);c.lat+=x.lat;c.lon+=x.lon;c.n++;c.score+=x.weight;c.kinds.add(x.kind);c.items.push(x)}potentialCells=[];cells.forEach(c=>{if(c.n>=2&&c.kinds.size>=2){c.lat/=c.n;c.lon/=c.n;c.score=Math.min(10,c.score+c.kinds.size-1);potentialCells.push(c)}})}
window.addEventListener('resize',render);buildChips();render();
</script>
</body></html>
