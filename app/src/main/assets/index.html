<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Antik Harita Türkiye</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0d1117}.top{position:fixed;z-index:1200;top:8px;left:8px;right:8px;background:#101720f2;color:#fff;padding:10px;border-radius:16px;box-shadow:0 8px 26px #0007}.row{display:flex;gap:7px;align-items:center}.q{flex:1;min-width:90px;padding:11px;border-radius:11px;border:1px solid #465365;background:#0c1219;color:#fff;font-size:15px}.b{padding:10px 12px;border:0;border-radius:11px;background:#e8bd65;color:#17120a;font-weight:800;touch-action:manipulation}.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}.c{white-space:nowrap;padding:8px 11px;border-radius:22px;background:#26313d;color:#fff;border:1px solid #4b5968;font-size:14px}.c.active{background:#e8bd65;color:#17120a;border-color:#f5d58f;font-weight:800}.status{display:flex;gap:8px;margin-top:7px;font-size:12px;color:#b8c2cc;overflow:auto}.badge{white-space:nowrap;background:#202a35;padding:4px 7px;border-radius:10px}.sheet{position:fixed;z-index:1600;bottom:0;left:0;right:0;background:#121922;color:#fff;padding:18px;border-radius:22px 22px 0 0;max-height:74vh;overflow:auto;display:none;box-shadow:0 -12px 35px #0008}.sheet.open{display:block}.sheet h2{margin:0 0 14px}.detailGrid{display:grid;grid-template-columns:105px 1fr;gap:7px 10px;font-size:14px}.k{color:#92a2b2}.v{font-weight:650}.muted{color:#9aa8b7;font-size:12px}.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toolGrid .b{min-height:48px}.layerRow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1b2530;border:1px solid #344353;border-radius:12px;padding:11px;margin:8px 0}.switch{min-width:86px}.leaflet-control-zoom{margin-top:180px!important}.leaflet-popup-content{margin:11px 13px}.markerName{font-weight:800;font-size:15px}.markerMeta{font-size:12px;color:#566575}.legend{position:fixed;z-index:1150;left:10px;bottom:14px;background:#111821e8;color:#fff;padding:8px 10px;border-radius:12px;font-size:11px;display:none}.legend.on{display:block}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.line{display:inline-block;width:22px;border-top:3px solid currentColor;margin-right:5px;vertical-align:middle}.dash{border-top-style:dashed}.leaflet-tooltip{font-size:11px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="row"><input id="q" class="q" placeholder="Antik ad, güncel ad, il, yol, han"><button id="locBtn" class="b">📍</button><button id="toolsBtn" class="b">☰ Katmanlar</button></div>
  <div id="periods" class="chips"></div>
  <div class="status"><span class="badge"><span id="count">0</span> yerleşim</span><span class="badge" id="activeLabel">Tüm dönemler</span><span class="badge">Kamuya açık / yaklaşık rota</span></div>
</div>
<div id="sheet" class="sheet"></div>
<div id="legend" class="legend"><div><span class="line" style="color:#b66"></span>Tarihî yol</div><div><span class="dot" style="background:#d79b38"></span>Han / durak</div><div><span class="dot" style="background:#63a7d8"></span>Köprü / geçit</div><div><span class="line dash" style="color:#9067c6"></span>Dar araştırma koridoru</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
try{if(window.AndroidApp&&AndroidApp.setScreenshotProtection)AndroidApp.setScreenshotProtection(false)}catch(e){}
const sites=[
['Ephesos','Efes','Selçuk / İzmir','Helenistik|Roma|Bizans','Antik kent / liman',37.939,27.341,'MÖ 10. yy–MS 15. yy'],['Pergamon','Bergama','Bergama / İzmir','Helenistik|Roma|Bizans',39.1325,27.1841,'Antik kent / akropol'],['Sardis','Sart / Sardes','Salihli / Manisa','Lidya|Helenistik|Roma|Bizans',38.4887,28.0402,'Başkent / antik kent'],['Troia','Troya','Ezine / Çanakkale','Tunç Çağı|Helenistik|Roma','Katmanlı yerleşim'],['Hierapolis','Hierapolis','Pamukkale / Denizli','Helenistik|Roma|Bizans','Antik kent / nekropol'],['Aphrodisias','Afrodisias','Karacasu / Aydın','Helenistik|Roma|Bizans','Antik kent'],['Miletos','Milet','Didim / Aydın','Arkaik|Helenistik|Roma|Bizans','Antik kent / liman'],['Hattusa','Hattuşa','Boğazkale / Çorum','Hitit','Başkent / surlu kent'],['Gordion','Gordion','Polatlı / Ankara','Frig|Helenistik|Roma','Yerleşim'],['Ancyra','Ankara','Ankara','Roma|Bizans|Selçuklu|Osmanlı','Tarihî kent'],['Nikaia','İznik','Bursa','Roma|Bizans|Osmanlı','Surlu kent'],['Ani','Ani','Kars','Ortaçağ|Selçuklu','Ortaçağ kenti'],['Tushpa','Tuşpa / Van Kalesi','Van','Urartu','Kale / başkent'],['Zeugma','Zeugma','Nizip / Gaziantep','Helenistik|Roma','Antik kent'],['Amida','Diyarbakır','Diyarbakır','Roma|Bizans|Selçuklu|Osmanlı','Tarihî kent'],['Perge','Perge','Aksu / Antalya','Helenistik|Roma|Bizans','Antik kent'],['Aspendos','Aspendos','Serik / Antalya','Roma|Bizans','Antik kent'],['Side','Side','Manavgat / Antalya','Helenistik|Roma|Bizans','Antik kent'],['Patara','Patara','Kaş / Antalya','Likya|Roma|Bizans','Antik kent / liman'],['Xanthos','Ksantos','Kaş / Antalya','Likya|Helenistik|Roma|Bizans','Antik kent'],['Sagalassos','Sagalassos','Ağlasun / Burdur','Helenistik|Roma|Bizans','Antik kent'],['Göbekli Tepe','Göbekli Tepe','Şanlıurfa','Neolitik','Tarihöncesi alan'],['Aizanoi','Aizanoi','Çavdarhisar / Kütahya','Roma|Bizans','Antik kent'],['Laodikeia','Laodikeia','Denizli','Helenistik|Roma|Bizans','Antik kent'],['Antiochia','Antakya','Hatay','Helenistik|Roma|Bizans','Metropol kent'],['Dara','Dara','Mardin','Roma|Bizans','Sınır kenti'],['Hasankeyf','Hasankeyf','Batman','Roma|Bizans|Artuklu|Selçuklu|Osmanlı','Tarihî yerleşim'],['Kültepe','Kaneş / Neşa','Kayseri','Asur Ticaret Kolonileri|Hitit','Höyük / karum'],['Assos','Assos','Ayvacık / Çanakkale','Arkaik|Helenistik|Roma|Bizans','Antik kent'],['Alexandria Troas','Alexandria Troas','Ezine / Çanakkale','Helenistik|Roma|Bizans','Antik kent / liman'],['Tralleis','Tralleis','Aydın','Helenistik|Roma|Bizans','Antik kent'],['Magnesia ad Maeandrum','Magnesia','Germencik / Aydın','Helenistik|Roma|Bizans','Antik kent']
];
const periods=['Tümü','Roma','Bizans','Helenistik','Hitit','Urartu','Likya','Frig','Selçuklu','Osmanlı','Neolitik'];
const stops=[
['Sultan Hanı','Sultanhanı / Aksaray','Selçuklu kervansarayı',38.247,33.548,'Selçuklu'],['Ağzıkara Han','Aksaray','Selçuklu kervansarayı',38.381,33.993,'Selçuklu'],['Alay Han','Aksaray','Selçuklu hanı / yol durağı',38.176,34.187,'Selçuklu'],['Sarıhan','Avanos / Nevşehir','Selçuklu kervansarayı',38.722,34.911,'Selçuklu'],['Karatay Han','Kayseri çevresi','Selçuklu kervansarayı',38.756,35.94,'Selçuklu'],['Zazadin Han','Konya','Selçuklu kervansarayı',38.085,32.641,'Selçuklu'],['Horozlu Han','Konya','Selçuklu kervansarayı',38.052,32.42,'Selçuklu'],['Kızılören Han','Konya–Beyşehir yolu','Selçuklu kervansarayı',37.869,32.169,'Selçuklu'],['Altınapa Hanı','Konya–Beyşehir yolu','Selçuklu hanı',37.883,32.097,'Selçuklu'],['Evdir Han','Döşemealtı / Antalya','Selçuklu kervansarayı',37.094,30.606,'Selçuklu'],['Kırkgöz Han','Döşemealtı / Antalya','Selçuklu kervansarayı',37.091,30.557,'Selçuklu'],['Susuz Han','Bucak / Burdur','Selçuklu kervansarayı',37.421,30.528,'Selçuklu'],['İncir Han','Bucak / Burdur','Selçuklu kervansarayı',37.492,30.59,'Selçuklu'],['Akhan','Denizli','Selçuklu kervansarayı',37.866,29.173,'Selçuklu']
];
const bridges=[
['Malabadi Köprüsü','Silvan / Diyarbakır','Artuklu köprüsü',38.157,41.203,'Artuklu'],['Taşköprü','Adana','Roma kökenli tarihî köprü',36.987,35.334,'Roma'],['Justinianus Köprüsü','Serdivan / Sakarya','Bizans köprüsü',40.756,30.365,'Bizans'],['Irgandı Köprüsü','Bursa','Osmanlı çarşılı köprü',40.182,29.073,'Osmanlı'],['Kırkgöz Kemeri / geçiş hattı','Antalya kuzeyi','Tarihî geçiş koridoru',37.09,30.58,'Selçuklu']
];
const roads=[
{name:'Via Sebaste / Pisidia koridoru',period:'Roma',note:'Roma döneminde Pamphylia–Pisidia bağlantısının yaklaşık kamuya açık koridoru',pts:[[36.96,30.85],[37.10,30.60],[37.42,30.53],[37.68,30.52],[38.05,30.17],[38.02,31.01]]},
{name:'Anadolu Kraliyet Yolu batı kolu',period:'Pers|Helenistik|Roma',note:'Sardis–İç Anadolu doğrultusunun genel tarihî koridoru; çizgi birebir yol izi değildir',pts:[[38.49,28.04],[38.75,29.40],[39.20,30.70],[39.65,31.99],[39.94,32.86],[39.70,34.60]]},
{name:'Konya–Aksaray–Kayseri Selçuklu kervan yolu',period:'Selçuklu',note:'Kamuya açık han ve kervansarayları bağlayan yaklaşık tarihî ulaşım koridoru',pts:[[37.87,32.49],[38.05,32.42],[38.09,32.64],[38.25,33.55],[38.38,33.99],[38.72,34.91],[38.75,35.49]]},
{name:'Antalya–Burdur–Konya kervan yolu',period:'Selçuklu',note:'Evdir/Kırkgöz–Susuz/İncir–Konya hattının yaklaşık koridoru',pts:[[36.90,30.70],[37.09,30.58],[37.42,30.53],[37.49,30.59],[37.68,30.52],[37.87,32.49]]},
{name:'Ege iç hat / Menderes koridoru',period:'Helenistik|Roma|Bizans',note:'Miletos–Magnesia–Tralleis–Laodikeia doğrultusunun yaklaşık tarihî ulaşım ekseni',pts:[[37.53,27.28],[37.85,27.53],[37.86,27.85],[37.84,29.11],[37.93,29.12]]},
{name:'Troas kıyı ve iç bağlantısı',period:'Helenistik|Roma|Bizans',note:'Assos–Alexandria Troas–Troia doğrultusunun yaklaşık tarihî koridoru',pts:[[39.49,26.34],[39.75,26.16],[39.96,26.24]]},
{name:'Yukarı Mezopotamya doğu-batı hattı',period:'Roma|Bizans|Artuklu|Selçuklu',note:'Dara–Mardin–Diyarbakır–Hasankeyf yönündeki genel tarihî geçiş koridoru',pts:[[37.18,40.96],[37.31,40.74],[37.91,40.23],[38.16,41.20],[37.71,41.41]]}
];
const corridors=[
{name:'Troas kıyı koridoru',pts:[[39.48,26.28],[39.75,26.10],[40.00,26.18]],width:7000},
{name:'Menderes tarihî ulaşım koridoru',pts:[[37.50,27.25],[37.84,27.55],[37.86,27.85],[37.84,29.10]],width:9000},
{name:'Konya–Aksaray kervan koridoru',pts:[[37.87,32.49],[38.10,33.05],[38.25,33.55],[38.38,33.99]],width:8000},
{name:'Antalya–Burdur geçiş koridoru',pts:[[37.09,30.58],[37.42,30.53],[37.49,30.59],[37.68,30.52]],width:6500}
];
const map=L.map('map',{zoomControl:true,tap:true}).setView([39,35],6);const street=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'});L.control.layers({'Standart':street,'Topoğrafya':topo},null,{position:'bottomright'}).addTo(map);
const siteLayer=L.layerGroup().addTo(map),roadLayer=L.layerGroup(),stopLayer=L.layerGroup(),bridgeLayer=L.layerGroup(),corridorLayer=L.layerGroup();let active='';
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPeriods(){const box=document.getElementById('periods');box.innerHTML='';periods.forEach(p=>{const b=document.createElement('button');b.className='c'+((p==='Tümü'&&!active)||p===active?' active':'');b.textContent=p;b.dataset.period=p==='Tümü'?'':p;b.addEventListener('click',()=>{active=b.dataset.period;document.getElementById('activeLabel').textContent=active||'Tüm dönemler';renderPeriods();drawSites()});box.appendChild(b)})}
function drawSites(){siteLayer.clearLayers();const q=(document.getElementById('q').value||'').toLowerCase();let n=0;sites.forEach(s=>{const txt=s.join(' ').toLowerCase();if((active&&!s[3].includes(active))||(q&&!txt.includes(q)))return;n++;L.circleMarker([s[5],s[6]],{radius:6,weight:2,fillOpacity:.82}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<br><span class="muted">'+esc(s[2])+'</span><hr>'+esc(s[3])+'<br>'+esc(s[4])).addTo(siteLayer)});document.getElementById('count').textContent=n}
function drawRoads(){roadLayer.clearLayers();roads.forEach(r=>L.polyline(r.pts,{weight:5,opacity:.72}).bindPopup('<b>'+esc(r.name)+'</b><br>'+esc(r.period)+'<br><span class="muted">'+esc(r.note)+'</span>').bindTooltip(r.name).addTo(roadLayer))}
function drawStops(){stopLayer.clearLayers();stops.forEach(s=>L.circleMarker([s[3],s[4]],{radius:7,weight:2,fillOpacity:.9}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<hr>'+esc(s[2])+'<br>'+esc(s[5])).bindTooltip(s[0]).addTo(stopLayer))}
function drawBridges(){bridgeLayer.clearLayers();bridges.forEach(s=>L.circleMarker([s[3],s[4]],{radius:7,weight:2,fillOpacity:.9}).bindPopup('<b>'+esc(s[0])+'</b><br>'+esc(s[1])+'<hr>'+esc(s[2])+'<br>'+esc(s[5])).bindTooltip(s[0]).addTo(bridgeLayer))}
function drawCorridors(){corridorLayer.clearLayers();corridors.forEach(c=>{L.polyline(c.pts,{weight:12,opacity:.18,dashArray:'8 10'}).bindPopup('<b>'+esc(c.name)+'</b><br><span class="muted">Yaklaşık araştırma/ulaşım koridoru; tekil hedef veya kazı noktası değildir.</span>').addTo(corridorLayer)})}
function toggle(layer,drawFn,btn){if(map.hasLayer(layer)){map.removeLayer(layer);btn.textContent='Göster'}else{drawFn();layer.addTo(map);btn.textContent='Gizle'}syncLegend()}
function syncLegend(){document.getElementById('legend').classList.toggle('on',map.hasLayer(roadLayer)||map.hasLayer(stopLayer)||map.hasLayer(bridgeLayer)||map.hasLayer(corridorLayer))}
function tools(){const sh=document.getElementById('sheet');sh.innerHTML='<h2>Tarihî katmanlar</h2><div class="layerRow"><div><b>🛣 Tarihî yollar</b><div class="muted">Roma, Helenistik, Bizans ve Selçuklu yaklaşık koridorları</div></div><button id="roadBtn" class="b switch">'+(map.hasLayer(roadLayer)?'Gizle':'Göster')+'</button></div><div class="layerRow"><div><b>🏛 Han / kervansaray / menzil</b><div class="muted">Kamuya açık bilinen duraklar</div></div><button id="stopBtn" class="b switch">'+(map.hasLayer(stopLayer)?'Gizle':'Göster')+'</button></div><div class="layerRow"><div><b>🌉 Köprü / geçit</b><div class="muted">Tarihî köprü ve geçiş noktaları</div></div><button id="bridgeBtn" class="b switch">'+(map.hasLayer(bridgeLayer)?'Gizle':'Göster')+'</button></div><div class="layerRow"><div><b>〰 Dar araştırma koridorları</b><div class="muted">Eski geniş daireler yerine rota boyunca birkaç km genişlikte yaklaşık koridorlar</div></div><button id="corrBtn" class="b switch">'+(map.hasLayer(corridorLayer)?'Gizle':'Göster')+'</button></div><p class="muted">Çizgiler tarihî yolun birebir ölçülmüş izi değildir; genel ve kamuya açık güzergâhları görselleştirir. Hassas/yayımlanmamış arkeolojik noktalar gösterilmez.</p><button id="closeBtn" class="b">Kapat</button>';sh.classList.add('open');document.getElementById('roadBtn').addEventListener('click',e=>toggle(roadLayer,drawRoads,e.currentTarget));document.getElementById('stopBtn').addEventListener('click',e=>toggle(stopLayer,drawStops,e.currentTarget));document.getElementById('bridgeBtn').addEventListener('click',e=>toggle(bridgeLayer,drawBridges,e.currentTarget));document.getElementById('corrBtn').addEventListener('click',e=>toggle(corridorLayer,drawCorridors,e.currentTarget));document.getElementById('closeBtn').addEventListener('click',()=>sh.classList.remove('open'))}
function locate(){try{if(window.AndroidApp&&AndroidApp.requestLocation){AndroidApp.requestLocation();return}}catch(e){}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(x=>window.onNativeLocation(x.coords.latitude,x.coords.longitude,x.coords.accuracy))}
window.onNativeLocation=(a,b,c)=>{L.circleMarker([a,b],{radius:9,weight:3,fillOpacity:.9}).addTo(map).bindPopup('Konumunuz • ~'+Math.round(c)+' m').openPopup();map.setView([a,b],13)};
document.getElementById('q').addEventListener('input',drawSites);document.getElementById('locBtn').addEventListener('click',locate);document.getElementById('toolsBtn').addEventListener('click',tools);renderPeriods();drawSites();
</script>
</body></html>
