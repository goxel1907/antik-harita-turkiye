<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Antik Harita Türkiye</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.css">
<style>
:root{--ink:#111923;--panel:#111a24f5;--panel2:#1b2734;--line:#405163;--muted:#a8b3bf;--gold:#efc769;--gold2:#c99734;--safe:#65c18c;--bad:#dc6a6a;--shadow:0 12px 34px #0007}
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#bfd9e5;color:white}button,input{font:inherit}.maplibregl-ctrl-attrib{font-size:9px!important}.maplibregl-ctrl-logo{display:none!important}
#boot{position:fixed;z-index:1000;inset:0;display:flex;align-items:center;justify-content:center;background:#0d151e;color:#fff;padding:24px;text-align:center}.bootcard{max-width:360px}.brandmark{width:82px;height:82px;margin:0 auto 16px;border-radius:24px;background:linear-gradient(145deg,#f4d57e,#b67d25);position:relative;box-shadow:0 10px 30px #0008}.brandmark:before{content:"";position:absolute;left:17px;right:17px;top:25px;height:30px;border:3px solid #20170e;border-radius:5px;transform:rotate(-5deg)}.brandmark:after{content:"✦";position:absolute;right:8px;bottom:5px;width:32px;height:32px;border-radius:50%;background:#162331;display:grid;place-items:center;color:#f4d57e;font-size:20px;border:2px solid #f4d57e}.boot-title{font-size:24px;font-weight:900}.boot-sub{margin-top:8px;color:#b5c0cb;font-size:13px;line-height:1.5}
#ui{display:none}.top{position:fixed;z-index:50;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));background:var(--panel);border:1px solid #ffffff20;border-radius:19px;padding:9px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.searchrow{display:flex;gap:7px;align-items:stretch}.search{flex:1;min-width:0;border:1px solid #5b6c7c;border-radius:13px;background:#0a121a;color:#fff;padding:12px 13px;font-size:16px;outline:none}.search:focus{border-color:var(--gold);box-shadow:0 0 0 2px #efc76933}.iconbtn{border:0;border-radius:13px;background:var(--gold);color:#18120a;min-width:50px;padding:0 12px;font-weight:900;font-size:20px}.filterrow{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}.filterrow::-webkit-scrollbar{display:none}.pill{border:1px solid #566879;border-radius:11px;background:#202c38;color:#fff;padding:9px 11px;font-size:12px;font-weight:800;white-space:nowrap}.pill.active{background:var(--gold);border-color:var(--gold);color:#1b1409}.pill .small{font-weight:500;color:#c9d1d8}.pill.active .small{color:#5b431a}.statusrow{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}.badge{background:#202b37;border-radius:9px;padding:5px 8px;font-size:11px;color:#d5dce2;white-space:nowrap}.badge.ok{background:#18372b;color:#c8f2d8}.badge.warn{background:#4a3823;color:#ffe0a3}.badge.err{background:#512a2a;color:#ffd0d0}
#periodRibbon{position:fixed;z-index:40;left:10px;right:10px;top:190px;display:none;pointer-events:none}.periodCard{display:inline-flex;align-items:center;gap:8px;background:#3c2b18e8;border:1px solid #c38d3a;border-radius:11px;padding:7px 10px;color:#ffe1a8;font-size:11px;font-weight:800;box-shadow:0 4px 15px #0006}.periodDot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.floatleft{position:fixed;z-index:42;left:10px;top:205px;display:flex;flex-direction:column;gap:7px}.floatbtn{width:46px;height:46px;border:1px solid #647485;border-radius:12px;background:#111a24ed;color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px 18px #0005}.floatbtn.gold{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.version{position:fixed;z-index:42;right:10px;top:205px;background:#111a24ed;border:1px solid #ffffff38;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:900;box-shadow:0 5px 18px #0005}
#toast{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);display:none;max-width:320px;background:#111a24f3;border:1px solid #ffffff2c;border-radius:14px;padding:11px 14px;text-align:center;font-size:12px;line-height:1.45;box-shadow:var(--shadow)}
.bottom{position:fixed;z-index:43;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}.summary{pointer-events:auto;max-width:64vw;background:#111a24ef;border:1px solid #ffffff25;border-radius:13px;padding:9px 10px;font-size:11px;line-height:1.5;box-shadow:0 5px 18px #0006}.summary strong{font-size:12px}.near{pointer-events:auto;border:0;border-radius:13px;background:#111a24f2;color:#fff;padding:11px 13px;font-size:12px;font-weight:900;box-shadow:0 5px 18px #0006}.legendline{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;color:#cbd4dc}.swatch{display:inline-flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sheet{position:fixed;z-index:100;left:0;right:0;bottom:0;display:none;max-height:82vh;overflow:auto;background:#0f1821;border-radius:23px 23px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0009;border-top:1px solid #ffffff1f}.sheet.open{display:block}.grab{width:44px;height:5px;border-radius:3px;background:#556371;margin:0 auto 13px}.sheet h2{margin:0 0 10px;font-size:22px}.sheet h3{margin:14px 0 7px;font-size:14px;color:#f3d17c}.card{background:#18232e;border:1px solid #344656;border-radius:13px;padding:11px;margin:8px 0}.muted{color:#a6b1bc;font-size:11px;line-height:1.5}.meta{display:grid;grid-template-columns:105px 1fr;gap:6px 9px;font-size:12px;margin-top:9px}.meta b{color:#a9b6c1}.tag{display:inline-block;background:#293643;border-radius:8px;padding:4px 7px;font-size:10px;margin:3px 3px 0 0}.choice{width:100%;border:1px solid #46596b;border-radius:12px;background:#1b2834;color:#fff;padding:12px;text-align:left;margin:5px 0;font-weight:700}.choice.active{background:var(--gold);color:#171108;border-color:var(--gold)}.choice small{display:block;font-weight:500;opacity:.75;margin-top:2px}.close{width:100%;border:0;border-radius:12px;background:var(--gold);color:#191208;padding:13px;margin-top:10px;font-weight:900}.notice{background:#43331f;border:1px solid #8d6b35;color:#ffe1a7;border-radius:12px;padding:10px;font-size:11px;line-height:1.5;margin:8px 0}.okbox{background:#173429;border:1px solid #3f795f;color:#c7f0d7;border-radius:12px;padding:10px;font-size:11px;line-height:1.5;margin:8px 0}.result{background:#18232e;border:1px solid #344656;border-radius:13px;padding:11px;margin:8px 0}.result:active{background:#21303d}.resulttitle{font-weight:900;font-size:15px}.resultmeta{color:#a9b4be;font-size:11px;margin-top:4px;line-height:1.4}.sourceLink{color:#f3cd73;text-decoration:none;font-weight:800}.kpi{display:flex;gap:7px;overflow:auto;margin:8px 0}.kpibox{min-width:92px;background:#17222c;border:1px solid #344555;border-radius:11px;padding:8px}.kpibox b{display:block;font-size:17px}.kpibox span{font-size:10px;color:#aab4bd}.empty{padding:22px 8px;text-align:center;color:#aab5bf}.sectiontitle{font-weight:900;margin:12px 0 6px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-height:700px){.top{padding:7px}.search{padding:9px 11px}.pill{padding:7px 9px}.statusrow{margin-top:5px}.floatleft,.version{top:180px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="boot"><div class="bootcard"><div class="brandmark"></div><div class="boot-title">Antik Harita Türkiye</div><div class="boot-sub" id="bootText">Kaynaklı tarih korpusu ve harita motoru hazırlanıyor…</div></div></div>
<div id="ui">
  <div class="top">
    <div class="searchrow">
      <input id="q" class="search" autocomplete="off" enterkeyhint="search" placeholder="İl, ilçe, köy, mahalle veya tarihî ad">
      <button id="searchBtn" class="iconbtn" aria-label="Ara">⌕</button>
      <button id="locBtn" class="iconbtn" aria-label="Konum">⌖</button>
      <button id="menuBtn" class="iconbtn" aria-label="Menü">☰</button>
    </div>
    <div class="filterrow">
      <button id="periodBtn" class="pill">Dönem: <span class="small">Tümü</span></button>
      <button id="typeBtn" class="pill">Tür: <span class="small">Tümü</span></button>
      <button id="evidenceBtn" class="pill">Kanıt: <span class="small">Tümü</span></button>
      <button id="baseBtn" class="pill">Zemin: <span class="small">Güncel</span></button>
    </div>
    <div class="statusrow">
      <span id="corpusBadge" class="badge">Korpus yükleniyor</span>
      <span id="visibleBadge" class="badge">0 görünür</span>
      <span id="zoomBadge" class="badge">Zoom 6</span>
      <span id="stateBadge" class="badge">Hazır</span>
    </div>
  </div>
  <div id="periodRibbon"><div class="periodCard"><span class="periodDot"></span><span id="periodText"></span></div></div>
  <div class="floatleft">
    <button id="zoomIn" class="floatbtn">+</button>
    <button id="zoomOut" class="floatbtn">−</button>
    <button id="protectBtn" class="floatbtn gold" title="Koruma bağlamı">◌</button>
  </div>
  <div class="version">v15 RESEARCH</div>
  <div id="toast"></div>
  <div class="bottom">
    <div id="summary" class="summary"><strong>Kaynaklı tarih katmanı</strong><br><span class="muted">Korpus hazırlanıyor…</span></div>
    <button id="nearBtn" class="near">☷ Yakındakiler</button>
  </div>
  <div id="sheet" class="sheet"></div>
</div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.mjs';

const PERIODS=[
 ['Tümü',null,'Tüm tarihler'],['Neolitik',-7000,'yaklaşık MÖ 7000–4500'],['Kalkolitik',-4000,'yaklaşık MÖ 4500–3000'],['Tunç Çağı',-2000,'yaklaşık MÖ 3000–1200'],['Hitit',-1400,'yaklaşık MÖ 17.–12. yy'],['Frig',-800,'yaklaşık MÖ 12.–7. yy'],['Urartu',-750,'yaklaşık MÖ 9.–6. yy'],['Arkaik',-600,'yaklaşık MÖ 8.–5. yy'],['Klasik',-450,'yaklaşık MÖ 5.–4. yy'],['Helenistik',-200,'yaklaşık MÖ 4.–1. yy'],['Roma',200,'yaklaşık MÖ 1.–MS 4. yy'],['Bizans',900,'yaklaşık MS 4.–15. yy'],['Selçuklu',1200,'yaklaşık MS 11.–14. yy'],['Osmanlı',1700,'yaklaşık MS 14.–20. yy']
];
const TYPES=['Tümü','Yerleşim','Yol','Konaklama','Savunma','Geçiş','Su','Mağara','Mezar','Dini','Yapı'];
const EVIDENCE=['Tümü','Gazetteer','Literatür','Kamu kaydı','Yerel anlatı'];
const COLORS={Yerleşim:'#b94b42',Yol:'#985a3e',Konaklama:'#d28a1a',Savunma:'#7653bd',Geçiş:'#398fc1',Su:'#209cc2',Mağara:'#777777',Mezar:'#8c6a52',Dini:'#8b6b97',Yapı:'#4f7f61'};
const ICONS={Yerleşim:'🏛',Yol:'≋',Konaklama:'H',Savunma:'▰',Geçiş:'↔',Su:'◆',Mağara:'◒',Mezar:'◉',Dini:'✦',Yapı:'□'};
const LABELS={Yerleşim:'Yerleşim / arkeoloji',Yol:'Tarihî yol / güzergâh',Konaklama:'Han / kervansaray / menzil',Savunma:'Kale / tahkimat / savunma',Geçiş:'Köprü / geçit / geçiş',Su:'Su yapısı / kaynak bağlamı',Mağara:'Yayımlanmış mağara / sığınak',Mezar:'Nekropol / mezar yapısı',Dini:'Tarihî dini yapı',Yapı:'Diğer tarihî yapı / alan'};
const CURRENT_STYLE={version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm',minzoom:0,maxzoom:20,paint:{'raster-opacity':0.92,'raster-saturation':-0.15,'raster-contrast':-0.03}}]};
const OHM_STYLE='https://unpkg.com/@openhistoricalmap/map-styles@latest/dist/historical/historical.json';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let corpus={records:[],recordCount:0}, records=[], byId=new Map(), period='Tümü', type='Tümü', evidence='Tümü', base='Güncel', protection=false, mapReady=false, dataReady=false, loadedOnce=false;
let lastToastTimer=null;

const map=new maplibregl.Map({container:'map',style:CURRENT_STYLE,center:[35.2,39],zoom:5.6,minZoom:3,maxZoom:18,attributionControl:true,dragRotate:false,pitchWithRotate:false,localIdeographFontFamily:'sans-serif'});
map.touchZoomRotate.disableRotation();

function showToast(text,ms=2200){const el=$('toast');el.textContent=text;el.style.display='block';clearTimeout(lastToastTimer);lastToastTimer=setTimeout(()=>el.style.display='none',ms)}
function state(text,kind=''){const el=$('stateBadge');el.textContent=text;el.className='badge'+(kind?' '+kind:'')}
function fmt(n){return new Intl.NumberFormat('tr-TR').format(n||0)}
function km(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,A=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}
function dist(k){return k<1?Math.round(k*1000)+' m':k<10?k.toFixed(1)+' km':Math.round(k)+' km'}
function periodInfo(){return PERIODS.find(x=>x[0]===period)||PERIODS[0]}
function visibleRecords(){return records.filter(r=>(type==='Tümü'||r.kind===type)&&(evidence==='Tümü'||r.evidence===evidence)&&(period==='Tümü'||(r.periods||[]).includes(period)))}
function setButton(btn,prefix,value){btn.innerHTML=prefix+': <span class="small">'+esc(value)+'</span>';btn.classList.toggle('active',value!=='Tümü'&&value!=='Güncel')}
function updateRibbon(){const p=periodInfo(),el=$('periodRibbon');if(period==='Tümü'){el.style.display='none'}else{el.style.display='block';$('periodText').textContent=period+' • '+p[2]+(base==='Tarihsel'?' • OHM yıl görünümü '+p[1]:'')}}

function recFeature(r){return {type:'Feature',id:r.id,properties:{id:r.id,name:r.name,kind:r.kind,evidence:r.evidence,periods:(r.periods||[]).join('|'),precision:r.precision||''},geometry:{type:'Point',coordinates:[r.lon,r.lat]}}}
function filteredGeo(){return {type:'FeatureCollection',features:visibleRecords().map(recFeature)}}
function geometryGeo(){const out=[];for(const r of visibleRecords()){if(!r.geometry)continue;out.push({type:'Feature',properties:{id:r.id,name:r.name,kind:r.kind},geometry:r.geometry})}return {type:'FeatureCollection',features:out}}
function protectionGeo(){if(!protection)return {type:'FeatureCollection',features:[]};const list=visibleRecords(),grid=new Map(),step=.22;for(const r of list){const x=Math.floor(r.lon/step),y=Math.floor(r.lat/step),key=x+':'+y,g=grid.get(key)||{n:0,k:new Set(),lon:(x+.5)*step,lat:(y+.5)*step};g.n++;g.k.add(r.kind);grid.set(key,g)}const features=[];for(const g of grid.values()){if(g.n<3||g.k.size<2)continue;const x0=g.lon-step/2,y0=g.lat-step/2,x1=g.lon+step/2,y1=g.lat+step/2;features.push({type:'Feature',properties:{count:g.n,kinds:g.k.size,label:'Bölgesel koruma bağlamı'},geometry:{type:'Polygon',coordinates:[[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]]}})}return {type:'FeatureCollection',features}}
function colorExpr(){const e=['match',['get','kind']];for(const [k,c] of Object.entries(COLORS)){e.push(k,c)}e.push('#6b7783');return e}

function installDataLayers(){if(!mapReady||!dataReady)return;for(const id of ['history-label','history-dot','cluster-count','clusters','history-lines','history-polygons','protection-line','protection-fill']){if(map.getLayer(id))map.removeLayer(id)}for(const id of ['history-points','history-geoms','protection-zones']){if(map.getSource(id))map.removeSource(id)}
 map.addSource('history-points',{type:'geojson',data:filteredGeo(),cluster:true,clusterRadius:48,clusterMaxZoom:11,promoteId:'id'});
 map.addSource('history-geoms',{type:'geojson',data:geometryGeo()});
 map.addSource('protection-zones',{type:'geojson',data:protectionGeo()});
 const before=undefined;
 map.addLayer({id:'protection-fill',type:'fill',source:'protection-zones',paint:{'fill-color':'#d49b3c','fill-opacity':['interpolate',['linear'],['get','count'],3,.08,12,.22,30,.34]}} ,before);
 map.addLayer({id:'protection-line',type:'line',source:'protection-zones',paint:{'line-color':'#d5a14d','line-width':1.4,'line-dasharray':[2,2],'line-opacity':.8}},before);
 map.addLayer({id:'history-polygons',type:'fill',source:'history-geoms',filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':colorExpr(),'fill-opacity':.16,'fill-outline-color':colorExpr()}},before);
 map.addLayer({id:'history-lines',type:'line',source:'history-geoms',filter:['==',['geometry-type'],'LineString'],paint:{'line-color':colorExpr(),'line-width':['interpolate',['linear'],['zoom'],8,1.5,14,4.2,18,7],'line-opacity':.82}},before);
 map.addLayer({id:'clusters',type:'circle',source:'history-points',filter:['has','point_count'],paint:{'circle-color':'#17222d','circle-radius':['step',['get','point_count'],18,10,22,50,27,200,33],'circle-stroke-width':3,'circle-stroke-color':'#efc769','circle-opacity':.94}},before);
 map.addLayer({id:'cluster-count',type:'symbol',source:'history-points',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':12,'text-font':['Open Sans Regular']},paint:{'text-color':'#ffffff'}},before);
 map.addLayer({id:'history-dot',type:'circle',source:'history-points',filter:['!',['has','point_count']],paint:{'circle-color':colorExpr(),'circle-radius':['interpolate',['linear'],['zoom'],6,5,10,7,14,9,17,11],'circle-stroke-color':'#f7e7bd','circle-stroke-width':['interpolate',['linear'],['zoom'],6,1,14,2.4],'circle-opacity':.96}},before);
 map.addLayer({id:'history-label',type:'symbol',source:'history-points',filter:['!',['has','point_count']],minzoom:12.2,layout:{'text-field':['concat',['get','name'],'  ·  ',['get','kind']], 'text-size':['interpolate',['linear'],['zoom'],12,10,15,12,18,14],'text-anchor':'left','text-offset':[1.15,0],'text-max-width':18,'text-allow-overlap':false},paint:{'text-color':'#ffffff','text-halo-color':'#111923','text-halo-width':2,'text-halo-blur':1}},before);
 updateStatus();
}
function refreshData(){if(!mapReady||!dataReady)return;const p=map.getSource('history-points'),g=map.getSource('history-geoms'),z=map.getSource('protection-zones');if(p)p.setData(filteredGeo());if(g)g.setData(geometryGeo());if(z)z.setData(protectionGeo());updateStatus()}
function updateStatus(){const list=visibleRecords();$('corpusBadge').textContent=fmt(corpus.recordCount||records.length)+' kaynaklı kayıt';$('corpusBadge').className='badge ok';$('visibleBadge').textContent=fmt(list.length)+' filtre sonucu';$('zoomBadge').textContent='Zoom '+map.getZoom().toFixed(1);const b=map.getBounds();const ons=list.filter(r=>b.contains([r.lon,r.lat])).length;const counts={};for(const r of list){counts[r.kind]=(counts[r.kind]||0)+1}const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,n])=>`<span class="swatch"><span class="dot" style="background:${COLORS[k]||'#777'}"></span>${esc(k)} ${fmt(n)}</span>`).join('');$('summary').innerHTML=`<strong>${fmt(ons)} ekranda • ${fmt(list.length)} filtre sonucu</strong><div class="legendline">${top||'<span>Bu filtrede kayıt yok</span>'}</div>`}

function applyOhmDate(){if(base!=='Tarihsel'||period==='Tümü'||!map.isStyleLoaded())return;const year=periodInfo()[1];if(year==null)return;for(const layer of map.getStyle().layers||[]){const src=layer.source;if(typeof src!=='string'||(!src.includes('ohm')&&src!=='osm'))continue;if(['background','hillshade','raster'].includes(layer.type))continue;try{const original=layer.filter||true;const dateFilter=['all',['any',['!',['has','start_decdate']],['<=',['get','start_decdate'],year]],['any',['!',['has','end_decdate']],['>=',['get','end_decdate'],year]]];map.setFilter(layer.id,original===true?dateFilter:['all',original,dateFilter])}catch(e){/* Style layers vary; unsupported filters are left untouched. */}}
}
function changeBase(next){base=next;setButton($('baseBtn'),'Zemin',base);state(base==='Tarihsel'?'Tarihsel zemin yükleniyor':'Güncel zemin yükleniyor');const center=map.getCenter(),z=map.getZoom();map.setStyle(base==='Tarihsel'?OHM_STYLE:CURRENT_STYLE);map.once('style.load',()=>{map.jumpTo({center,zoom:z});state('Hazır','ok');updateRibbon()})}

function showSheet(html){const s=$('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}
window.closeSheet=closeSheet;
function choiceSheet(title,items,current,onPick,subtitle=''){showSheet(`<h2>${esc(title)}</h2>${subtitle?`<div class="muted">${esc(subtitle)}</div>`:''}`+items.map((x,i)=>{const val=Array.isArray(x)?x[0]:x,sub=Array.isArray(x)?x[2]:'';return `<button class="choice ${val===current?'active':''}" data-i="${i}">${esc(val)}${sub?`<small>${esc(sub)}</small>`:''}</button>`}).join('')+'<button class="close" id="sheetClose">Kapat</button>');[...$('sheet').querySelectorAll('.choice')].forEach(btn=>btn.onclick=()=>{const x=items[+btn.dataset.i],v=Array.isArray(x)?x[0]:x;onPick(v);closeSheet()});$('sheetClose').onclick=closeSheet}
function openPeriod(){choiceSheet('Dönem filtresi',PERIODS,period,v=>{period=v;setButton($('periodBtn'),'Dönem',period);updateRibbon();if(v!=='Tümü'&&base==='Güncel')changeBase('Tarihsel');else if(base==='Tarihsel')changeBase('Tarihsel');else refreshData()},'Dönem yalnız kaynakta tarihlendirilebilen kayıtları süzer. Dönem uydurulmaz. Dönem seçildiğinde tarihsel zemin otomatik açılır.')}
function openType(){choiceSheet('Tarihî unsur türü',TYPES,type,v=>{type=v;setButton($('typeBtn'),'Tür',type);refreshData()})}
function openEvidence(){choiceSheet('Kanıt / kaynak sınıfı',EVIDENCE,evidence,v=>{evidence=v;setButton($('evidenceBtn'),'Kanıt',evidence);refreshData()},'Gazetteer = yayımlanmış tarihsel yer adları/konumları. Yerel anlatı ancak ayrıca kaynak eklenirse görünür.')}
function openBase(){choiceSheet('Harita zemini',[['Güncel',null,'Modern yer adları ve konum bulma için OSM'],['Tarihsel',null,'OpenHistoricalMap tarihsel vektör zemini']],base,v=>changeBase(v),'Tarihî kayıt katmanı iki zeminde de aynı kaynaklı veriyle çalışır.')}

function showRecord(r){const aliases=(r.altNames||[]).slice(0,8).map(x=>`<span class="tag">${esc(x)}</span>`).join('');const ps=(r.periods||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="tag">Dönem kaynakta açık değil</span>';const acc=r.accuracyMinM!=null||r.accuracyMaxM!=null?`${r.accuracyMinM??'?'}–${r.accuracyMaxM??'?'} m`:r.precision||'belirtilmemiş';showSheet(`<h2>${esc(r.name)}</h2><div class="card"><div class="resulttitle">${ICONS[r.kind]||'•'} ${esc(LABELS[r.kind]||r.kind)}</div><div class="meta"><b>Kanıt</b><span>${esc(r.evidence)}</span><b>Dönem</b><span>${ps}</span><b>Tarih bilgisi</b><span>${esc(r.dateLabel||'Kaynakta ayrı tarih aralığı yok')}</span><b>Konum doğruluğu</b><span>${esc(acc)}</span><b>Kaynak</b><span>${esc(r.source)}</span></div></div>${aliases?`<div class="sectiontitle">Eski / alternatif adlar</div><div>${aliases}</div>`:''}${r.description?`<div class="sectiontitle">Kaynak açıklaması</div><div class="card muted">${esc(r.description)}</div>`:''}${(r.placeTypes||[]).length?`<div class="sectiontitle">Kaynak türleri</div><div>${r.placeTypes.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${r.provenance?`<div class="sectiontitle">Provenans</div><div class="card muted">${esc(r.provenance)}</div>`:''}<div class="notice">Bu kayıt kamuya açık tarih/arkeoloji kaynağından gelir. Konumsal hassasiyet kaynakta “rough/kaba” ise nokta kesin konum olarak yorumlanmamalıdır.</div><a class="choice sourceLink" href="${esc(r.sourceUrl)}">Kaynağı aç ↗</a><button class="close" onclick="closeSheet()">Kapat</button>`)}
function showNearby(){const c=map.getCenter(),list=visibleRecords().map(r=>({r,d:km(c.lat,c.lng,r.lat,r.lon)})).sort((a,b)=>a.d-b.d).slice(0,120);showSheet(`<h2>Yakındaki tarihî kayıtlar</h2><div class="muted">Harita merkezine göre sıralı • ${fmt(list.length)} sonuç gösteriliyor.</div>`+(list.length?list.map((x,i)=>`<div class="result" data-near="${i}"><div class="resulttitle">${ICONS[x.r.kind]||'•'} ${esc(x.r.name)}</div><div class="resultmeta">${dist(x.d)} • ${esc(LABELS[x.r.kind]||x.r.kind)} • ${esc(x.r.evidence)}${(x.r.periods||[]).length?' • '+esc(x.r.periods.join(', ')):''}</div></div>`).join(''):'<div class="empty">Bu filtrede yakın kayıt yok.</div>')+'<button class="close" id="sheetClose">Kapat</button>');[...$('sheet').querySelectorAll('[data-near]')].forEach(el=>el.onclick=()=>{const x=list[+el.dataset.near].r;closeSheet();map.flyTo({center:[x.lon,x.lat],zoom:Math.max(14,map.getZoom()),duration:650});setTimeout(()=>showRecord(x),700)});$('sheetClose').onclick=closeSheet}
function openMenu(){const generated=corpus.generatedAt?new Date(corpus.generatedAt).toLocaleString('tr-TR'):'bilinmiyor';showSheet(`<h2>Araştırma haritası</h2><div class="okbox"><b>${fmt(corpus.recordCount)} kaynaklı Pleiades kaydı</b><br>Bu APK’da korpus yerel varlık olarak bulunur; haritada dolaşırken canlı Overpass sorgusu yapılmaz.</div><div class="kpi"><div class="kpibox"><b>${fmt(corpus.recordCount)}</b><span>korpus</span></div><div class="kpibox"><b>${fmt(Object.keys(corpus.countsByKind||{}).length)}</b><span>tür sınıfı</span></div><div class="kpibox"><b>${fmt(Object.keys(corpus.countsByPeriod||{}).length)}</b><span>dönem etiketi</span></div></div><button class="choice" id="mBase">Harita zemini: ${esc(base)}<small>Güncel OSM veya tarihsel OpenHistoricalMap</small></button><button class="choice" id="mProtection">Koruma bağlamı: ${protection?'Açık':'Kapalı'}<small>Yalnız kaynaklı kayıt yoğunluğundan geniş bölgesel bağlam; gizli hedef üretmez.</small></button><button class="choice" id="mFit">Türkiye görünümüne dön</button><div class="card muted">Korpus üretimi: ${esc(generated)}<br>${esc(corpus.source||'Pleiades GIS export')}<br>${esc(corpus.license||'')}</div><div class="notice">Uygulama belgelenmemiş “saklama/define noktası” üretmez. Potansiyel görünüm, yalnız mirasın korunması için kaynaklı kayıtların geniş bölgesel yoğunluğunu gösterir.</div><button class="close" onclick="closeSheet()">Kapat</button>`);$('mBase').onclick=()=>{closeSheet();openBase()};$('mProtection').onclick=()=>{protection=!protection;refreshData();closeSheet();showToast(protection?'Bölgesel koruma bağlamı açıldı':'Koruma bağlamı kapatıldı')};$('mFit').onclick=()=>{closeSheet();map.fitBounds([[25.5,35.5],[45.0,42.2]],{padding:28,duration:700})}}

function doSearch(){
 const q=$('q').value.trim();if(!q)return;
 const nq=q.toLocaleLowerCase('tr');
 const local=records.filter(r=>r.name.toLocaleLowerCase('tr').includes(nq)||(r.altNames||[]).some(n=>n.toLocaleLowerCase('tr').includes(nq))).slice(0,40);
 if(local.length){
  const body=local.map((r,i)=>`<div class="result" data-local="${i}"><div class="resulttitle">${ICONS[r.kind]||'•'} ${esc(r.name)}</div><div class="resultmeta">${esc(r.kind)} • ${esc(r.evidence)}${(r.periods||[]).length?' • '+esc(r.periods.join(', ')):''}</div></div>`).join('');
  showSheet(`<h2>Tarihî ad sonuçları</h2>${body}<div class="muted">Modern il/ilçe/köy/mahalle araması için aşağıdaki düğmeyi kullan.</div><button class="choice" id="modernSearch">“${esc(q)}” için modern yer ara</button><button class="close" onclick="closeSheet()">Kapat</button>`);
  [...$('sheet').querySelectorAll('[data-local]')].forEach(el=>el.onclick=()=>{const r=local[+el.dataset.local];closeSheet();map.flyTo({center:[r.lon,r.lat],zoom:14,duration:650});setTimeout(()=>showRecord(r),700)});
  $('modernSearch').onclick=()=>nativeGeocode(q);return;
 }
 nativeGeocode(q)
}
function nativeGeocode(q){if(window.AndroidApp?.geocodeV6){state('Yer aranıyor','warn');AndroidApp.geocodeV6(q)}else showToast('Android yer arama köprüsü bulunamadı')}
window.onNativeGeocodeV6=raw=>{state('Hazır','ok');let a=[];try{a=JSON.parse(raw)}catch(e){}showSheet(`<h2>Modern yer araması</h2>`+(a.length?a.map((x,i)=>`<div class="result" data-geo="${i}"><div class="resulttitle">${esc((x.display_name||'').split(',')[0])}</div><div class="resultmeta">${esc(x.display_name||'')} • ${esc(x.type||'yer')}</div></div>`).join(''):'<div class="empty">Sonuç bulunamadı.</div>')+'<button class="close" onclick="closeSheet()">Kapat</button>');window._geo=a;[...$('sheet').querySelectorAll('[data-geo]')].forEach(el=>el.onclick=()=>{const x=a[+el.dataset.geo];closeSheet();$('q').value=(x.display_name||'').split(',')[0];map.flyTo({center:[+x.lon,+x.lat],zoom:/village|hamlet|neighbourhood|quarter/.test(x.type||'')?14:12.5,duration:700})})};
window.onNativeGeocodeErrorV6=msg=>{state('Arama hatası','err');showToast('Yer arama servisine ulaşılamadı')};
window.onNativeLocationV6=(lat,lon)=>{map.flyTo({center:[+lon,+lat],zoom:14,duration:700});state('Konum bulundu','ok')};

function corpusLoaded(raw){try{const j=JSON.parse(raw);if(!Array.isArray(j.records)||j.records.length<100)throw new Error('Korpus boş veya eksik');corpus=j;records=j.records.filter(r=>Number.isFinite(+r.lat)&&Number.isFinite(+r.lon)).map(r=>({...r,lat:+r.lat,lon:+r.lon}));byId=new Map(records.map(r=>[r.id,r]));dataReady=true;$('boot').style.display='none';$('ui').style.display='block';if(mapReady)installDataLayers();updateStatus();loadedOnce=true;state('Hazır','ok')}catch(e){$('bootText').innerHTML='Tarih korpusu yüklenemedi.<br><br><b>'+esc(e.message)+'</b><br>Bu sürüm demo veriyle devam etmeyecek.'}}
let _corpusChunks=[];
window.onNativeCorpusStartV1=total=>{_corpusChunks=new Array(+total||0);$('bootText').textContent='Kaynaklı tarih korpusu yükleniyor…'};
window.onNativeCorpusChunkV1=(i,part)=>{_corpusChunks[+i]=part};
window.onNativeCorpusEndV1=()=>{const raw=_corpusChunks.join('');_corpusChunks=[];corpusLoaded(raw)};
window.onNativeCorpusV1=corpusLoaded;
window.onNativeCorpusErrorV1=msg=>{$('bootText').innerHTML='Tarih korpusu bulunamadı.<br><br>'+esc(msg)+'<br>Codemagic veri derleme adımını kontrol et.'};

map.on('load',()=>{mapReady=true;if(dataReady)installDataLayers();state('Hazır','ok')});
map.on('style.load',()=>{mapReady=true;if(dataReady)installDataLayers();if(base==='Tarihsel')setTimeout(applyOhmDate,250)});
map.on('zoomend',updateStatus);map.on('moveend',updateStatus);
map.on('click','clusters',e=>{const f=e.features?.[0];if(!f)return;const id=f.properties.cluster_id;map.getSource('history-points').getClusterExpansionZoom(id).then(z=>map.easeTo({center:f.geometry.coordinates,zoom:z,duration:450}))});
for(const layer of ['history-dot','history-label'])map.on('click',layer,e=>{const id=e.features?.[0]?.properties?.id,r=byId.get(id);if(r)showRecord(r)});
map.on('click','history-lines',e=>{const id=e.features?.[0]?.properties?.id,r=byId.get(id);if(r)showRecord(r)});
map.on('click','history-polygons',e=>{const id=e.features?.[0]?.properties?.id,r=byId.get(id);if(r)showRecord(r)});
map.on('click',e=>{
 if(base!=='Tarihsel')return;
 const own=map.queryRenderedFeatures(e.point,{layers:['history-dot','history-label','history-lines','history-polygons','clusters']});if(own.length)return;
 const fs=map.queryRenderedFeatures(e.point).filter(f=>{const src=String(f.source||'');return (src.includes('ohm')||src==='osm')&&f.properties&&(f.properties.name||f.properties['name:tr']||f.properties.start_date||f.properties.end_date)});
 const f=fs[0];if(!f)return;const p=f.properties||{},name=p['name:tr']||p.name||p.old_name||'OpenHistoricalMap kaydı';const tags=['start_date','end_date','start_decdate','end_decdate','historic','highway','place','building','route','railway','amenity'].filter(k=>p[k]!=null).map(k=>`<span class="tag">${esc(k)}: ${esc(p[k])}</span>`).join('');
 showSheet(`<h2>${esc(name)}</h2><div class="card"><div class="resulttitle">OpenHistoricalMap tarih katmanı</div><div class="muted">Kaynaklı tarihsel vektör nesnesi • seçili dönem yılı: ${esc(String(periodInfo()[1]??'tümü'))}</div><div>${tags}</div></div><div class="notice">Bu nesne OpenHistoricalMap tarihsel zemininden okunur. Dönem filtresi start/end tarih alanlarına uygulanır; eksik tarih alanları kaynakta eksik kabul edilir.</div><button class="close" onclick="closeSheet()">Kapat</button>`);
});
map.on('mouseenter','history-dot',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','history-dot',()=>map.getCanvas().style.cursor='');

$('periodBtn').onclick=openPeriod;$('typeBtn').onclick=openType;$('evidenceBtn').onclick=openEvidence;$('baseBtn').onclick=openBase;$('menuBtn').onclick=openMenu;$('nearBtn').onclick=showNearby;$('protectBtn').onclick=()=>{protection=!protection;refreshData();showToast(protection?'Koruma bağlamı açıldı':'Koruma bağlamı kapatıldı')};$('zoomIn').onclick=()=>map.zoomIn({duration:220});$('zoomOut').onclick=()=>map.zoomOut({duration:220});$('locBtn').onclick=()=>window.AndroidApp?.requestLocation();$('searchBtn').onclick=doSearch;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur();doSearch()}});
setButton($('periodBtn'),'Dönem',period);setButton($('typeBtn'),'Tür',type);setButton($('evidenceBtn'),'Kanıt',evidence);setButton($('baseBtn'),'Zemin',base);

if(window.AndroidApp?.loadCorpusV1){AndroidApp.loadCorpusV1()}else{$('bootText').textContent='Android veri köprüsü bulunamadı. Uygulamayı APK içinden aç.'}
</script>
</body>
</html>
