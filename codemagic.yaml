workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v9.5.10 MANUAL PRO source
        script: |
          set -euo pipefail
          cat futures15m_alarm/v9.part00.b64 futures15m_alarm/v9.part01.b64 futures15m_alarm/v9.fix02a.b64 futures15m_alarm/v9.fix02b.b64 futures15m_alarm/v9.part03.b64 futures15m_alarm/v9.part04.b64 > /tmp/Futures15mAlarm-v9-source.b64
          python3 - <<'PY'
          import base64, hashlib, zipfile
          from pathlib import Path
          src = Path('/tmp/Futures15mAlarm-v9-source.b64')
          dst = Path('/tmp/Futures15mAlarm-v9-source.zip')
          data = base64.b64decode(src.read_text().strip())
          dst.write_bytes(data)
          print('v9 base ZIP bytes:', len(data))
          print('v9 base SHA256:', hashlib.sha256(data).hexdigest())
          if not zipfile.is_zipfile(dst):
              raise SystemExit('Decoded v9 source is not a ZIP')
          with zipfile.ZipFile(dst, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit('Corrupt ZIP member: ' + bad)
          print('v9 base ZIP integrity OK.')
          PY

          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v9-source.zip -d /tmp/futures15m-build

          python3 "$CM_BUILD_DIR/futures15m_alarm/v91_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v92_binance_patch.py"

          APP=/tmp/futures15m-build/Futures15mAlarm
          JAVA="$APP/app/src/main/java/com/futuresalarm/app"

          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          root = Path('/tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app')
          build = Path('/tmp/futures15m-build/Futures15mAlarm/app/build.gradle')
          srcroot = Path(os.environ['CM_BUILD_DIR']) / 'futures15m_alarm'
          for payload, target in [
              ('v93_MainActivity.gz.b64', root/'MainActivity.java'),
              ('v93_MonitorService.gz.b64', root/'MonitorService.java')]:
              raw = base64.b64decode((srcroot/payload).read_text().strip())
              target.write_bytes(gzip.decompress(raw))
          b = build.read_text()
          b = b.replace('versionCode 11', 'versionCode 12')
          b = b.replace("versionName '9.2.0'", "versionName '9.3.0'")
          build.write_text(b)
          print('v9.3 live confirmation sources restored.')
          PY

          python3 "$CM_BUILD_DIR/futures15m_alarm/v94_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v95_pre_anchor.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v95_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v951_import_dialog_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v952_logic_ui_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v953_signal_guard.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v954_reclaim_precision.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v955_ui_icon.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v956_stale_flow_radar.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v957_launcher_cache_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v958_forming_candles.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v959_conditional_scenarios.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9510_plan_parser.py"

          test -f "$APP/settings.gradle"
          test -f "$APP/app/build.gradle"
          test -f "$JAVA/MainActivity.java"
          test -f "$JAVA/MonitorService.java"
          test -f "$JAVA/AnalysisPackActivity.java"

          grep -q 'v9.5.10' "$JAVA/MainActivity.java"
          grep -q 'ChatGPT ANALİZ PAKETİ • v9.5.10' "$JAVA/AnalysisPackActivity.java"
          grep -q 'V9510_PLAN_LABEL_NORMALIZER' "$JAVA/MainActivity.java"
          grep -q 'v9510StripPlanLabel(a\[9\], "LP")' "$JAVA/MainActivity.java"
          grep -q 'LP=stop;tp1;tp2;tp3' "$JAVA/AnalysisPackActivity.java"

          grep -q 'Map<String, Candle> forming' "$JAVA/AnalysisPackActivity.java"
          grep -q 'fetchFormingCandle' "$JAVA/AnalysisPackActivity.java"
          grep -q 'AÇIK MUM  O ' "$JAVA/AnalysisPackActivity.java"
          grep -q 'RSI14 ANLIK' "$JAVA/AnalysisPackActivity.java"
          grep -q 'kritik giriş teyidi yalnız TAMAMLANMIŞ 15m kapanışından' "$JAVA/AnalysisPackActivity.java"
          grep -q '1h/4h/1D açık mum kapanmadan HTF BOS/CHoCH teyidi verme' "$JAVA/AnalysisPackActivity.java"

          grep -q 'v956_last_success_' "$JAVA/MonitorService.java"
          grep -q 'ERKEN AKIŞ RADARI' "$JAVA/MonitorService.java"
          grep -q 'GİZLİ HACİM BİRİKİMİ' "$JAVA/MonitorService.java"
          grep -q 'SHORT ÇIKIŞ BİRİKİMİ' "$JAVA/MonitorService.java"
          grep -q 'if ("ISLEM_YOK".equals(d)) return true;' "$JAVA/MonitorService.java"
          grep -q 'alarm motoru KİLİTLİ DEĞİL' "$JAVA/MonitorService.java"
          grep -q 'KOŞULLU SENARYOLAR AKTİF İZLENİYOR' "$JAVA/MainActivity.java"

          grep -q '@mipmap/ic_launcher_pro_v957' "$APP/app/src/main/AndroidManifest.xml"
          test -s "$APP/app/src/main/res/mipmap-anydpi/ic_launcher_pro_v957.xml"
          test -s "$APP/app/src/main/res/mipmap-anydpi-v26/ic_launcher_pro_v957.xml"

          grep -q 'versionCode 24' "$APP/app/build.gradle"
          grep -q "versionName '9.5.10'" "$APP/app/build.gradle"
          echo 'Prepare v9.5.10 OK. Labelled LP=/LB=/SR=/SB= and old bare plan groups are accepted; META= supported.'

      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties

      - name: Check build tools
        script: |
          java -version
          gradle --version

      - name: Build installable v9.5.10 debug APK
        script: |
          set -e
          cd /tmp/futures15m-build/Futures15mAlarm
          gradle --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.10.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.10.apk"

    artifacts:
      - Futures15mAlarm-PRO-v9.5.10.apk
