workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v4 source
        script: |
          set -e
          SRC="$CM_BUILD_DIR/futures15m_alarm/v4-source.b64"
          test -s "$SRC"
          python3 - <<'PY'
          import base64
          import zipfile
          from pathlib import Path

          src = Path("/Users/builder/clone/futures15m_alarm/v4-source.b64")
          zip_path = Path("/tmp/Futures15mAlarm-v4-source.zip")
          data = base64.b64decode(src.read_text().strip())
          zip_path.write_bytes(data)
          if not zipfile.is_zipfile(zip_path):
              raise SystemExit("Decoded v4 source is not a valid ZIP")
          with zipfile.ZipFile(zip_path, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit("Corrupt ZIP member: " + bad)
          print("Futures Alarm v4 source ZIP OK:", len(data), "bytes")
          PY
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v4-source.zip -d /tmp/futures15m-build
          test -f /tmp/futures15m-build/Futures15mAlarm/settings.gradle
          test -f /tmp/futures15m-build/Futures15mAlarm/app/build.gradle
          grep -q 'LONG PULLBACK' /tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app/MainActivity.java
          grep -q 'longPullDetail' /tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app/TradePlan.java
          echo 'Futures Alarm v4 detailed source validated successfully.'
      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties
      - name: Check build tools
        script: |
          java -version
          gradle --version
      - name: Build installable debug APK
        script: |
          set -e
          cd /tmp/futures15m-build/Futures15mAlarm
          gradle --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v4.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v4.apk"
    artifacts:
      - Futures15mAlarm-PRO-v4.apk
