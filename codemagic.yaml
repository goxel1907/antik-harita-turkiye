workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v9.5.22 MANUAL PRO source
        script: |
          set -euo pipefail
          cat futures15m_alarm/v9.part00.b64 futures15m_alarm/v9.part01.b64 futures15m_alarm/v9.fix02a.b64 futures15m_alarm/v9.fix02b.b64 futures15m_alarm/v9.part03.b64 futures15m_alarm/v9.part04.b64 > /tmp/Futures15mAlarm-v9-source.b64
          python3 - <<'PY'
          import base64, hashlib, zipfile
          from pathlib import Path
          src=Path('/tmp/Futures15mAlarm-v9-source.b64'); dst=Path('/tmp/Futures15mAlarm-v9-source.zip')
          data=base64.b64decode(src.read_text().strip()); dst.write_bytes(data)
          print('v9 base ZIP bytes:',len(data)); print('v9 base SHA256:',hashlib.sha256(data).hexdigest())
          if not zipfile.is_zipfile(dst): raise SystemExit('Decoded v9 source is not a ZIP')
          with zipfile.ZipFile(dst,'r') as zf:
              bad=zf.testzip()
              if bad: raise SystemExit('Corrupt ZIP member: '+bad)
          PY

          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v9-source.zip -d /tmp/futures15m-build

          python3 "$CM_BUILD_DIR/futures15m_alarm/v91_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v92_binance_patch.py"
          python3 - <<'PY'
          import base64,gzip,os
          from pathlib import Path
          root=Path('/tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app')
          build=Path('/tmp/futures15m-build/Futures15mAlarm/app/build.gradle')
          srcroot=Path(os.environ['CM_BUILD_DIR'])/'futures15m_alarm'
          for payload,target in [('v93_MainActivity.gz.b64',root/'MainActivity.java'),('v93_MonitorService.gz.b64',root/'MonitorService.java')]:
              target.write_bytes(gzip.decompress(base64.b64decode((srcroot/payload).read_text().strip())))
          b=build.read_text().replace('versionCode 11','versionCode 12').replace("versionName '9.2.0'","versionName '9.3.0'")
          build.write_text(b)
          PY

          python3 "$CM_BUILD_DIR/futures15m_alarm/v94_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v95_pre_anchor.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v95_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v951_import_dialog_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v952_logic_ui_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v953_signal_guard.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v954_reclaim_precision.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v955_ui_icon.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v956_stale_flow_radar.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v957_launcher_cache_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v958_forming_candles.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v959_conditional_scenarios.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9510_plan_parser.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9511_same_chat_external.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9512_chatgpt_launch_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9513_prompt_image_handoff.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9514_java_string_fix.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9515_prompt_dialog_ui.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9516_structure_engine.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9517_fresh_signal_history_hunt.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9517b_flow_stability.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9518a_ui_tr.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9518b_signal_tracking.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9519_prompt_quality.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9520_professional_ui_prompt.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9520b_turkish_labels.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9520c_compile_safe.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9521_trade_handoff_logic.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9521b_ltf_meta_compat.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9522a_weighted_ltf.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9522a2_binance_anchor_compat.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9522b_api_order.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9522c_api_guard_ui.py"

          python3 - <<'PY'
          from pathlib import Path
          app=Path('/tmp/futures15m-build/Futures15mAlarm')
          main=(app/'app/src/main/java/com/futuresalarm/app/MainActivity.java').read_text()
          mon=(app/'app/src/main/java/com/futuresalarm/app/MonitorService.java').read_text()
          ana=(app/'app/src/main/java/com/futuresalarm/app/AnalysisPackActivity.java').read_text()
          eng=(app/'app/src/main/java/com/futuresalarm/app/StructureEngine.java').read_text()
          build=(app/'app/build.gradle').read_text()
          checks={
            'main v9.5.22':'v9.5.22' in main and 'V9522_API_ORDER' in main,
            'secure API storage':'AndroidKeyStore' in main and 'AES/GCM/NoPadding' in main,
            'manual API confirmation':'SON EMİR ONAYI' in main and "EMİRLERİ BINANCE'A GÖNDER" in main,
            'visible API test':'V9522_VISIBLE_API_TEST' in main,
            'minimum notional guard':'V9522_MIN_NOTIONAL_GUARD' in main,
            'order endpoints':'/fapi/v1/order' in main and '/fapi/v1/leverage' in main and '/fapi/v1/algoOrder' in main,
            'protective orders':'STOP_MARKET' in main and 'TAKE_PROFIT_MARKET' in main and 'v9522EmergencyClose' in main,
            'weighted flow':'V9522_WEIGHTED_FLOW' in mon and 'support < 22' in mon,
            'weighted prompt':'V9522_WEIGHTED_DECISION_LTF' in ana and 'YALNIZ DÖRT SERT VETO' in ana,
            'six timeframes':'{"15m", "5m", "3m", "1h", "4h", "1d"}' in ana,
            'LTF structure':'{"15m", "5m", "3m", "1h", "4h", "1d"}' in eng,
            'LTF contract':'ALT ZAMAN DİLİMİ YENİDEN GİRİŞ KURALI' in ana and '5m YENİDEN GİRİŞ' in ana,
            'signal tracking':'v9518RecordSignal' in mon and 'v9518UpdateSignalResult' in mon,
            'fresh signal':'v9517FreshSignalEligible' in mon,
            'version':'versionCode 36' in build and "versionName '9.5.22'" in build,
          }
          print('--- Final v9.5.22 checks ---')
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL '),k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('v9.5.22 sanity check failed: '+', '.join(bad))
          print('Final v9.5.22 sanity checks OK.')
          PY

      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties

      - name: Check build tools
        script: |
          java -version
          gradle --version

      - name: Build installable v9.5.22 debug APK
        script: |
          set -o pipefail
          cd /tmp/futures15m-build/Futures15mAlarm
          LOG=/tmp/v9522-gradle.log
          if ! gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            echo
            echo '========== GERÇEK DERLEME HATASI ÖZETİ =========='
            grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types|Execution failed for task|What went wrong|Caused by:' "$LOG" | head -n 120 || true
            echo '========== HATA ÇEVRESİ =========='
            FIRST=$(grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types' "$LOG" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$FIRST" ]; then
              START=$(( FIRST > 16 ? FIRST-16 : 1 )); END=$(( FIRST+42 )); sed -n "${START},${END}p" "$LOG"
            else
              tail -n 160 "$LOG"
            fi
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.22.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.22.apk"

    artifacts:
      - Futures15mAlarm-PRO-v9.5.22.apk