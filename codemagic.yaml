          grep -q 'R2542_CLOSE_EVENT_RECOVERY' brainhub/live-controller.js
          grep -q 'R2542_CLOSE_LATE_RECHECK' brainhub/live-controller.js
          node --test brainhub/test/r2542-close-idempotency.test.js
          echo R2542_CLOSED_TRADE_IDEMPOTENCY_OK
          echo R2542_DUPLICATE_CLOSE_WRITE_GUARD_OK
