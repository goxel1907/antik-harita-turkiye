workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v3 source
        script: |
          set -e
          SRC="$CM_BUILD_DIR/futures15m_alarm/Futures15mAlarm-PRO-v3-source.zip"
          test -s "$SRC"
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          python3 - "$SRC" /tmp/futures15m-build <<'PY'
          import base64
          import io
          import sys
          import zipfile
          from pathlib import Path

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          raw = src.read_bytes().strip()

          # The repository copy may be either a real ZIP or Base64 text containing a ZIP.
          if raw.startswith(b'PK'):
              data = raw
              print('Source is a binary ZIP.')
          else:
              try:
                  data = base64.b64decode(raw, validate=False)
              except Exception as exc:
                  raise SystemExit(f'Base64 decode failed: {exc}')
              print(f'Decoded Base64 source: {len(data)} bytes')

          if not data.startswith(b'PK'):
              raise SystemExit('Decoded source is not a ZIP archive.')

          with zipfile.ZipFile(io.BytesIO(data), 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              zf.extractall(out)
              print(f'Extracted {len(zf.namelist())} ZIP entries.')
          PY
          test -f /tmp/futures15m-build/Futures15mAlarm/settings.gradle
          test -f /tmp/futures15m-build/Futures15mAlarm/app/build.gradle
          test -f /tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app/MainActivity.java
          echo 'Futures Alarm v3 source package validated successfully.'
      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties
      - name: Check build tools
        script: |
          java -version
          gradle --version
      - name: Build installable debug APK
        script: |
          set -e
          cd /tmp/futures15m-build/Futures15mAlarm
          gradle --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v3.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v3.apk"
    artifacts:
      - Futures15mAlarm-PRO-v3.apk
