workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
      android_signing:
        - futures15m_stable
    scripts:
      - name: Prepare Futures Alarm v9.5.31 MANUAL PRO source
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9526_gradle_compat_bootstrap.py"
          bash "$CM_BUILD_DIR/futures15m_alarm/prepare_v9523.sh"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9527_trade_dashboard_reconcile.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9528_exact_margin.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9529_manual_close_reconcile.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9530_stable_signing.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9531_context_intelligence.py"

      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties

      - name: Check stable signing certificate
        script: |
          set -euo pipefail
          test -s "$CM_KEYSTORE_PATH"
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" | grep -E 'Alias name:|SHA256:'

      - name: Build installable v9.5.31 signed APK
        script: |
          set -o pipefail
          cd /tmp/futures15m-build/Futures15mAlarm
          LOG=/tmp/v9531-gradle.log
          if ! gradle --no-daemon assembleRelease --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            echo
            echo '========== GERÇEK DERLEME HATASI ÖZETİ =========='
            grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types|Execution failed for task|What went wrong|Caused by:' "$LOG" | head -n 180 || true
            echo '========== HATA ÇEVRESİ =========='
            FIRST=$(grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types' "$LOG" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$FIRST" ]; then
              START=$(( FIRST > 16 ? FIRST-16 : 1 )); END=$(( FIRST+70 )); sed -n "${START},${END}p" "$LOG"
            else
              tail -n 240 "$LOG"
            fi
            exit 1
          fi
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.31.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.31.apk"

    artifacts:
      - Futures15mAlarm-PRO-v9.5.31.apk
