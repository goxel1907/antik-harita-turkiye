workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v9 MANUAL PRO source
        script: |
          set -euo pipefail
          cat futures15m_alarm/v9.part*.b64 > /tmp/Futures15mAlarm-v9-source.b64
          python3 - <<'PY'
          import base64, hashlib, zipfile
          from pathlib import Path

          src = Path('/tmp/Futures15mAlarm-v9-source.b64')
          zip_path = Path('/tmp/Futures15mAlarm-v9-source.zip')
          data = base64.b64decode(src.read_text().strip())
          zip_path.write_bytes(data)
          print('v9 ZIP bytes:', len(data))
          print('v9 SHA256:', hashlib.sha256(data).hexdigest())
          if not zipfile.is_zipfile(zip_path):
              raise SystemExit('Decoded v9 source is not a valid ZIP')
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit('Corrupt ZIP member: ' + bad)
              names = set(zf.namelist())
              required = {
                  'Futures15mAlarm/settings.gradle',
                  'Futures15mAlarm/app/build.gradle',
                  'Futures15mAlarm/app/src/main/java/com/futuresalarm/app/MainActivity.java',
                  'Futures15mAlarm/app/src/main/java/com/futuresalarm/app/MonitorService.java',
                  'Futures15mAlarm/app/src/main/java/com/futuresalarm/app/TradePlan.java',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing required v9 files: ' + ', '.join(missing))
          print('v9 ZIP integrity OK.')
          PY
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v9-source.zip -d /tmp/futures15m-build
          APP=/tmp/futures15m-build/Futures15mAlarm
          JAVA="$APP/app/src/main/java/com/futuresalarm/app"
          test -f "$APP/settings.gradle"
          test -f "$APP/app/build.gradle"
          grep -q 'PRO v9' "$JAVA/MainActivity.java"
          grep -q 'MANUEL PRO' "$JAVA/MainActivity.java"
          grep -q 'CHATGPT PRO ANALİZ PROMPTUNU KOPYALA' "$JAVA/MainActivity.java"
          grep -q 'pullConfirmed' "$JAVA/MonitorService.java"
          grep -q 'resConfirmed' "$JAVA/MonitorService.java"
          grep -q 'versionCode 9' "$APP/app/build.gradle"
          grep -q "versionName '9.0.0'" "$APP/app/build.gradle"
          test ! -e "$JAVA/AiReviewClient.java"
          test ! -e "$JAVA/VisionChart.java"
          test ! -d "$APP/backend"
          echo 'v9 MANUAL PRO source validated: no AI API/backend, manual ChatGPT plan flow preserved.'
      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties
      - name: Check build tools
        script: |
          java -version
          gradle --version
      - name: Build installable v9 debug APK
        script: |
          set -e
          cd /tmp/futures15m-build/Futures15mAlarm
          gradle --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.apk"
    artifacts:
      - Futures15mAlarm-PRO-v9.apk
