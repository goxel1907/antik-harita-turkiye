workflows:
  futures-15m-alarm-apk:
    name: Futures 15m Alarm PRO APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: futures15m-alarm-public-build
          include: true
          source: true
    environment:
      java: 17
    scripts:
      - name: Prepare Futures Alarm v3 source
        script: |
          set -e
          cat futures15m_alarm/source.part*.b64 > /tmp/Futures15mAlarm-v2-source.b64
          python3 - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          b64_path = Path('/tmp/Futures15mAlarm-v2-source.b64')
          zip_path = Path('/tmp/Futures15mAlarm-v2-source.zip')
          raw = b64_path.read_bytes()
          data = base64.b64decode(raw)
          zip_path.write_bytes(data)
          print('Decoded source ZIP:', len(data), 'bytes')
          print('SHA256:', hashlib.sha256(data).hexdigest())
          if not zipfile.is_zipfile(zip_path):
              raise SystemExit('Decoded v2 source is not a valid ZIP')
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit('Corrupt ZIP member: ' + bad)
          PY
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v2-source.zip -d /tmp/futures15m-build
          cd /tmp/futures15m-build/Futures15mAlarm
          patch -p1 < "$CM_BUILD_DIR/futures15m_alarm/MainActivity-v3.patch"
          grep -q 'TOPLU GÜNCELLE' app/src/main/java/com/futuresalarm/app/MainActivity.java
          test -f settings.gradle
          test -f app/build.gradle
          echo 'Futures Alarm v3 source reconstructed and patched successfully.'
      - name: Set Android SDK location
        script: |
          set -e
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > /tmp/futures15m-build/Futures15mAlarm/local.properties
      - name: Check build tools
        script: |
          java -version
          gradle --version
      - name: Build installable debug APK
        script: |
          set -e
          cd /tmp/futures15m-build/Futures15mAlarm
          gradle --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v3.apk"
          ls -lh "$CM_BUILD_DIR/Futures15mAlarm-PRO-v3.apk"
    artifacts:
      - Futures15mAlarm-PRO-v3.apk
