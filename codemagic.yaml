      - name: Harden Android AAPT2 toolchain
        script: |
          set -euo pipefail
          APP=/tmp/futures15m-build/Futures15mAlarm
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cd "$APP"

          echo 'Host architecture:'
          uname -a
          uname -m
          echo 'Codemagic system Gradle:'
          gradle --version | sed -n '1,14p'

          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('build.gradle'), Path('settings.gradle'), Path('app/build.gradle')]
          changed = []
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text()
              n = s
              n = re.sub(
                  r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"])[^'\"]+(['\"])",
                  r"\g<1>8.13.2\2",
                  n,
              )
              n = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9][0-9A-Za-z.\-]*',
                  r'\g<1>8.13.2',
                  n,
              )
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))

          print('AGP patched files:', changed)
          combined = '\n'.join(p.read_text() for p in targets if p.exists())
          plugin_dsl_ok = re.search(
              r"id\s+['\"]com\.android\.application['\"]\s+version\s+['\"]8\.13\.2['\"]",
              combined,
          ) is not None
          classpath_ok = 'com.android.tools.build:gradle:8.13.2' in combined
          if not (plugin_dsl_ok or classpath_ok):
              print('--- build.gradle ---')
              print(Path('build.gradle').read_text() if Path('build.gradle').exists() else '<missing>')
              print('--- settings.gradle ---')
              print(Path('settings.gradle').read_text() if Path('settings.gradle').exists() else '<missing>')
              raise SystemExit('AGP 8.13.2 marker not found after plugin/classpath patch')
          print('AGP 8.13.2 marker OK; plugin DSL=', plugin_dsl_ok, 'classpath=', classpath_ok)
          PY

          gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          install_bt() {
            ver="$1"
            [ -x "$SDK_PATH/build-tools/$ver/aapt2" ] && return 0
            log="/tmp/v9543-sdkmanager-${ver}.log"
            echo "Installing Android build-tools $ver ..."
            set +e
            set +o pipefail
            yes | "$SDKMANAGER" "build-tools;$ver" >"$log" 2>&1
            rc=${PIPESTATUS[1]}
            set -o pipefail
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "build-tools $ver install failed rc=$rc"
              tail -n 80 "$log" || true
              return "$rc"
            fi
          }

          probe_aapt2() {
            ver="$1"
            bin="$SDK_PATH/build-tools/$ver/aapt2"
            out="/tmp/v9543-aapt2-${ver}.zip"
            mini="/tmp/v9543-aapt2-mini-${ver}"
            [ -x "$bin" ] || return 1
            echo "===== AAPT2 candidate $ver ====="
            file "$bin" || true
            "$bin" version || return 1
            rm -rf "$mini" "$out"
            mkdir -p "$mini/res/values"
            printf '%s\n' '<resources><string name="v9543_probe">probe</string></resources>' > "$mini/res/values/strings.xml"
            "$bin" compile --dir "$mini/res" -o "$mini/mini.zip" || return 1
            test -s "$mini/mini.zip" || return 1
            "$bin" compile --dir app/src/main/res -o "$out" || return 1
            test -s "$out" || return 1
            echo "AAPT2 $ver passed minimal + full-project resource smoke tests."
          }

          SELECTED_AAPT2=''
          SELECTED_VER=''
          for ver in 36.0.0 34.0.0; do
            install_bt "$ver" || continue
            if probe_aapt2 "$ver"; then
              SELECTED_VER="$ver"
              SELECTED_AAPT2="$SDK_PATH/build-tools/$ver/aapt2"
              break
            fi
            echo "AAPT2 $ver rejected by smoke test."
          done

          if [ -z "$SELECTED_AAPT2" ]; then
            echo 'No SDK AAPT2 candidate survived the full-project resource smoke test.'
            DIAG="$SDK_PATH/build-tools/36.0.0/aapt2"
            if [ -x "$DIAG" ]; then
              echo 'Per-resource crash diagnostics with build-tools 36.0.0:'
              rm -rf /tmp/v9543-aapt2-single
              mkdir -p /tmp/v9543-aapt2-single
              while IFS= read -r f; do
                rm -rf /tmp/v9543-aapt2-single/*
                set +e
                "$DIAG" compile "$f" -o /tmp/v9543-aapt2-single >/tmp/v9543-aapt2-single.log 2>&1
                rc=$?
                set -e
                if [ "$rc" -ge 128 ]; then
                  echo "AAPT2 RESOURCE CRASH rc=$rc: $f"
                  cat /tmp/v9543-aapt2-single.log || true
                  exit "$rc"
                fi
              done < <(find app/src/main/res -type f -print | sort)
            fi
            echo 'AAPT2_RESOURCE_SMOKE_ALL_CANDIDATES_FAILED'
            exit 97
          fi

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.vfs.watch=false
          android.useAndroidX=true
          android.aapt2FromMavenOverride=$SELECTED_AAPT2
          EOF

          echo "Selected AAPT2: $SELECTED_VER -> $SELECTED_AAPT2"
          grep -R -n -E "com.android.application|com.android.tools.build:gradle" build.gradle settings.gradle app/build.gradle 2>/dev/null || true
          ./gradlew --version | sed -n '1,14p'
          echo 'AGP 8.13.2 + Gradle 8.13 + smoke-tested AAPT2 ready.'

      - name: Check stable signing certificate
        script: |
          set -euo pipefail
          test -s "$CM_KEYSTORE_PATH"
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" | grep -E 'Alias name:|SHA256:'
          TMP_SIGN="$(mktemp -d)"
          printf 'signing-probe\n' > "$TMP_SIGN/probe.txt"
          (cd "$TMP_SIGN" && jar cf probe.jar probe.txt)
          jarsigner -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" "$TMP_SIGN/probe.jar" "$CM_KEY_ALIAS" >/dev/null
          echo 'Stable keystore private key check OK.'

      - name: Build installable v9.5.115-r2541 PC-only fail-closed signed APK
        script: |
          set -o pipefail
          cd /tmp/futures15m-build/Futures15mAlarm
          LOG=/tmp/v9595-gradle.log
          if ! ./gradlew --no-daemon --max-workers=1 assembleRelease --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            cp "$LOG" "$CM_BUILD_DIR/v9595-gradle.log" || true
            echo
            echo '========== SON 220 SATIR (STACKTRACE/BAĞLAM) =========='
            tail -n 220 "$LOG" || true
            echo
            echo '========== FINAL ROOT CAUSE • EN ALTTA BUNU GÖNDER =========='
            python3 - "$LOG" <<'PY'
          import re, sys
          from pathlib import Path

          p=Path(sys.argv[1])
          lines=p.read_text(errors='replace').splitlines()
          pats=[
              r'\berror:', r'cannot find symbol', r'unreported exception',
              r'incompatible types', r'illegal start', r'unclosed', r'expected',
              r'not a statement', r'Execution failed for task', r'What went wrong',
              r'Caused by:', r'AAPT2', r'resource .* not found', r'Android resource linking failed',
              r'Could not resolve', r'Could not find', r'Failed to read key',
              r'Cannot recover key', r'Keystore', r'SIGBUS', r'SIGSEGV', r'Bus error',
          ]
          rx=re.compile('|'.join('(?:'+x+')' for x in pats),re.I)
          hits=[i for i,s in enumerate(lines) if rx.search(s)]
          strong=[]
          for i in hits:
              s=lines[i]
              if re.search(r'\berror:|cannot find symbol|incompatible types|illegal start|unclosed|not a statement|resource .* not found|Android resource linking failed|AAPT2',s,re.I):
                  strong.append(i)
          chosen=(strong[0] if strong else (hits[0] if hits else max(0,len(lines)-60)))
          lo=max(0,chosen-18); hi=min(len(lines),chosen+26)
          print(f'ROOT_CAUSE_LINE={chosen+1}  CONTEXT={lo+1}-{hi}')
          for j in range(lo,hi):
              print(f'{j+1}: {lines[j]}')
          print('--- MATCHED ERROR LINES (ilk 40) ---')
          for i in hits[:40]:
              print(f'{i+1}: {lines[i]}')
          print('=== ROOT CAUSE END ===')
          PY
            exit 1
          fi
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.115-R2541-HF4.apk"

          APK="$CM_BUILD_DIR/Futures15mAlarm-PRO-v9.5.115-R2541-HF4.apk"
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo '========== RELEASE APK SHA256 =========='
          shasum -a 256 "$APK"
          ls -lh "$APK"
          echo 'SIGNED_RELEASE_APK_VERIFIED'

    artifacts:
