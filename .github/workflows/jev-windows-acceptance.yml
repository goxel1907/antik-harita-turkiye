name: JEV isolated Windows acceptance

on:
  push:
    branches: [codex/jev-credit-fallback-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-components:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Native Windows PowerShell, DPAPI, deploy guards and isolated Node tests
        run: |
          & .\brainhub\delivery-tools\credit-failover\Test-WindowsAcceptance.ps1 -Repository $PWD.Path -OutDir "$env:RUNNER_TEMP\jev-windows-acceptance"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-component-evidence
          path: ${{ runner.temp }}/jev-windows-acceptance
          retention-days: 7
          if-no-files-found: warn
