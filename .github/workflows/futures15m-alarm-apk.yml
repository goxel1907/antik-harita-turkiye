name: Futures 15m Alarm v9.5.22 APK

on:
  push:
    branches:
      - futures15m-alarm-public-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v9.5.22 source
        shell: bash
        run: |
          set -euo pipefail
          cat futures15m_alarm/v9.part00.b64 futures15m_alarm/v9.part01.b64 futures15m_alarm/v9.fix02a.b64 futures15m_alarm/v9.fix02b.b64 futures15m_alarm/v9.part03.b64 futures15m_alarm/v9.part04.b64 > /tmp/Futures15mAlarm-v9-source.b64
          python3 - <<'PY'
          import base64,zipfile
          from pathlib import Path
          src=Path('/tmp/Futures15mAlarm-v9-source.b64'); dst=Path('/tmp/Futures15mAlarm-v9-source.zip')
          data=base64.b64decode(src.read_text().strip()); dst.write_bytes(data)
          if not zipfile.is_zipfile(dst): raise SystemExit('Decoded v9 source is not a ZIP')
          with zipfile.ZipFile(dst,'r') as zf:
              bad=zf.testzip()
              if bad: raise SystemExit('Corrupt ZIP member: '+bad)
          PY
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-v9-source.zip -d /tmp/futures15m-build

          python3 "$CM_BUILD_DIR/futures15m_alarm/v91_patch.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v92_binance_patch.py"
          python3 - <<'PY'
          import base64,gzip,os
          from pathlib import Path
          root=Path('/tmp/futures15m-build/Futures15mAlarm/app/src/main/java/com/futuresalarm/app')
          build=Path('/tmp/futures15m-build/Futures15mAlarm/app/build.gradle')
          srcroot=Path(os.environ['CM_BUILD_DIR'])/'futures15m_alarm'
          for payload,target in [('v93_MainActivity.gz.b64',root/'MainActivity.java'),('v93_MonitorService.gz.b64',root/'MonitorService.java')]:
              target.write_bytes(gzip.decompress(base64.b64decode((srcroot/payload).read_text().strip())))
          b=build.read_text().replace('versionCode 11','versionCode 12').replace("versionName '9.2.0'","versionName '9.3.0'")
          build.write_text(b)
          PY
          for patch in \
            v94_patch.py v95_pre_anchor.py v95_patch.py v951_import_dialog_fix.py \
            v952_logic_ui_fix.py v953_signal_guard.py v954_reclaim_precision.py v955_ui_icon.py \
            v956_stale_flow_radar.py v957_launcher_cache_fix.py v958_forming_candles.py \
            v959_conditional_scenarios.py v9510_plan_parser.py v9511_same_chat_external.py \
            v9512_chatgpt_launch_fix.py v9513_prompt_image_handoff.py v9514_java_string_fix.py \
            v9515_prompt_dialog_ui.py v9516_structure_engine.py v9517_fresh_signal_history_hunt.py \
            v9517b_flow_stability.py v9518a_ui_tr.py v9518b_signal_tracking.py \
            v9519_prompt_quality.py v9520_professional_ui_prompt.py v9520b_turkish_labels.py \
            v9520c_compile_safe.py v9521_trade_handoff_logic.py v9522a_weighted_ltf.py \
            v9522b_api_order.py; do
              python3 "$CM_BUILD_DIR/futures15m_alarm/$patch"
          done

          python3 - <<'PY'
          from pathlib import Path
          app=Path('/tmp/futures15m-build/Futures15mAlarm')
          main=(app/'app/src/main/java/com/futuresalarm/app/MainActivity.java').read_text()
          mon=(app/'app/src/main/java/com/futuresalarm/app/MonitorService.java').read_text()
          ana=(app/'app/src/main/java/com/futuresalarm/app/AnalysisPackActivity.java').read_text()
          build=(app/'app/build.gradle').read_text()
          checks={
            'API':'V9522_API_ORDER' in main and 'AndroidKeyStore' in main,
            'manual confirm':'SON EMİR ONAYI' in main,
            'weighted':'V9522_WEIGHTED_FLOW' in mon and 'V9522_WEIGHTED_DECISION_LTF' in ana,
            'LTF':'{"15m", "5m", "3m", "1h", "4h", "1d"}' in ana,
            'version':'versionCode 36' in build and "versionName '9.5.22'" in build,
          }
          for k,v in checks.items(): print(('OK   ' if v else 'FAIL '), k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('v9.5.22 sanity failed: '+', '.join(bad))
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          APP=/tmp/futures15m-build/Futures15mAlarm
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > "$APP/local.properties"
          cd "$APP"
          LOG=/tmp/v9522-gh-gradle.log
          if ! gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            echo '========== GERÇEK DERLEME HATASI =========='
            grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types|Execution failed for task|What went wrong|Caused by:' "$LOG" | head -n 120 || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Futures15mAlarm-PRO-v9.5.22.apk"

      - name: Upload v9.5.22 APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures15mAlarm-PRO-v9.5.22
          path: Futures15mAlarm-PRO-v9.5.22.apk
          if-no-files-found: error
          retention-days: 14
