name: Futures 15m Alarm v9.5.29 APK

on:
  push:
    branches:
      - futures15m-alarm-public-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v9.5.29 source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9526_gradle_compat_bootstrap.py"
          bash "$CM_BUILD_DIR/futures15m_alarm/prepare_v9523.sh"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9527_trade_dashboard_reconcile.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9528_exact_margin.py"
          python3 "$CM_BUILD_DIR/futures15m_alarm/v9529_manual_close_reconcile.py"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          APP=/tmp/futures15m-build/Futures15mAlarm
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > "$APP/local.properties"
          cd "$APP"
          LOG=/tmp/v9529-gh-gradle.log
          if ! gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            echo '========== GERÇEK DERLEME HATASI =========='
            grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types|Execution failed for task|What went wrong|Caused by:' "$LOG" | head -n 180 || true
            echo '========== HATA ÇEVRESİ =========='
            FIRST=$(grep -n -E -i 'error:|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types' "$LOG" | head -n 1 | cut -d: -f1 || true)
            if [ -n "$FIRST" ]; then
              START=$(( FIRST > 20 ? FIRST-20 : 1 )); END=$(( FIRST+70 )); sed -n "${START},${END}p" "$LOG"
            else
              tail -n 240 "$LOG"
            fi
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Futures15mAlarm-PRO-v9.5.29.apk"

      - name: Upload v9.5.29 APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures15mAlarm-PRO-v9.5.29
          path: Futures15mAlarm-PRO-v9.5.29.apk
          if-no-files-found: error
          retention-days: 14
