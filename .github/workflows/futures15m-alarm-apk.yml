name: Futures 15m Alarm APK

on:
  push:
    branches:
      - futures15m-alarm-public-build
    paths:
      - 'futures15m_alarm/**'
      - '.github/workflows/futures15m-alarm-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source package
        shell: bash
        run: |
          set -euo pipefail
          cat futures15m_alarm/source.part*.b64 > /tmp/Futures15mAlarm-PRO-v2-source.b64
          echo 'b76f2b4756bbf87d152f60bd968842e326fe34fcc71a170a65b9360f55ace6a3  /tmp/Futures15mAlarm-PRO-v2-source.b64' | sha256sum -c -
          base64 -d /tmp/Futures15mAlarm-PRO-v2-source.b64 > /tmp/Futures15mAlarm-PRO-v2-source.zip
          echo '424617555267c681888750d05fbee453f39de396f7f02e445333cf8df8aa13dd  /tmp/Futures15mAlarm-PRO-v2-source.zip' | sha256sum -c -
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q /tmp/Futures15mAlarm-PRO-v2-source.zip -d /tmp/futures15m-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/futures15m-build/Futures15mAlarm
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s /tmp/futures15m-build/Futures15mAlarm/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/futures15m-build/Futures15mAlarm/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures15mAlarm-PRO-v2-APK
          path: /tmp/futures15m-build/Futures15mAlarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
