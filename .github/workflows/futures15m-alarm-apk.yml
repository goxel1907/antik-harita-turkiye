name: Futures 15m Alarm APK

on:
  push:
    branches:
      - futures15m-alarm-public-build
    paths:
      - 'futures15m_alarm/Futures15mAlarm-PRO-v3-source.zip'
      - '.github/workflows/futures15m-alarm-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/futures15m_alarm/Futures15mAlarm-PRO-v3-source.zip"
          echo 'c9603cb74f52d370ce248c8af7cd3a49fe14e854529eca0eee7c016ff133c4b7  '"$SRC" | sha256sum -c -
          rm -rf /tmp/futures15m-build
          mkdir -p /tmp/futures15m-build
          unzip -q "$SRC" -d /tmp/futures15m-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/futures15m-build/Futures15mAlarm
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futures15mAlarm-PRO-v3-APK
          path: /tmp/futures15m-build/Futures15mAlarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
