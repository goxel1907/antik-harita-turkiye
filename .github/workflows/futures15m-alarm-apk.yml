name: Futures 15m Alarm v9.5.95 compile check

on:
  push:
    branches:
      - futures15m-alarm-public-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
      FUTURES_COMPILE_ONLY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Brain Hub syntax and Vision regression tests
        run: |
          node --check brainhub/server.js
          node --check brainhub/pipeline.js
          node --check brainhub/live-controller.js
          node --test brainhub/test/engine-store.test.js brainhub/test/pipeline-context.test.js brainhub/test/vision-routing-integration.test.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare v9.5.95 source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/tools/run_futures_source_chain.py"

      - name: Compile debug APK for validation only
        shell: bash
        run: |
          set -o pipefail
          APP=/tmp/futures15m-build/Futures15mAlarm
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > "$APP/local.properties"
          cd "$APP"
          LOG=/tmp/v9538-gh-gradle.log
          if ! gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee "$LOG"; then
            echo '========== SON 100 SATIR =========='
            tail -n 100 "$LOG" || true
            echo '========== GERÇEK DERLEME HATASI =========='
            grep -n -E -i 'error:|unreported exception|JSONException|cannot find symbol|unclosed|illegal|expected|not a statement|incompatible types|Could not resolve|Could not find|Execution failed for task|What went wrong|Caused by:' "$LOG" | tail -n 220 || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Do not publish debug APK
        shell: bash
        run: echo 'GitHub Actions only validates compilation. Installable updates come from the persistently signed Codemagic release APK.'
